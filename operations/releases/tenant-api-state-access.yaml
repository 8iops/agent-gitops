---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tenant-api-state-capacity
  namespace: tenant-infrastructure
rules:
- apiGroups:
  - ''
  resources:
  - persistentvolumeclaims
  resourceNames:
  - tenant-platform-state
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - apps
  resources:
  - deployments
  resourceNames:
  - tenant-control-controller
  verbs:
  - get
  - patch
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tenant-api-state-capacity
  namespace: tenant-infrastructure
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tenant-api-state-capacity
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: re8ch:release-executor:agent-runtime

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-runtime-exact-tenant-api-manager
  namespace: tenant-infrastructure
  labels:
    delivery.re8ch.com/retirement-only: 'true'
rules:
- apiGroups: ['']
  resources: [configmaps]
  resourceNames: [ssa-state-agent-runtime-exact-tenant-api-manager]
  verbs: [get, patch, update]
- apiGroups: [apps]
  resources: [deployments]
  resourceNames: [tenant-api]
  verbs: [get, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-runtime-exact-tenant-api-manager
  namespace: tenant-infrastructure
  labels:
    delivery.re8ch.com/retirement-only: 'true'
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-runtime-exact-tenant-api-manager
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: re8ch:release-executor:agent-runtime

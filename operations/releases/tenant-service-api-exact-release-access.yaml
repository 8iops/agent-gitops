apiVersion: v1
kind: ConfigMap
metadata:
  name: ssa-state-agent-runtime-exact-tenant-service-api-manager
  namespace: tenant-infrastructure
  labels:
    delivery.re8ch.com/state: accepted
    delivery.re8ch.com/authority-domain: agent-runtime
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-runtime-exact-tenant-service-api-manager
  namespace: tenant-infrastructure
rules:
- apiGroups: ['']
  resources: [configmaps]
  resourceNames: [ssa-state-agent-runtime-exact-tenant-service-api-manager]
  verbs: [get, patch, update]
- apiGroups: [apps]
  resources: [deployments]
  verbs: [create]
- apiGroups: ['']
  resources: [persistentvolumeclaims, services, serviceaccounts]
  verbs: [create]
- apiGroups: [cilium.io]
  resources: [ciliumnetworkpolicies]
  verbs: [create]
- apiGroups: [networking.k8s.io]
  resources: [networkpolicies]
  verbs: [create]
- apiGroups: [apps]
  resources: [deployments]
  resourceNames: [tenant-control-controller, tenant-service-api]
  verbs: [get, patch, update]
- apiGroups: ['']
  resources: [persistentvolumeclaims]
  resourceNames: [tenant-platform-state]
  verbs: [get, patch, update]
- apiGroups: ['']
  resources: [services, serviceaccounts]
  resourceNames: [tenant-service-api]
  verbs: [get, patch, update]
- apiGroups: [cilium.io]
  resources: [ciliumnetworkpolicies]
  resourceNames: [tenant-service-api-gateway]
  verbs: [get, patch, update]
- apiGroups: [networking.k8s.io]
  resources: [networkpolicies]
  resourceNames: [tenant-service-api]
  verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-runtime-exact-tenant-service-api-manager
  namespace: tenant-infrastructure
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-runtime-exact-tenant-service-api-manager
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: re8ch:release-executor:agent-runtime

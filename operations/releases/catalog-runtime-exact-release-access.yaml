apiVersion: v1
kind: ConfigMap
metadata:
  name: ssa-state-agent-runtime-exact-catalog-runtime-manager
  namespace: tenant-infrastructure
  labels:
    delivery.re8ch.com/state: accepted
    delivery.re8ch.com/authority-domain: agent-runtime
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-runtime-exact-catalog-runtime-manager
  namespace: tenant-infrastructure
rules:
- apiGroups: ['']
  resources: [configmaps]
  resourceNames: [ssa-state-agent-runtime-exact-catalog-runtime-manager]
  verbs: [get, patch, update]
- apiGroups: ['']
  resources: [persistentvolumeclaims, services, serviceaccounts]
  verbs: [create]
- apiGroups: [apps]
  resources: [deployments]
  verbs: [create]
- apiGroups: [networking.k8s.io]
  resources: [networkpolicies]
  verbs: [create]
- apiGroups: [policy]
  resources: [poddisruptionbudgets]
  verbs: [create]
- apiGroups: ['']
  resources: [persistentvolumeclaims, services, serviceaccounts]
  resourceNames: [re8ch-catalog-runtime, re8ch-catalog-runtime-state-rbd]
  verbs: [get, patch, update]
- apiGroups: [apps]
  resources: [deployments]
  resourceNames: [re8ch-catalog-runtime]
  verbs: [get, patch, update]
- apiGroups: [networking.k8s.io]
  resources: [networkpolicies]
  resourceNames: [re8ch-catalog-runtime, postgresql-provider-catalog-runtime]
  verbs: [get, patch, update]
- apiGroups: [policy]
  resources: [poddisruptionbudgets]
  resourceNames: [re8ch-catalog-runtime]
  verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-runtime-exact-catalog-runtime-manager
  namespace: tenant-infrastructure
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-runtime-exact-catalog-runtime-manager
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: re8ch:release-executor:agent-runtime

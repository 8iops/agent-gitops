apiVersion: v1
kind: Secret
metadata:
  name: stalwart-migration-backup-key
  namespace: mail-system
  annotations:
    re8ch.com/backup-key-state: pending
type: Opaque
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stalwart-backup-key-init
  namespace: mail-system
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: stalwart-backup-key-init
  namespace: mail-system
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  resourceNames:
  - stalwart-migration-backup-key
  verbs:
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: stalwart-backup-key-init
  namespace: mail-system
subjects:
- kind: ServiceAccount
  name: stalwart-backup-key-init
  namespace: mail-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: stalwart-backup-key-init
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stalwart-migration-backup-overseas
  namespace: mail-system
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 4Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: stalwart-backup-no-network
  namespace: mail-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: stalwart-cold-backup
  policyTypes:
  - Ingress
  - Egress
  ingress: []
  egress: []
---
apiVersion: batch/v1
kind: Job
metadata:
  name: stalwart-backup-key-init
  namespace: mail-system
spec:
  suspend: true
  backoffLimit: 0
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stalwart-backup-key-init
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: overseas-flk
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 2000
      containers:
      - name: backup
        image: ghcr.io/stalwartlabs/stalwart:v0.16.18@sha256:9ed1d343243b7aa72969e372a7240b7ddea07730781d4b68a0dc3d8d51c418bb
        command:
        - /bin/sh
        - /scripts/key-init.sh
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: '1'
            memory: 128Mi
        volumeMounts:
        - name: script
          mountPath: /scripts
          readOnly: true
        - name: work
          mountPath: /work
        - name: api
          mountPath: /var/run/backup-api
          readOnly: true
      volumes:
      - name: script
        configMap:
          name: stalwart-backup-scripts
          defaultMode: 365
      - name: work
        emptyDir:
          medium: Memory
          sizeLimit: 16Mi
      - name: api
        projected:
          defaultMode: 256
          sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 600
          - configMap:
              name: kube-root-ca.crt
              items:
              - key: ca.crt
                path: ca.crt
      serviceAccountName: stalwart-backup-key-init
      tolerations:
      - key: dedicated
        operator: Equal
        value: overseas-edge
        effect: NoSchedule
      - key: scheduling.re8ch.com/capacity-window
        operator: Equal
        value: closed
        effect: NoSchedule
---
apiVersion: batch/v1
kind: Job
metadata:
  name: stalwart-cold-backup
  namespace: mail-system
spec:
  suspend: true
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stalwart-cold-backup
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: overseas-flk
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: backup
        image: ghcr.io/stalwartlabs/stalwart:v0.16.18@sha256:9ed1d343243b7aa72969e372a7240b7ddea07730781d4b68a0dc3d8d51c418bb
        command:
        - /bin/sh
        - /scripts/archive.sh
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            cpu: '1'
            memory: 1536Mi
        volumeMounts:
        - name: script
          mountPath: /scripts
          readOnly: true
        - name: work
          mountPath: /work
        - name: source
          mountPath: /source
          readOnly: true
        - name: backup
          mountPath: /backup
        - name: keys
          mountPath: /keys
          readOnly: true
      volumes:
      - name: script
        configMap:
          name: stalwart-backup-scripts
          defaultMode: 365
      - name: work
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
      - name: source
        persistentVolumeClaim:
          claimName: stalwart-flk-local-data
          readOnly: true
      - name: backup
        persistentVolumeClaim:
          claimName: stalwart-migration-backup-overseas
      - name: keys
        secret:
          secretName: stalwart-migration-backup-key
          defaultMode: 292
      tolerations:
      - key: dedicated
        operator: Equal
        value: overseas-edge
        effect: NoSchedule
      - key: scheduling.re8ch.com/capacity-window
        operator: Equal
        value: closed
        effect: NoSchedule
---

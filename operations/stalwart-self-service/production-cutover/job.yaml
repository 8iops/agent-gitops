apiVersion: batch/v1
kind: Job
metadata:
  name: stalwart-production-v1-migrate
  namespace: mail-system
  labels:
    app.kubernetes.io/name: stalwart-production-migration
    app.kubernetes.io/component: production-migration
  annotations:
    governance.re8ch.com/reviewed-source: 8iops/agent-gitops
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stalwart-production-migration
        app.kubernetes.io/component: production-migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: overseas-flk
      tolerations:
        - key: dedicated
          operator: Equal
          value: overseas-edge
          effect: NoSchedule
        - key: scheduling.re8ch.com/capacity-window
          operator: Equal
          value: closed
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: reset-production-target
          image: alpine:3.23.3@sha256:25109184c71bdad752c8312a8623239686a9a2071e8825f20acb8f2198c3f659
          command: [/bin/sh, -ceu]
          args:
            - |
              test -s /source/database/CURRENT
              test -s /state/answers-candidate-v1/answers.toml
              rm -rf /target/database /state/production-v1
              install -d -m 700 /state/production-v1/native
              install -m 600 /state/answers-candidate-v1/answers.toml /state/production-v1/native/answers.toml
              printf '{"reset":true,"sourceReady":true,"reviewedAnswersCopied":true}\n'
          volumeMounts:
            - {name: source, mountPath: /source, readOnly: true}
            - {name: target, mountPath: /target}
            - {name: state, mountPath: /state}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext: &containerSecurity
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
        - name: migrate-production
          image: docker.io/stalwartlabs/stalwart-migrate:1.0.3@sha256:1e936a872424bb8856ac2186129266f5179e516d9dbf58853c73364e6e0fc563
          command: [/bin/sh, -ceu]
          args:
            - |
              umask 077
              unset CONFIG_PATH
              state=/state/production-v1/native
              mkdir -p /work
              printf '%s' '{"@type":"RocksDb","path":"/source/database"}' > /work/source.json
              printf '%s' '{"@type":"RocksDb","path":"/target/database"}' > /work/target.json
              run_step() {
                name=$1
                shift
                mkdir -m 700 "/state/production-v1/$name"
                if ! "$@" >"/state/production-v1/$name/stdout" 2>"/state/production-v1/$name/stderr"; then
                  printf '{"migration":"failed","step":"%s"}\n' "$name"
                  exit 1
                fi
                printf '0\n' > "/state/production-v1/$name/exit"
              }
              run_step prepare stalwart-migrate prepare --source /work/source.json --state "$state" --non-interactive
              test -s "$state/prepare-report.txt"
              run_step forward stalwart-migrate run --source /work/source.json --target /work/target.json --state "$state"
              test -s /target/database/CURRENT
              run_step full-verify stalwart-migrate verify --full --source /work/source.json --target /work/target.json --state "$state"
              run_step final stalwart-migrate run --final --yes --source /work/source.json --target /work/target.json --state "$state"
              test -s "$state/final-report.txt"
              run_step post-final-verify stalwart-migrate verify --full --source /work/source.json --target /work/target.json --state "$state"
              sync
              printf '{"migration":"complete","prepare":true,"forward":true,"fullVerify":true,"final":true,"postFinalVerify":true}\n'
          volumeMounts:
            - {name: source, mountPath: /source, readOnly: true}
            - {name: target, mountPath: /target}
            - {name: state, mountPath: /state}
            - {name: work, mountPath: /work}
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {cpu: "1", memory: 1536Mi}
          securityContext: *containerSecurity
        - name: verify-v1-startup
          image: ghcr.io/stalwartlabs/stalwart:v1.0.1@sha256:b9da4df8b4efc06bc926dd6e990bdeb0ad7b9261a7c3893d74b0461a00bb389b
          command: [/bin/sh, -ceu]
          args:
            - |
              test -s /target/database/CURRENT
              test -s /state/production-v1/native/final-report.txt
              printf '%s' '{"@type":"RocksDb","path":"/target/database"}' > /work/config.json
              /usr/local/bin/stalwart --config /work/config.json >/state/production-v1/startup.stdout 2>/state/production-v1/startup.stderr &
              server_pid=$!
              cleanup() {
                kill -TERM "$server_pid" 2>/dev/null || true
                wait "$server_pid" 2>/dev/null || true
              }
              trap cleanup EXIT
              ready=false
              deadline=$(($(date +%s) + 180))
              while [ "$(date +%s)" -lt "$deadline" ]; do
                kill -0 "$server_pid" 2>/dev/null || break
                code=$(curl --noproxy '*' -sSk --connect-timeout 1 --max-time 1 -o /dev/null -w '%{http_code}' \
                  -H 'X-Forwarded-For: 127.0.0.1' https://127.0.0.1:443/healthz/ready 2>/dev/null) || code=000
                if [ "$code" = 200 ]; then ready=true; break; fi
                sleep 1
              done
              test "$ready" = true
              kill -TERM "$server_pid"
              wait "$server_pid"
              trap - EXIT
              printf 'ready-and-cleanly-stopped\n' > /state/production-v1/ACCEPTED
              sync
              printf '{"v1Startup":"pass","version":"1.0.1","cleanShutdown":true}\n'
          volumeMounts:
            - {name: target, mountPath: /target}
            - {name: state, mountPath: /state}
            - {name: work, mountPath: /work}
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {cpu: "1", memory: 1536Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [NET_BIND_SERVICE]
      containers:
        - name: result
          image: alpine:3.23.3@sha256:25109184c71bdad752c8312a8623239686a9a2071e8825f20acb8f2198c3f659
          command: [/bin/sh, -ceu]
          args:
            - |
              test "$(cat /state/production-v1/ACCEPTED)" = ready-and-cleanly-stopped
              test -s /target/database/CURRENT
              printf 'production-v1\n' > /target/.r640-migration-v2-complete
              sync
              printf '{"productionMigration":"complete","targetStartupVerified":true}\n'
          volumeMounts:
            - {name: target, mountPath: /target}
            - {name: state, mountPath: /state, readOnly: true}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext: *containerSecurity
      volumes:
        - name: source
          persistentVolumeClaim:
            claimName: stalwart-flk-local-data
        - name: target
          persistentVolumeClaim:
            claimName: stalwart-rehearsal-target-v1-local
        - name: state
          persistentVolumeClaim:
            claimName: stalwart-rehearsal-migration-state-local
        - name: work
          emptyDir: {}

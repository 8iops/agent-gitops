apiVersion: v1
kind: ConfigMap
metadata:
  name: migration-store-config
  namespace: stalwart-migration-rehearsal
data:
  source.json: '{"@type": "RocksDb", "path": "/var/lib/stalwart"}'
  target.json: '{"@type": "RocksDb", "path": "/var/lib/stalwart-v1"}'
  rollback.json: '{"@type": "RocksDb", "path": "/var/lib/stalwart-rollback"}'
---
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-prepare
  namespace: stalwart-migration-rehearsal
spec:
  suspend: true
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stalwart-migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: migrate
        image: docker.io/stalwartlabs/stalwart-migrate:1.0.3@sha256:1e936a872424bb8856ac2186129266f5179e516d9dbf58853c73364e6e0fc563
        args:
        - prepare
        - --non-interactive
        - --source
        - /config/source.json
        - --state
        - /state/forward
        resources:
          requests:
            cpu: '1'
            memory: 2Gi
          limits:
            cpu: '2'
            memory: 4Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: source
          mountPath: /var/lib/stalwart
          readOnly: true
        - name: target
          mountPath: /var/lib/stalwart-v1
          readOnly: false
        - name: state
          mountPath: /state
          readOnly: false
        - name: config
          mountPath: /config
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: source
        persistentVolumeClaim:
          claimName: source-v01627
          readOnly: true
      - name: target
        persistentVolumeClaim:
          claimName: target-v1
          readOnly: false
      - name: state
        persistentVolumeClaim:
          claimName: migration-state
          readOnly: false
      - name: config
        configMap:
          name: migration-store-config
      - name: tmp
        emptyDir:
          sizeLimit: 256Mi
---

apiVersion: v1
kind: ConfigMap
metadata:
  name: stalwart-rehearsal-migration-store-config
  namespace: mail-system
data:
  source.json: '{"@type": "RocksDb", "path": "/var/lib/stalwart/startup-v2/database"}'
  target.json: '{"@type": "RocksDb", "path": "/var/lib/stalwart-v1/database"}'
  rollback.json: '{"@type": "RocksDb", "path": "/var/lib/stalwart-rollback/database"}'
---
apiVersion: batch/v1
kind: Job
metadata:
  name: stalwart-rehearsal-migrate-prepare-local
  namespace: mail-system
spec:
  suspend: true
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stalwart-migrate
        re8ch.com/stalwart-rehearsal: 'true'
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: migrate
        image: docker.io/stalwartlabs/stalwart-migrate:1.0.3@sha256:1e936a872424bb8856ac2186129266f5179e516d9dbf58853c73364e6e0fc563
        args:
        - prepare
        - --non-interactive
        - --source
        - /config/source.json
        - --state
        - /state/forward
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: '1'
            memory: 1536Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: source
          mountPath: /var/lib/stalwart
          readOnly: true
        - name: target
          mountPath: /var/lib/stalwart-v1
          readOnly: false
        - name: state
          mountPath: /state
          readOnly: false
        - name: config
          mountPath: /config
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: source
        persistentVolumeClaim:
          claimName: stalwart-rehearsal-source-v01627-local
          readOnly: true
      - name: target
        persistentVolumeClaim:
          claimName: stalwart-rehearsal-target-v1-local
          readOnly: false
      - name: state
        persistentVolumeClaim:
          claimName: stalwart-rehearsal-migration-state-local
          readOnly: false
      - name: config
        configMap:
          name: stalwart-rehearsal-migration-store-config
      - name: tmp
        emptyDir:
          sizeLimit: 256Mi
      nodeSelector:
        kubernetes.io/hostname: overseas-flk
      tolerations:
      - key: dedicated
        operator: Equal
        value: overseas-edge
        effect: NoSchedule
      - key: scheduling.re8ch.com/capacity-window
        operator: Equal
        value: closed
        effect: NoSchedule
---

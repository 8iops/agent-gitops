apiVersion: batch/v1
kind: Job
metadata:
  name: stalwart-rehearsal-startup-diagnostic
  namespace: mail-system
spec:
  suspend: true
  backoffLimit: 0
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stalwart-migrate
        re8ch.com/stalwart-rehearsal: 'true'
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: classify
        image: ghcr.io/stalwartlabs/stalwart:v0.16.27@sha256:c429b311c93db5606598abc1c68225a85a6953183848ae01bee9c6a98885836c
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: state
          mountPath: /state
          readOnly: true
        - name: script
          mountPath: /scripts
          readOnly: true
        command:
        - /bin/sh
        - /scripts/classify.sh
      volumes:
      - name: state
        persistentVolumeClaim:
          claimName: stalwart-rehearsal-migration-state-local
          readOnly: true
      - name: script
        configMap:
          name: stalwart-rehearsal-startup-diagnostic-script
          defaultMode: 365
      nodeSelector:
        kubernetes.io/hostname: overseas-flk
      tolerations:
      - key: dedicated
        operator: Equal
        value: overseas-edge
        effect: NoSchedule
      - key: scheduling.re8ch.com/capacity-window
        operator: Equal
        value: closed
        effect: NoSchedule

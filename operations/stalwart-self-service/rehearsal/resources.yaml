apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: stalwart-rehearsal-deny-all
  namespace: mail-system
spec:
  podSelector:
    matchLabels:
      re8ch.com/stalwart-rehearsal: 'true'
  policyTypes:
  - Ingress
  - Egress
  ingress: []
  egress: []
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stalwart-rehearsal-source-restore-local
  namespace: mail-system
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stalwart-rehearsal-source-v01627-local
  namespace: mail-system
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stalwart-rehearsal-target-v1-local
  namespace: mail-system
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stalwart-rehearsal-rollback-v01627-local
  namespace: mail-system
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stalwart-rehearsal-migration-state-local
  namespace: mail-system
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi

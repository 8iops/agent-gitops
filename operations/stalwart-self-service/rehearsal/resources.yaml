apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: stalwart-rehearsal-deny-all
  namespace: mail-system
spec:
  podSelector:
    matchLabels:
      re8ch.com/stalwart-rehearsal: 'true'
  policyTypes:
  - Ingress
  - Egress
  ingress: []
  egress: []
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stalwart-rehearsal-source-restore
  namespace: mail-system
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: rbd-r640
  resources:
    requests:
      storage: 4Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stalwart-rehearsal-source-v01627
  namespace: mail-system
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: rbd-r640
  resources:
    requests:
      storage: 4Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stalwart-rehearsal-target-v1
  namespace: mail-system
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: rbd-r640
  resources:
    requests:
      storage: 4Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stalwart-rehearsal-rollback-v01627
  namespace: mail-system
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: rbd-r640
  resources:
    requests:
      storage: 4Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stalwart-rehearsal-migration-state
  namespace: mail-system
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: rbd-r640
  resources:
    requests:
      storage: 1Gi

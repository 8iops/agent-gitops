apiVersion: batch/v1
kind: Job
metadata:
  name: stalwart-rehearsal-answers-candidate-v1
  namespace: mail-system
spec:
  suspend: true
  backoffLimit: 0
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stalwart-migrate
        re8ch.com/stalwart-rehearsal: 'true'
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: candidate
          image: registry.re8ch.com/functions-shared/re8ch-cloud-platform@sha256:9c373e188664449043ea68984719288d192ec383bc0ed918900205e9728f7199
          command: [python, -B, /candidate/candidate.py]
          env:
            - name: PYTHONPATH
              value: /scripts
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: state, mountPath: /state}
            - {name: projection, mountPath: /scripts, readOnly: true}
            - {name: candidate, mountPath: /candidate, readOnly: true}
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: stalwart-rehearsal-migration-state-local
        - name: projection
          configMap:
            name: stalwart-rehearsal-policy-projection-script-ddmbgdf77m
        - name: candidate
          configMap:
            name: stalwart-rehearsal-answers-candidate-script
      nodeSelector:
        kubernetes.io/hostname: overseas-flk
      tolerations:
        - {key: dedicated, operator: Equal, value: overseas-edge, effect: NoSchedule}
        - {key: scheduling.re8ch.com/capacity-window, operator: Equal, value: closed, effect: NoSchedule}

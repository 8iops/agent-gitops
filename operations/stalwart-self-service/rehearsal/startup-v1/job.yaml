apiVersion: batch/v1
kind: Job
metadata:
  name: stalwart-rehearsal-startup-v1-v1
  namespace: mail-system
spec:
  suspend: true
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stalwart-migrate
        re8ch.com/stalwart-rehearsal: 'true'
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: startup
        image: ghcr.io/stalwartlabs/stalwart:v1.0.1@sha256:b9da4df8b4efc06bc926dd6e990bdeb0ad7b9261a7c3893d74b0461a00bb389b
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: '1'
            memory: 1536Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
            add:
            - NET_BIND_SERVICE
        volumeMounts:
        - name: target
          mountPath: /var/lib/stalwart-v1
        - name: state
          mountPath: /state
        - name: script
          mountPath: /scripts
          readOnly: true
        - name: work
          mountPath: /work
        command:
        - /bin/sh
        - /scripts/startup.sh
      volumes:
      - name: target
        persistentVolumeClaim:
          claimName: stalwart-rehearsal-target-v1-local
      - name: state
        persistentVolumeClaim:
          claimName: stalwart-rehearsal-migration-state-local
      - name: script
        configMap:
          name: stalwart-rehearsal-startup-v1-script
          defaultMode: 365
      - name: work
        emptyDir:
          medium: Memory
          sizeLimit: 16Mi
      nodeSelector:
        kubernetes.io/hostname: overseas-flk
      tolerations:
      - key: dedicated
        operator: Equal
        value: overseas-edge
        effect: NoSchedule
      - key: scheduling.re8ch.com/capacity-window
        operator: Equal
        value: closed
        effect: NoSchedule

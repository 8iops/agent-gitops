apiVersion: batch/v1
kind: Job
metadata:
  name: stalwart-rehearsal-restore-preflight-v2
  namespace: mail-system
spec:
  suspend: true
  backoffLimit: 0
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stalwart-migrate
        re8ch.com/stalwart-rehearsal: 'true'
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: restore
        image: ghcr.io/stalwartlabs/stalwart:v0.16.18@sha256:9ed1d343243b7aa72969e372a7240b7ddea07730781d4b68a0dc3d8d51c418bb
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: '1'
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: restore
          mountPath: /restore
        - name: script
          mountPath: /scripts
          readOnly: true
        - name: work
          mountPath: /work
        command:
        - /bin/sh
        - /scripts/restore-preflight.sh
      volumes:
      - name: restore
        persistentVolumeClaim:
          claimName: stalwart-rehearsal-source-restore-local
      - name: script
        configMap:
          name: stalwart-rehearsal-restore-script
          defaultMode: 365
      - name: work
        emptyDir:
          medium: Memory
          sizeLimit: 16Mi
      nodeSelector:
        kubernetes.io/hostname: overseas-flk
      tolerations:
      - key: dedicated
        operator: Equal
        value: overseas-edge
        effect: NoSchedule
      - key: scheduling.re8ch.com/capacity-window
        operator: Equal
        value: closed
        effect: NoSchedule

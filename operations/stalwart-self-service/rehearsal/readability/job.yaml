apiVersion: batch/v1
kind: Job
metadata:
  name: stalwart-rehearsal-native-readability-v2
  namespace: mail-system
spec:
  suspend: true
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stalwart-migrate
        re8ch.com/stalwart-rehearsal: 'true'
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: readability
        image: ghcr.io/stalwartlabs/stalwart:v0.16.18@sha256:9ed1d343243b7aa72969e372a7240b7ddea07730781d4b68a0dc3d8d51c418bb
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: '1'
            memory: 1536Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
            add:
            - NET_BIND_SERVICE
        volumeMounts:
        - name: baseline
          mountPath: /baseline
          readOnly: true
        - name: working
          mountPath: /var/lib/stalwart
        - name: state
          mountPath: /state
        - name: script
          mountPath: /scripts
          readOnly: true
        - name: work
          mountPath: /work
        command:
        - /bin/sh
        - /scripts/readability.sh
      volumes:
      - name: baseline
        persistentVolumeClaim:
          claimName: stalwart-rehearsal-source-restore-local
          readOnly: true
      - name: working
        persistentVolumeClaim:
          claimName: stalwart-rehearsal-source-v01627-local
      - name: state
        persistentVolumeClaim:
          claimName: stalwart-rehearsal-migration-state-local
      - name: script
        configMap:
          name: stalwart-rehearsal-readability-script
          defaultMode: 365
      - name: work
        emptyDir:
          medium: Memory
          sizeLimit: 16Mi
      nodeSelector:
        kubernetes.io/hostname: overseas-flk
      tolerations:
      - key: dedicated
        operator: Equal
        value: overseas-edge
        effect: NoSchedule
      - key: scheduling.re8ch.com/capacity-window
        operator: Equal
        value: closed
        effect: NoSchedule

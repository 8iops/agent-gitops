---
apiVersion: batch/v1
kind: Job
metadata:
  name: cube-recovery-credentials-v1
  namespace: cube-trial
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 180
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: cube-recovery-credentials
      nodeSelector:
        kubernetes.io/hostname: r640
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: provision
        image: python:3.13-alpine@sha256:8bcfa47b04b853a17aaf909362b847b2112fd6ec4105ea553ef9a43bafbb5916
        command:
        - python
        - -B
        - /templates/provision.py
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
        volumeMounts:
        - name: template
          mountPath: /templates
          readOnly: true
      volumes:
      - name: template
        configMap:
          name: cube-recovery-credential-template

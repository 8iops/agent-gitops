    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: cubevs-cidr-preflight
  annotations: {}
  namespace: cube-trial
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cube
        app.kubernetes.io/instance: cube-recovery
        app.kubernetes.io/component: cubevs-cidr-preflight
    spec:
      restartPolicy: Never
      serviceAccountName: cube-recovery-cubevs-cidr-preflight
      nodeSelector:
        kubernetes.io/hostname: r640
      tolerations:
      - key: cube.tencent.com/pvm-not-ready
        operator: Exists
        effect: NoSchedule
      containers:
      - name: preflight
        image: cube-sandbox-int.tencentcloudcr.com/cube-sandbox/alpine-k8s:1.28.15@sha256:782c4ec6276a7112ee358a11c4bfc238f2373e978cd97eada57494e05a980545
        imagePullPolicy: IfNotPresent
        command:
        - /bin/bash
        - /scripts/cubevs-cidr-preflight.sh
        env:
        - name: TZ
          value: Asia/Shanghai
        - name: CUBE_SANDBOX_NETWORK_CIDR
          value: 172.16.0.0/18
        - name: CUBE_SANDBOX_NETWORK_CIDR_SKIP_CONFLICT_CHECK
          value: '0'
        - name: PACKAGED_CUBELET_CIDR
          value: 192.168.0.0/18
        volumeMounts:
        - name: scripts
          mountPath: /scripts
          readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: '2'
            memory: 2Gi
      volumes:
      - name: scripts
        configMap:
          name: cube-recovery-cubevs-cidr-preflight
          defaultMode: 493

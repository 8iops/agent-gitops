apiVersion: delivery.re8ch.com/v1alpha1
kind: ReleaseContract
metadata:
  name: agent-runtime-domain-credential-broker
spec:
  authorityDomain: agent-runtime
  target:
    cluster: re8ch
    namespace: credential-broker
  source:
    renderer: kustomize
    revision: github-main-reviewed
    repository: 8iops/agent-gitops
    path: releases/agent-runtime-domain-credential-broker
  provenance:
    repository: 8iops/agent-gitops
    workflow: .github/workflows/static-release.yml
    ref: refs/heads/main
    environment: release-executor-agent-runtime
    audience: https://kube-api.re8ch.com/release-executor-agent-runtime
    signer: https://github.com/8iops/agent-gitops/.github/workflows/static-release.yml@refs/heads/main
    issuer: https://token.actions.githubusercontent.com
  authorization:
    fieldManager: re8ch-release/agent-runtime-domain-credential-broker
    resources:
    - core/ConfigMap
    - core/PersistentVolumeClaim
    - core/ServiceAccount
    objectNames:
    - credential-broker
    - credential-broker-registry
    - harbor-tenant-catalog
    allowClusterScoped: false
    forceConflictObjects:
    - core/ConfigMap/credential-broker/harbor-tenant-catalog
    - core/PersistentVolumeClaim/credential-broker/credential-broker-registry
    - core/ServiceAccount/credential-broker/credential-broker
  inventory:
    digest: sha256:3f10d7e8edd78bd979c9eb2e6d325efc1e8644dafd0fe2a25115b5a4f0b22867
  lifecycle:
    prune: false
    healthTimeoutSeconds: 300
    protectedKinds:
    - Namespace
    - CustomResourceDefinition
    - PersistentVolume
    - PersistentVolumeClaim
    - StorageClass
    deletionAllowlist: []

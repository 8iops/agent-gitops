apiVersion: delivery.re8ch.com/v1alpha1
kind: ReleaseContract
metadata:
  name: agent-runtime-domain-ledger
spec:
  authorityDomain: agent-runtime
  target:
    cluster: re8ch
    namespace: ledger
  source:
    renderer: kustomize
    revision: github-main-reviewed
    repository: 8iops/agent-gitops
    path: releases/agent-runtime-domain-ledger
  provenance:
    repository: 8iops/agent-gitops
    workflow: .github/workflows/static-release.yml
    ref: refs/heads/main
    environment: release-executor-agent-runtime
    audience: https://kube-api.re8ch.com/release-executor-agent-runtime
    signer: https://github.com/8iops/agent-gitops/.github/workflows/static-release.yml@refs/heads/main
    issuer: https://token.actions.githubusercontent.com
  authorization:
    fieldManager: re8ch-release/agent-runtime-domain-ledger
    resources:
    - rbac.authorization.k8s.io/RoleBinding
    objectNames:
    - credential-broker-secret-injector
    allowClusterScoped: false
    forceConflictObjects:
    - rbac.authorization.k8s.io/RoleBinding/ledger/credential-broker-secret-injector
  inventory:
    digest: sha256:02937e43cfb14fc0a046946e51b5f63cefba3c99960e9e6edf8274c149b609b7
  lifecycle:
    prune: false
    healthTimeoutSeconds: 300
    protectedKinds:
    - Namespace
    - CustomResourceDefinition
    - PersistentVolume
    - PersistentVolumeClaim
    - StorageClass
    deletionAllowlist: []

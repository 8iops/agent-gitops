apiVersion: delivery.re8ch.com/v1alpha1
kind: ReleaseContract
metadata:
  name: agent-runtime-domain-mcp-registry
spec:
  authorityDomain: agent-runtime
  target:
    cluster: re8ch
    namespace: mcp-registry
  source:
    renderer: kustomize
    revision: github-main-reviewed
    repository: 8iops/agent-gitops
    path: releases/agent-runtime-domain-mcp-registry
  provenance:
    repository: 8iops/agent-gitops
    workflow: .github/workflows/static-release.yml
    ref: refs/heads/main
    environment: release-executor-agent-runtime
    audience: https://kube-api.re8ch.com/release-executor-agent-runtime
    signer: https://github.com/8iops/agent-gitops/.github/workflows/static-release.yml@refs/heads/main
    issuer: https://token.actions.githubusercontent.com
  authorization:
    fieldManager: re8ch-release/agent-runtime-domain-mcp-registry
    resources:
    - apps/Deployment
    - core/PersistentVolumeClaim
    - core/Service
    - networking.k8s.io/NetworkPolicy
    - policy/PodDisruptionBudget
    objectNames:
    - mcp-registry
    - mcp-registry-postgresql-ab
    - mcp-registry-postgresql-r640
    - postgresql
    - postgresql-ingress
    - postgresql-toolhive-registry-ingress
    allowClusterScoped: false
    requireExisting: true
    forceConflictObjects:
    - apps/Deployment/mcp-registry/mcp-registry
    - core/Service/mcp-registry/mcp-registry
    - core/Service/mcp-registry/postgresql
    - networking.k8s.io/NetworkPolicy/mcp-registry/postgresql-ingress
    - networking.k8s.io/NetworkPolicy/mcp-registry/postgresql-toolhive-registry-ingress
    - policy/PodDisruptionBudget/mcp-registry/mcp-registry
  inventory:
    digest: sha256:d9cf23cb74d2a00b018cbaabab49ff284cdac267dc091c1e443277d24cf8264f
  lifecycle:
    prune: false
    healthTimeoutSeconds: 300
    protectedKinds:
    - Namespace
    - CustomResourceDefinition
    - PersistentVolume
    - PersistentVolumeClaim
    - StorageClass
    deletionAllowlist: []

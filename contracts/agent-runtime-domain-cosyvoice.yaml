apiVersion: delivery.re8ch.com/v1alpha1
kind: ReleaseContract
metadata:
  name: agent-runtime-domain-cosyvoice
spec:
  authorityDomain: agent-runtime
  target:
    cluster: re8ch
    namespace: cosyvoice
  source:
    renderer: kustomize
    revision: github-main-reviewed
    repository: 8iops/agent-gitops
    path: releases/agent-runtime-domain-cosyvoice
  provenance:
    repository: 8iops/agent-gitops
    workflow: .github/workflows/static-release.yml
    ref: refs/heads/main
    environment: release-executor-agent-runtime
    audience: https://kube-api.re8ch.com/release-executor-agent-runtime
    signer: https://github.com/8iops/agent-gitops/.github/workflows/static-release.yml@refs/heads/main
    issuer: https://token.actions.githubusercontent.com
  authorization:
    fieldManager: re8ch-release/agent-runtime-domain-cosyvoice
    resources:
    - apps/Deployment
    - core/ConfigMap
    - core/Service
    objectNames:
    - cosyvoice
    - cosyvoice-voice-profiles
    allowClusterScoped: false
    forceConflictObjects:
    - apps/Deployment/cosyvoice/cosyvoice
    - core/ConfigMap/cosyvoice/cosyvoice-voice-profiles
    - core/Service/cosyvoice/cosyvoice
  inventory:
    digest: sha256:63a4eb8f9040039b7f615913e601617dec85d5be95ba655b20c15af6bd5a4ef6
  lifecycle:
    prune: false
    healthTimeoutSeconds: 300
    protectedKinds:
    - Namespace
    - CustomResourceDefinition
    - PersistentVolume
    - PersistentVolumeClaim
    - StorageClass
    deletionAllowlist: []

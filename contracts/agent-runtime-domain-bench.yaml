apiVersion: delivery.re8ch.com/v1alpha1
kind: ReleaseContract
metadata:
  name: agent-runtime-domain-bench
spec:
  authorityDomain: agent-runtime
  target:
    cluster: re8ch
    namespace: bench
  source:
    renderer: kustomize
    revision: github-main-reviewed
    repository: 8iops/agent-gitops
    path: releases/agent-runtime-domain-bench
  provenance:
    repository: 8iops/agent-gitops
    workflow: .github/workflows/static-release.yml
    ref: refs/heads/main
    environment: release-executor-agent-runtime
    audience: https://kube-api.re8ch.com/release-executor-agent-runtime
    signer: https://github.com/8iops/agent-gitops/.github/workflows/static-release.yml@refs/heads/main
    issuer: https://token.actions.githubusercontent.com
  authorization:
    fieldManager: re8ch-release/agent-runtime-domain-bench
    resources:
    - rbac.authorization.k8s.io/RoleBinding
    objectNames:
    - credential-broker-secret-injector
    allowClusterScoped: false
    forceConflictObjects:
    - rbac.authorization.k8s.io/RoleBinding/bench/credential-broker-secret-injector
  inventory:
    digest: sha256:fa72eccf5e77e3ce554fd92904f84f0c7c03891e5bb15fb8f4fb3b9a2e3a51d3
  lifecycle:
    prune: false
    healthTimeoutSeconds: 300
    protectedKinds:
    - Namespace
    - CustomResourceDefinition
    - PersistentVolume
    - PersistentVolumeClaim
    - StorageClass
    deletionAllowlist: []

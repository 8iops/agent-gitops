apiVersion: delivery.re8ch.com/v1alpha1
kind: ReleaseContract
metadata:
  name: agent-runtime-exact-pg-re8ch-mcp
spec:
  authorityDomain: agent-runtime
  target:
    cluster: re8ch
    namespace: tenant-infrastructure
  source:
    renderer: kustomize
    revision: github-main-reviewed
    repository: 8iops/agent-gitops
    path: releases/agent-runtime-exact-pg-re8ch-mcp
  provenance:
    repository: 8iops/agent-gitops
    workflow: .github/workflows/static-release.yml
    ref: refs/heads/main
    environment: release-executor-agent-runtime
    audience: https://kube-api.re8ch.com/release-executor-agent-runtime
    signer: https://github.com/8iops/agent-gitops/.github/workflows/static-release.yml@refs/heads/main
    issuer: https://token.actions.githubusercontent.com
  authorization:
    fieldManager: re8ch-release/agent-runtime-exact-pg-re8ch-mcp
    resources:
    - apps/Deployment
    - cilium.io/CiliumNetworkPolicy
    - core/ConfigMap
    - core/Service
    - core/ServiceAccount
    - gateway.networking.k8s.io/HTTPRoute
    - networking.k8s.io/Ingress
    - networking.k8s.io/NetworkPolicy
    - policy/PodDisruptionBudget
    objectNames:
    - pg-re8ch-mcp
    - pg-re8ch-mcp-http
    - pg-re8ch-mcp-https
    - pg-re8ch-mcp-dns-authority
    - pg-re8ch-mcp-egress
    - pg-re8ch-mcp-modules
    allowClusterScoped: false
    requireExisting: false
    forceConflictObjects: []
  inventory:
    digest: sha256:254085e745df2c089e410e39f05563144044dd6ddfbdaa7bb8c5ec7ef205f877
  lifecycle:
    prune: true
    healthTimeoutSeconds: 300
    protectedKinds:
    - Namespace
    - PersistentVolume
    - PersistentVolumeClaim
    - Secret
    - StorageClass
    deletionAllowlist: []
    stages:
    - name: runtime
      kinds:
      - CiliumNetworkPolicy
      - ConfigMap
      - Deployment
      - NetworkPolicy
      - PodDisruptionBudget
      - Service
      - ServiceAccount
    - name: health-acceptance
      kinds:
      - HTTPRoute
      - Ingress

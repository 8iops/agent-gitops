apiVersion: delivery.re8ch.com/v1alpha1
kind: ReleaseContract
metadata:
  name: agent-runtime-domain-codex-archive
spec:
  authorityDomain: agent-runtime
  target:
    cluster: re8ch
    namespace: codex-archive
  source:
    renderer: kustomize
    revision: github-main-reviewed
    repository: 8iops/agent-gitops
    path: releases/agent-runtime-domain-codex-archive
  provenance:
    repository: 8iops/agent-gitops
    workflow: .github/workflows/static-release.yml
    ref: refs/heads/main
    environment: release-executor-agent-runtime
    audience: https://kube-api.re8ch.com/release-executor-agent-runtime
    signer: https://github.com/8iops/agent-gitops/.github/workflows/static-release.yml@refs/heads/main
    issuer: https://token.actions.githubusercontent.com
  authorization:
    fieldManager: re8ch-release/agent-runtime-domain-codex-archive
    resources:
    - core/PersistentVolumeClaim
    objectNames:
    - codex-conversations
    allowClusterScoped: false
    requireExisting: true
    forceConflictObjects: []
  inventory:
    digest: sha256:90878c6366e0a2b1c92a318afe7ed1de6cc8ace3573dd84f890573347c06222c
  lifecycle:
    prune: false
    healthTimeoutSeconds: 300
    protectedKinds:
    - Namespace
    - CustomResourceDefinition
    - PersistentVolume
    - PersistentVolumeClaim
    - StorageClass
    deletionAllowlist: []

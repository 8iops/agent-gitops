apiVersion: v1
kind: Service
metadata:
  name: tenant-service-api
  namespace: tenant-infrastructure
  labels:
    re8ch.com/metrics-surface: tenant-service-control
spec:
  selector:
    app: tenant-service-api
  ports:
  - name: http
    port: 80
    targetPort: http
  - name: skill-admin
    port: 19450
    targetPort: skill-admin
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tenant-service-api
  namespace: tenant-infrastructure
automountServiceAccountToken: false
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: tenant-service-api-gateway
  namespace: tenant-infrastructure
spec:
  endpointSelector:
    matchLabels:
      app: tenant-service-api
  ingress:
  - fromEntities:
    - ingress
    toPorts:
    - ports:
      - port: '19448'
        protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tenant-service-api
  namespace: tenant-infrastructure
spec:
  podSelector:
    matchLabels:
      app: tenant-service-api
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: toolhive-system
    ports:
    - protocol: TCP
      port: 19448
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: TCP
      port: 19448
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: observability-system
    ports:
    - protocol: TCP
      port: 19448
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: observability-ai
      podSelector:
        matchLabels:
          app.kubernetes.io/name: birfucate-metering
          app.kubernetes.io/instance: birfucate-metering
    ports:
    - protocol: TCP
      port: 19448
  - from:
    - podSelector:
        matchLabels:
          app: postgresql-provider
    ports:
    - protocol: TCP
      port: 19450
  - from:
    - podSelector:
        matchLabels:
          app: admin-api
    ports:
    - protocol: TCP
      port: 19450

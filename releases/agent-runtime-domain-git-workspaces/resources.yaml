---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: work-evidence-publisher
  namespace: git-workspaces
rules:
- apiGroups:
  - governance.re8ch.com
  resources:
  - workevidences
  verbs:
  - create
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: git-workspace-controller
  namespace: git-workspaces
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: git-workspace-controller
subjects:
- kind: ServiceAccount
  name: git-workspace-controller
  namespace: git-workspaces
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mailbox-provisioner
  namespace: git-workspaces
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mailbox-provisioner
subjects:
- kind: ServiceAccount
  name: mailbox-provisioner
  namespace: git-workspaces
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: owner-review-verifier
  namespace: git-workspaces
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: owner-review-verifier
subjects:
- kind: ServiceAccount
  name: owner-review-verifier
  namespace: git-workspaces
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: repo-pilot-bot-governance-reader
  namespace: git-workspaces
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: repo-pilot-bot-governance-reader
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: oidc:re8ch:advanced-fabric-bots
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: work-evidence-publishers
  namespace: git-workspaces
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: work-evidence-publisher
subjects:
- kind: ServiceAccount
  name: monitoring-evidence
  namespace: git-workspaces
- kind: ServiceAccount
  name: deploying-evidence
  namespace: git-workspaces
- kind: ServiceAccount
  name: planning-evidence
  namespace: git-workspaces

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-workspace-controller
  namespace: git-workspaces
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: git-workspace-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: git-workspace-controller
    spec:
      containers:
      - command:
        - python3
        - /runtime/controller.py
        env:
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        image: python:3.13-alpine@sha256:540c7d91f98ff6880174c40e99067bf5941eb54d818a7a5e094d188b196a934d
        name: controller
        resources:
          limits:
            cpu: 100m
            memory: 96Mi
          requests:
            cpu: 5m
            memory: 24Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /runtime
          name: runtime
          readOnly: true
      nodeSelector:
        kubernetes.io/hostname: r640
      securityContext:
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: git-workspace-controller
      volumes:
      - configMap:
          name: git-workspace-controller
        name: runtime
---
apiVersion: v1
data:
  controller.py: "import json\nimport ssl\nimport time\nimport urllib.request\n\n\
    BASE = \"https://kubernetes.default.svc\"\nNS = \"git-workspaces\"\nGROUP = \"\
    governance.re8ch.com\"\nVERSION = \"v1alpha1\"\nTOKEN = \"/var/run/secrets/kubernetes.io/serviceaccount/token\"\
    \nCA = \"/var/run/secrets/kubernetes.io/serviceaccount/ca.crt\"\nCONTEXT = ssl.create_default_context(cafile=CA)\n\
    \ndef request(path, method=\"GET\", body=None, content_type=\"application/json\"\
    ):\n    with open(TOKEN, encoding=\"utf-8\") as handle:\n        token = handle.read().strip()\n\
    \    data = None if body is None else json.dumps(body).encode()\n    req = urllib.request.Request(\n\
    \        BASE + path,\n        data=data,\n        method=method,\n        headers={\"\
    Authorization\": \"Bearer \" + token, \"Content-Type\": content_type},\n    )\n\
    \    with urllib.request.urlopen(req, context=CONTEXT, timeout=10) as response:\n\
    \        return json.load(response)\n\ndef collection(plural):\n    return f\"\
    /apis/{GROUP}/{VERSION}/namespaces/{NS}/{plural}\"\n\ndef items(plural):\n   \
    \ return request(collection(plural)).get(\"items\", [])\n\ndef patch_status(plural,\
    \ item, status):\n    name = item[\"metadata\"][\"name\"]\n    if item.get(\"\
    status\") == status:\n        return\n    request(\n        f\"{collection(plural)}/{name}/status\"\
    ,\n        method=\"PATCH\",\n        body={\"status\": status},\n        content_type=\"\
    application/merge-patch+json\",\n    )\n\ndef reconcile():\n    accounts = {item[\"\
    metadata\"][\"name\"]: item for item in items(\"gitaccounts\")}\n    approvals\
    \ = {}\n    for item in items(\"ownerapprovals\"):\n        approvals.setdefault(item[\"\
    spec\"][\"accountRef\"], []).append(item)\n    capabilities = {item[\"spec\"][\"\
    accountRef\"]: item for item in items(\"projectcapabilities\")}\n    for name,\
    \ account in accounts.items():\n        mailbox = (account.get(\"status\") or\
    \ {}).get(\"mailbox\") or {}\n        account_approvals = approvals.get(name,\
    \ [])\n        approval = account_approvals[0] if len(account_approvals) == 1\
    \ else None\n        requested_username = ((account[\"spec\"].get(\"providerIdentity\"\
    ) or {}).get(\"username\") or \"\").lstrip(\"@\")\n        approved_username =\
    \ (((approval or {}).get(\"spec\") or {}).get(\"codeOwner\") or {}).get(\"providerUsername\"\
    , \"\").lstrip(\"@\")\n        approved = bool(\n            approval\n      \
    \      and approval[\"spec\"][\"pullRequest\"][\"merged\"]\n            and requested_username\n\
    \            and approved_username == requested_username\n        )\n        ready\
    \ = mailbox.get(\"phase\") == \"Ready\" and approved\n        ownership = {\n\
    \            \"phase\": \"Ready\" if ready else \"AwaitingOwnerReview\" if mailbox.get(\"\
    phase\") == \"Ready\" else \"AwaitingMailbox\",\n            \"identityCommit\"\
    : approval[\"spec\"][\"identityCommit\"] if approved else \"\",\n            \"\
    approvalRef\": approval[\"metadata\"][\"name\"] if approved else \"\",\n     \
    \   }\n        if (account.get(\"status\") or {}).get(\"ownership\") != ownership:\n\
    \            request(\n                f\"{collection('gitaccounts')}/{name}/status\"\
    ,\n                method=\"PATCH\",\n                body={\"status\": {\"ownership\"\
    : ownership}},\n                content_type=\"application/merge-patch+json\"\
    ,\n            )\n        provider_identity = {\"phase\": \"Pending\"}\n     \
    \   if approved:\n            provider_identity = {\n                \"phase\"\
    : \"Verified\",\n                \"verifiedUsername\": approved_username,\n  \
    \              \"verifiedAt\": approval[\"spec\"][\"reviewedAt\"],\n         \
    \   }\n        if (account.get(\"status\") or {}).get(\"providerIdentity\") !=\
    \ provider_identity:\n            request(\n                f\"{collection('gitaccounts')}/{name}/status\"\
    ,\n                method=\"PATCH\",\n                body={\"status\": {\"providerIdentity\"\
    : provider_identity}},\n                content_type=\"application/merge-patch+json\"\
    ,\n            )\n        capability = capabilities.get(name)\n        if ready\
    \ and capability is None:\n            request(collection(\"projectcapabilities\"\
    ), method=\"POST\", body={\n                \"apiVersion\": f\"{GROUP}/{VERSION}\"\
    ,\n                \"kind\": \"ProjectCapability\",\n                \"metadata\"\
    : {\"name\": name, \"namespace\": NS},\n                \"spec\": {\n        \
    \            \"accountRef\": name,\n                    \"projectRef\": account[\"\
    spec\"][\"project\"],\n                    \"capabilities\": [\"project-write\"\
    , \"origin-branch\", \"collaboration-read-write\"],\n                },\n    \
    \        })\n        elif not ready and capability is not None:\n            request(f\"\
    {collection('projectcapabilities')}/{capability['metadata']['name']}\", method=\"\
    DELETE\")\n    workspaces = items(\"gitworkspaces\")\n    by_account = {}\n  \
    \  for workspace in workspaces:\n        by_account.setdefault(workspace[\"spec\"\
    ][\"accountRef\"], []).append(workspace)\n    for account, group in by_account.items():\n\
    \        conflict = len(group) != 1\n        for workspace in group:\n       \
    \     account_valid = account in accounts and accounts[account][\"spec\"][\"project\"\
    ] == workspace[\"spec\"][\"projectRef\"]\n            phase = \"Conflict\" if\
    \ conflict else (\"Active\" if account_valid else \"Invalid\")\n            patch_status(\"\
    gitworkspaces\", workspace, {\n                \"phase\": phase,\n           \
    \     \"accountRef\": account,\n                \"reason\": \"OneActiveWorkspacePerAccount\"\
    \ if conflict else (\"UniqueAccountWorkspace\" if account_valid else \"AccountProjectMismatch\"\
    ),\n                \"observedGeneration\": workspace[\"metadata\"].get(\"generation\"\
    , 1),\n            })\n\n    evidence = items(\"workevidences\")\n    by_contract\
    \ = {}\n    for item in evidence:\n        by_contract.setdefault(item[\"spec\"\
    ][\"contractRef\"], []).append(item[\"spec\"])\n    for contract in items(\"workcontracts\"\
    ):\n        name = contract[\"metadata\"][\"name\"]\n        spec = contract[\"\
    spec\"]\n        matching = [\n            item for item in by_contract.get(name,\
    \ [])\n            if item[\"commit\"] == spec[\"commit\"] and item[\"repository\"\
    ] == spec[\"repository\"]\n        ]\n        rejected = {item[\"plane\"] for\
    \ item in matching if item[\"result\"] == \"Rejected\"}\n        verified = {item[\"\
    plane\"] for item in matching if item[\"result\"] == \"Verified\"} - rejected\n\
    \        required = set(spec[\"requiredEvidence\"])\n        evidence_ready =\
    \ required <= verified\n        pr = spec[\"pullRequest\"]\n        if pr[\"state\"\
    ] == \"closed\":\n            phase = \"Completed\" if pr[\"merged\"] and evidence_ready\
    \ else \"EndedWithoutRuntimeVerification\"\n        elif rejected:\n         \
    \   phase = \"Rejected\"\n        else:\n            phase = \"Verified\" if evidence_ready\
    \ else \"Active\"\n        patch_status(\"workcontracts\", contract, {\n     \
    \       \"phase\": phase,\n            \"verifiedCommit\": spec[\"commit\"] if\
    \ evidence_ready else \"\",\n            \"verifiedPlanes\": sorted(verified),\n\
    \            \"rejectedPlanes\": sorted(rejected),\n            \"missingPlanes\"\
    : sorted(required - verified),\n            \"observedGeneration\": contract[\"\
    metadata\"].get(\"generation\", 1),\n        })\n\nwhile True:\n    try:\n   \
    \     reconcile()\n    except Exception as error:\n        print(json.dumps({\"\
    event\": \"git-workspace-reconcile-error\", \"error\": str(error)}), flush=True)\n\
    \    time.sleep(15)\n"
kind: ConfigMap
metadata:
  name: git-workspace-controller
  namespace: git-workspaces

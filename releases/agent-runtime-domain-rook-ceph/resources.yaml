---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: re8ch:ops-mcp-ceph-observe
  namespace: rook-ceph
rules:
- apiGroups:
  - ceph.rook.io
  resourceNames:
  - rook-ceph
  resources:
  - cephclusters
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: re8ch:toolhive-ceph-osd-recovery
  namespace: rook-ceph
rules:
- apiGroups:
  - apps
  resourceNames:
  - rook-ceph-osd-1
  resources:
  - deployments
  verbs:
  - get
  - patch
- apiGroups:
  - ''
  resources:
  - pods
  - events
  verbs:
  - list
- apiGroups:
  - ceph.rook.io
  resourceNames:
  - rook-ceph
  resources:
  - cephclusters
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: re8ch:ops-mcp-ceph-observe
  namespace: rook-ceph
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: re8ch:ops-mcp-ceph-observe
subjects:
- kind: ServiceAccount
  name: ops-mcp-public
  namespace: toolhive-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: re8ch:toolhive-ceph-osd-recovery
  namespace: rook-ceph
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: re8ch:toolhive-ceph-osd-recovery
subjects:
- kind: ServiceAccount
  name: ops-mcp-operate
  namespace: toolhive-system

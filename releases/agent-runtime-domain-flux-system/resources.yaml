---
apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    governance.re8ch.com/change: retire-unused-toolhive-session-redis
  name: retire-toolhive-session-redis-v3
  namespace: flux-system
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: retire-toolhive-session-redis
    spec:
      containers:
      - args:
        - --namespace
        - toolhive-system
        - delete
        - persistentvolumeclaim
        - data-toolhive-auth-redis-0
        - data-toolhive-auth-redis-ab-0
        - --ignore-not-found=true
        - --wait=false
        command:
        - kubectl
        image: registry.k8s.io/kubectl:v1.34.1@sha256:59bafa07ff3a6d4b417e7633ddb9d79a9606ca98bf64bac080b3e65748669250
        name: kubectl
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsGroup: 65532
          runAsNonRoot: true
          runAsUser: 65532
          seccompProfile:
            type: RuntimeDefault
      initContainers:
      - args:
        - --namespace
        - toolhive-system
        - delete
        - statefulset
        - toolhive-auth-redis
        - toolhive-auth-redis-ab
        - --ignore-not-found=true
        - --wait=false
        command:
        - kubectl
        image: registry.k8s.io/kubectl:v1.34.1@sha256:59bafa07ff3a6d4b417e7633ddb9d79a9606ca98bf64bac080b3e65748669250
        name: delete-statefulsets
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsGroup: 65532
          runAsNonRoot: true
          runAsUser: 65532
          seccompProfile:
            type: RuntimeDefault
      - args:
        - --namespace
        - toolhive-system
        - delete
        - service
        - toolhive-auth-redis
        - --ignore-not-found=true
        - --wait=false
        command:
        - kubectl
        image: registry.k8s.io/kubectl:v1.34.1@sha256:59bafa07ff3a6d4b417e7633ddb9d79a9606ca98bf64bac080b3e65748669250
        name: delete-service
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsGroup: 65532
          runAsNonRoot: true
          runAsUser: 65532
          seccompProfile:
            type: RuntimeDefault
      - args:
        - --namespace
        - toolhive-system
        - delete
        - networkpolicy
        - toolhive-auth-redis
        - --ignore-not-found=true
        - --wait=false
        command:
        - kubectl
        image: registry.k8s.io/kubectl:v1.34.1@sha256:59bafa07ff3a6d4b417e7633ddb9d79a9606ca98bf64bac080b3e65748669250
        name: delete-networkpolicy
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsGroup: 65532
          runAsNonRoot: true
          runAsUser: 65532
          seccompProfile:
            type: RuntimeDefault
      nodeSelector:
        kubernetes.io/hostname: a1-wsl-zt
      restartPolicy: OnFailure
      serviceAccountName: retire-toolhive-session-redis
  ttlSecondsAfterFinished: 604800
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: retire-toolhive-session-redis
  namespace: flux-system

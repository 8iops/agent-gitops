apiVersion: v1
data:
  cube-proxy-entrypoint.sh: "#!/bin/sh\n# Cube Proxy entrypoint script.\n#\n# Extracted\
    \ from the chart-embedded shell in templates/proxy.yaml so\n# that it can be linted\
    \ (`shellcheck`), unit-tested, and reviewed as a\n# proper source file rather\
    \ than an inline command list.\n#\n# Contract:\n# Reads the following env vars\
    \ (populated by the Chart in the Pod spec):\n#   CUBE_PROXY_HTTP_LISTEN_PORT \
    \  - digits only, target HTTP listen port\n#   CUBE_PROXY_HTTPS_LISTEN_PORT  -\
    \ digits only, target HTTPS listen port\n#   CUBE_PROXY_ADMIN_LISTEN       - admin\
    \ server listen address (default 0.0.0.0)\n#   CUBE_PROXY_ADMIN_PORT         -\
    \ admin server port (default 8082)\n#   CUBE_PROXY_ADMIN_TOKEN        - optional\
    \ shared secret for /admin/*\n#   CUBE_PROXY_RESOLVER_ADDRS     - space-separated\
    \ nameservers; empty means\n#                                   read from /etc/resolv.conf\n\
    #   CUBE_PROXY_RESOLVER_VALID     - nginx `valid=` duration\n#   CUBE_PROXY_RESOLVER_TIMEOUT\
    \   - nginx `resolver_timeout` value\n#   CUBE_PROXY_RESOLVER_IPV6      - on/off\n\
    #   REDIS_HOST, REDIS_PORT, REDIS_PASSWORD, REDIS_DB\n#   TIMEOUT_MIN, TIMEOUT_MAX\n\
    #   NODE_IP, CUBE_SIDECAR_LISTEN_ADDR (cube-lifecycle-manager host:port)\n# Rewrites\
    \ nginx.conf listen ports / admin bind in-place, then generates\n# /usr/local/openresty/nginx/conf/global/global.conf\
    \ and execs start.sh.\n\nset -eu\n\nmkdir -p /usr/local/openresty/nginx/conf/global\
    \ /data /data/log/cube-proxy /cache\n\ncase \"${CUBE_PROXY_HTTP_LISTEN_PORT}:${CUBE_PROXY_HTTPS_LISTEN_PORT}\"\
    \ in\n  *[!0-9:]*|:*|*:)\n    echo \"invalid CubeProxy listen ports: http=${CUBE_PROXY_HTTP_LISTEN_PORT}\
    \ https=${CUBE_PROXY_HTTPS_LISTEN_PORT}\" >&2\n    exit 1\n    ;;\nesac\n\nadmin_listen=\"\
    ${CUBE_PROXY_ADMIN_LISTEN:-0.0.0.0}\"\nadmin_port=\"${CUBE_PROXY_ADMIN_PORT:-8082}\"\
    \ncase \"${admin_port}\" in\n  *[!0-9]*|\"\")\n    echo \"invalid CubeProxy admin\
    \ port: ${admin_port}\" >&2\n    exit 1\n    ;;\nesac\ncase \"${admin_listen}\"\
    \ in\n  *[\\;\\{\\}\\$\\`\\\"\\\\]*)\n    echo \"invalid CubeProxy admin listen\
    \ address: ${admin_listen}\" >&2\n    exit 1\n    ;;\nesac\n\nsed -i \\\n  -e\
    \ \"s/listen 8081 reuseport;/listen ${CUBE_PROXY_HTTP_LISTEN_PORT} reuseport;/g\"\
    \ \\\n  -e \"s/listen 8080 ssl reuseport;/listen ${CUBE_PROXY_HTTPS_LISTEN_PORT}\
    \ ssl reuseport;/g\" \\\n  -e \"s/set \\\\\\$host_proxy_port 8081;/set \\\\\\\
    $host_proxy_port ${CUBE_PROXY_HTTP_LISTEN_PORT};/g\" \\\n  -e \"s/set \\\\\\$host_proxy_port\
    \ 8080;/set \\\\\\$host_proxy_port ${CUBE_PROXY_HTTPS_LISTEN_PORT};/g\" \\\n \
    \ -e \"s/listen 127\\\\.0\\\\.0\\\\.1:8082;/listen ${admin_listen}:${admin_port};/g\"\
    \ \\\n  /usr/local/openresty/nginx/conf/nginx.conf\n\nescape_nginx_value() {\n\
    \  printf '%s' \"$1\" | sed 's/[\\\\\"]/\\\\&/g'\n}\n\n# Bound workers to this\
    \ Pod's CPU/memory allocation. Keep credentials out of argv.\numask 077\nawk '\n\
    BEGIN {\n  token = ENVIRON[\"CUBE_PROXY_ADMIN_TOKEN\"]\n  if (token !~ /^[a-f0-9]+$/\
    \ || length(token) != 64) exit 1\n}\n/^worker_processes / { print \"worker_processes\
    \ 2;\"; next }\n{\n  gsub(/set \\$cube_admin_token \"\";/, \"set $cube_admin_token\
    \ \\\"\" token \"\\\";\")\n  print\n}' /usr/local/openresty/nginx/conf/nginx.conf\
    \ > /usr/local/openresty/nginx/conf/nginx.conf.safe\nmv /usr/local/openresty/nginx/conf/nginx.conf.safe\
    \ /usr/local/openresty/nginx/conf/nginx.conf\n\n\nresolver_addrs=\"${CUBE_PROXY_RESOLVER_ADDRS:-}\"\
    \nif [ -z \"${resolver_addrs}\" ]; then\n  resolver_addrs=\"$(awk '/^nameserver[[:space:]]+/\
    \ { printf \"%s \", $2 }' /etc/resolv.conf | sed 's/[[:space:]]*$//')\"\nfi\n\
    [ -n \"${resolver_addrs}\" ] || {\n  echo \"unable to determine nginx DNS resolver\
    \ for CubeProxy Redis lookups\" >&2\n  exit 1\n}\ncase \"${resolver_addrs}${CUBE_PROXY_RESOLVER_VALID}${CUBE_PROXY_RESOLVER_TIMEOUT}${CUBE_PROXY_RESOLVER_IPV6}\"\
    \ in\n  *[\\;\\{\\}\\$\\`]*)\n    echo \"invalid CubeProxy resolver configuration\"\
    \ >&2\n    exit 1\n    ;;\nesac\n\nsidecar_addr=\"${CUBE_SIDECAR_LISTEN_ADDR:-}\"\
    \n[ -n \"${sidecar_addr}\" ] || {\n  echo \"CUBE_SIDECAR_LISTEN_ADDR is required\
    \ (cube-lifecycle-manager host:port)\" >&2\n  exit 1\n}\n\n# proxy_registry.lua\
    \ publishes from ngx.timer, which has no nginx resolver.\n# Resolve a hostname\
    \ REDIS target to an IP up-front when possible.\nif [ -n \"${CUBE_PROXY_REGISTRY_REDIS_HOST:-}\"\
    \ ]; then\n  case \"${CUBE_PROXY_REGISTRY_REDIS_HOST}\" in\n    *[!0-9.]* )\n\
    \      resolved=\"$(getent ahostsv4 \"${CUBE_PROXY_REGISTRY_REDIS_HOST}\" 2>/dev/null\
    \ | awk 'NR==1 {print $1}')\"\n      if [ -n \"${resolved}\" ]; then\n       \
    \ CUBE_PROXY_REGISTRY_REDIS_HOST=\"${resolved}\"\n        export CUBE_PROXY_REGISTRY_REDIS_HOST\n\
    \      fi\n      ;;\n  esac\nfi\n\ncat > /usr/local/openresty/nginx/conf/global/global.conf\
    \ <<EOF\nresolver ${resolver_addrs} valid=${CUBE_PROXY_RESOLVER_VALID} ipv6=${CUBE_PROXY_RESOLVER_IPV6};\n\
    resolver_timeout ${CUBE_PROXY_RESOLVER_TIMEOUT};\nset \\$redis_ip \"$(escape_nginx_value\
    \ \"${REDIS_HOST}\")\";\nset \\$redis_port \"$(escape_nginx_value \"${REDIS_PORT}\"\
    )\";\nset \\$redis_pd \"$(escape_nginx_value \"${REDIS_PASSWORD}\")\";\nset \\\
    $redis_index \"$(escape_nginx_value \"${REDIS_DB}\")\";\nset \\$timeout_min \"\
    $(escape_nginx_value \"${TIMEOUT_MIN}\")\";\nset \\$timeout_max \"$(escape_nginx_value\
    \ \"${TIMEOUT_MAX}\")\";\nset \\$cube_proxy_host_ip \"$(escape_nginx_value \"\
    ${NODE_IP}\")\";\nset \\$cube_sidecar_addr \"$(escape_nginx_value \"${sidecar_addr}\"\
    )\";\nset \\$cube_admin_token \"$(escape_nginx_value \"${CUBE_PROXY_ADMIN_TOKEN:-}\"\
    )\";\nEOF\n\nexec /usr/local/openresty/nginx/sbin/start.sh\n"

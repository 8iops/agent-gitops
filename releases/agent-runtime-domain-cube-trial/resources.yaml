apiVersion: v1
data:
  nginx.conf: "worker_processes 2;\npid /tmp/nginx.pid;\nerror_log /dev/stderr warn;\n\
    events { worker_connections 512; }\nhttp {\n  access_log off;\n  client_body_temp_path\
    \ /tmp/client;\n  proxy_temp_path /tmp/proxy;\n  map $http_upgrade $connection_upgrade\
    \ { default upgrade; '' close; }\n  server {\n    listen 8080;\n    server_name\
    \ _;\n    location = /router-health { return 200 'ok'; }\n    location = /compocv-test\
    \ { return 308 /compocv-test/; }\n    location ^~ /compocv-test/ {\n      include\
    \ /etc/nginx/test-upstream.conf;\n      proxy_set_header Authorization \"\";\n\
    \      proxy_pass http://cube-recovery-proxy:80;\n    }\n    location ^~ /test-rpc/\
    \ {\n      include /etc/nginx/test-upstream.conf;\n      # Only the application's\
    \ test JWT; OAuth token forwarding is disabled.\n      proxy_set_header Authorization\
    \ $http_authorization;\n      proxy_pass http://cube-recovery-proxy:80;\n    }\n\
    \    location ~ ^/test-(api|auth)(/|$) { return 404; }\n    location / {\n   \
    \   proxy_set_header Host $host;\n      proxy_http_version 1.1;\n      proxy_set_header\
    \ Upgrade $http_upgrade;\n      proxy_set_header Connection $connection_upgrade;\n\
    \      proxy_pass http://cube-recovery-webui:12088;\n    }\n  }\n}\n"
  test-upstream.conf: 'proxy_http_version 1.1;

    proxy_set_header Host 5173-31b7f25e4ef04efe874818f7a3d02dd3.cube.app;

    include /run/cube-access/proxy-traffic.conf;

    proxy_set_header Cookie "";

    proxy_set_header X-Forwarded-Access-Token "";

    proxy_set_header X-Auth-Request-Access-Token "";

    proxy_set_header X-Forwarded-User "";

    proxy_set_header X-Forwarded-Email "";

    proxy_set_header X-Forwarded-Groups "";

    proxy_set_header X-Forwarded-Preferred-Username "";

    proxy_set_header Upgrade $http_upgrade;

    proxy_set_header Connection $connection_upgrade;

    proxy_read_timeout 3600s;

    proxy_buffering off;

    proxy_hide_header Set-Cookie;

    add_header X-Robots-Tag ''noindex, nofollow, noarchive'' always;


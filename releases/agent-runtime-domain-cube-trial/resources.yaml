---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: oauth2-proxy-cube
    app.kubernetes.io/part-of: cube-sandbox
  name: oauth2-proxy-cube
  namespace: cube-trial
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oauth2-proxy-cube
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oauth2-proxy-cube
        app.kubernetes.io/part-of: cube-sandbox
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - --provider=oidc
        - --oidc-issuer-url=https://id.re8ch.com
        - --redirect-url=https://cube.re8ch.com/oauth2/callback
        - --upstream=http://cube-trial-webui:12088
        - --http-address=0.0.0.0:4180
        - --email-domain=*
        - --scope=openid profile email
        - --cookie-secure=true
        - --cookie-samesite=lax
        - --cookie-expire=12h
        - --cookie-refresh=1h
        - --reverse-proxy=true
        - --set-xauthrequest=true
        - --pass-access-token=true
        - --skip-provider-button=true
        envFrom:
        - secretRef:
            name: oauth2-proxy-cube
        image: quay.io/oauth2-proxy/oauth2-proxy:v7.9.0@sha256:37c1570c0427e02fc7c947ef2c04e8995b8347b7abc9fcf1dbb4e376a4b221a7
        name: oauth2-proxy
        ports:
        - containerPort: 4180
          name: http
        readinessProbe:
          httpGet:
            path: /ping
            port: http
          initialDelaySeconds: 3
          periodSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
      nodeSelector:
        kubernetes.io/hostname: r640
---

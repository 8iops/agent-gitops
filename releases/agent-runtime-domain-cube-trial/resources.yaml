apiVersion: v1
data:
  nginx.conf: "worker_processes auto;\n\nevents {\n    worker_connections 1024;\n\
    }\n\nhttp {\n    include /usr/local/openresty/nginx/conf/mime.types;\n    default_type\
    \ application/octet-stream;\n\n    sendfile on;\n    tcp_nopush on;\n    tcp_nodelay\
    \ on;\n    keepalive_timeout 65;\n\n    gzip on;\n    gzip_types text/plain text/css\
    \ application/javascript application/json application/xml;\n\n    map $http_upgrade\
    \ $connection_upgrade {\n        default upgrade;\n        ''      '';\n    }\n\
    \n    server {\n        listen 80;\n        server_name _;\n\n        root /usr/share/nginx/html;\n\
    \        index index.html;\n\n        location = /cubeapi {\n            return\
    \ 308 /cubeapi/;\n        }\n        location ^~ /sandbox/ {\n            proxy_http_version\
    \ 1.1;\n            proxy_set_header Host $host;\n            proxy_set_header\
    \ X-Real-IP $remote_addr;\n            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n\
    \            proxy_set_header X-Forwarded-Proto $scheme;\n            proxy_set_header\
    \ Upgrade $http_upgrade;\n            proxy_set_header Connection $connection_upgrade;\n\
    \            proxy_read_timeout 7206s;\n            proxy_send_timeout 7206s;\n\
    \n            proxy_pass http://cube-recovery-proxy.cube-trial.svc.cluster.local:80;\n\
    \        }\n\n        location /opsapi/ {\n            proxy_http_version 1.1;\n\
    \            proxy_set_header Host $host;\n            proxy_set_header X-Real-IP\
    \ $remote_addr;\n            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n\
    \            proxy_set_header X-Forwarded-Proto $scheme;\n            proxy_read_timeout\
    \ 300s;\n            proxy_send_timeout 300s;\n\n            proxy_pass http://cube-recovery-ops.cube-trial.svc.cluster.local:3010/api/;\n\
    \        }\n\n        location /cubeapi/v1/ {\n            proxy_http_version\
    \ 1.1;\n            proxy_set_header Host $host;\n            proxy_set_header\
    \ X-Real-IP $remote_addr;\n            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n\
    \            proxy_set_header X-Forwarded-Proto $scheme;\n            proxy_read_timeout\
    \ 300s;\n            proxy_send_timeout 300s;\n\n            rewrite ^/cubeapi/v1/(.*)$\
    \ /api/v1/sdk/$1 break;\n            proxy_pass http://cube-recovery-ops.cube-trial.svc.cluster.local:3010;\n\
    \        }\n\n        location = /health {\n            proxy_pass http://cube-recovery-ops.cube-trial.svc.cluster.local:3010/health;\n\
    \        }\n\n        location ~ ^/(sandboxes|v2/sandboxes|templates|snapshots)\
    \ {\n            if ($http_authorization = \"\") {\n                return 418;\n\
    \            }\n            add_header Vary \"Authorization\" always;\n      \
    \      add_header Cache-Control \"no-store\" always;\n            proxy_http_version\
    \ 1.1;\n            proxy_set_header Host $host;\n            proxy_set_header\
    \ X-Real-IP $remote_addr;\n            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n\
    \            proxy_set_header X-Forwarded-Proto $scheme;\n            proxy_read_timeout\
    \ 300s;\n            proxy_send_timeout 300s;\n\n            rewrite ^/(.*)$ /api/v1/sdk/$1\
    \ break;\n            proxy_pass http://cube-recovery-ops.cube-trial.svc.cluster.local:3010;\n\
    \        }\n\n        error_page 418 = @spa_fallback;\n        location @spa_fallback\
    \ {\n            root /usr/share/nginx/html;\n            try_files /index.html\
    \ =404;\n            add_header Vary \"Authorization\" always;\n            add_header\
    \ Cache-Control \"no-store, no-cache, must-revalidate\" always;\n        }\n\n\
    \        location /assets/ {\n            try_files $uri =404;\n            expires\
    \ 1y;\n            add_header Cache-Control \"public, immutable\";\n        }\n\
    \n        location / {\n            try_files $uri $uri/ /index.html;\n      \
    \  }\n    }\n}"

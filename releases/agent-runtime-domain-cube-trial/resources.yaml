---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app.kubernetes.io/component: cube-node
    app.kubernetes.io/instance: cube-recovery
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: cube
    app.kubernetes.io/version: 0.5.1
    helm.sh/chart: cube-0.5.1
  name: cube-recovery-node
  namespace: cube-trial
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: cube-node
      app.kubernetes.io/instance: cube-recovery
      app.kubernetes.io/name: cube
  template:
    metadata:
      annotations: null
      labels:
        app.kubernetes.io/component: cube-node
        app.kubernetes.io/instance: cube-recovery
        app.kubernetes.io/name: cube
    spec:
      automountServiceAccountToken: true
      containers:
      - command:
        - /usr/bin/tini
        - -s
        - --
        - /bin/bash
        - -ec
        - "cfg=/usr/local/services/cubetoolbox/Cubelet/config/config.toml\nsentinel=/usr/local/services/cubetoolbox/.staged-cubelet\n\
          until test -f \"${sentinel}\" && test -f \"${cfg}\"; do sleep 1; done\n\
          sed -i -E \\\n  -e 's|^([[:space:]]*)cube_router_enable = .*|\\1cube_router_enable\
          \ = true|' \\\n  -e 's|^([[:space:]]*)cube_router_cidr = .*|\\1cube_router_cidr\
          \ = \"\"|' \\\n  \"${cfg}\"\ngrep -qE '^[[:space:]]*cube_router_enable =\
          \ true$' \"${cfg}\"\nexec /usr/local/bin/component-entrypoint.sh\n"
        env:
        - name: TZ
          value: Asia/Shanghai
        - name: TOOLBOX_ROOT
          value: /usr/local/services/cubetoolbox
        - name: IMAGE_ROOT
          value: /opt/cube-image
        - name: CUBE_PID_DIR
          value: /run/cube-node
        - name: STATE_DIR
          value: /var/lib/cube-recovery-bootstrap
        - name: CUBE_MASTER_ENDPOINT
          value: cube-recovery-master.cube-trial.svc.cluster.local:8089
        - name: CUBE_SANDBOX_NODE_ID
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: CUBE_SANDBOX_ENDPOINT_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: CUBE_PVM_ENABLE
          value: '0'
        - name: CUBE_SANDBOX_AUTO_DETECT_ETH
          value: 'true'
        - name: CUBE_SANDBOX_ETH_NAME
          value: ''
        - name: CUBE_SANDBOX_DNS_SERVERS
          value: ''
        - name: CUBE_SANDBOX_DNS_FOLLOW_NODE
          value: 'true'
        - name: CUBE_COMPONENT
          value: network-agent
        - name: CUBE_ROLE
          value: run
        - name: CUBE_SANDBOX_NETWORK_CIDR
          value: ''
        - name: CUBE_SANDBOX_CUBE_ROUTER_ENABLE
          value: '1'
        image: cube-sandbox-int.tencentcloudcr.com/cube-sandbox/network-agent:v0.6.0@sha256:5efe25ab120f4ac2fb948db66260dbd85b747c2339c907d7f5943288b9b9e801
        imagePullPolicy: IfNotPresent
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/bash
              - -ec
              - "# Kill only this container's pidfile. Never pkill -f \u2014\n# must\
                \ not match containerd-shim-cube-rs / cube-runtime / VMM.\npidfile=/run/cube-node/network-agent.pid\n\
                if [[ -f \"${pidfile}\" ]]; then\n  kill -TERM \"$(cat \"${pidfile}\"\
                )\" 2>/dev/null || true\nfi\n"
        name: network-agent
        ports:
        - containerPort: 19090
          name: network-agent
        resources:
          limits:
            cpu: '2'
            memory: 2Gi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          capabilities:
            add:
            - SYS_ADMIN
            - NET_ADMIN
            - SYS_MODULE
            - SYS_RESOURCE
            - IPC_LOCK
            - SYS_PTRACE
          privileged: true
        volumeMounts:
        - mountPath: /usr/local/services/cubetoolbox
          name: toolbox
        - mountPath: /data/cubelet
          mountPropagation: Bidirectional
          name: data-cubelet
        - mountPath: /data/log
          name: data-log
        - mountPath: /data/cube-shim
          mountPropagation: Bidirectional
          name: data-cube-shim
        - mountPath: /data/snapshot_pack
          name: data-snapshot-pack
        - mountPath: /data/cube-shared
          mountPropagation: Bidirectional
          name: data-cube-shared
        - mountPath: /data/shared
          mountPropagation: Bidirectional
          name: data-shared
        - mountPath: /tmp/cube
          mountPropagation: Bidirectional
          name: tmp-cube
        - mountPath: /run/containerd
          name: run-containerd
        - mountPath: /run/vc
          name: run-vc
        - mountPath: /run/cube-node
          name: cube-pid
        - mountPath: /var/lib/cube-recovery-bootstrap
          name: bootstrap-state
        - mountPath: /dev
          name: dev
        - mountPath: /sys
          name: sys
        - mountPath: /lib/modules
          name: lib-modules
          readOnly: true
      - command:
        - /usr/bin/tini
        - -s
        - --
        - /bin/bash
        - -ec
        - "cfg=/opt/cube-image/Cubelet/config/config.toml\nsed -i -E \\\n  -e 's|^([[:space:]]*)cidr\
          \ = .*|\\1cidr = \"172.16.0.0/18\"|' \\\n  -e 's|^([[:space:]]*)cube_router_enable\
          \ = .*|\\1cube_router_enable = true|' \\\n  -e 's|^([[:space:]]*)cube_router_cidr\
          \ = .*|\\1cube_router_cidr = \"\"|' \\\n  \"${cfg}\"\nset +e\n/usr/local/bin/component-entrypoint.sh\n\
          rc=$?\npid=\"$(pidof cubelet 2>/dev/null | awk '{print $1}' || true)\"\n\
          if test -n \"${pid}\" && kill -0 \"${pid}\" 2>/dev/null \\\n  && ss -lntp\
          \ 2>/dev/null | grep -q ':9999'; then\n  printf '%s\\n' \"${pid}\" >/run/cube-node/cubelet.pid\n\
          \  cleanup() { kill -TERM \"${pid}\" 2>/dev/null || true; }\n  trap cleanup\
          \ TERM INT HUP EXIT\n  while kill -0 \"${pid}\" 2>/dev/null; do sleep 10;\
          \ done\n  exit 1\nfi\nexit \"${rc}\"\n"
        env:
        - name: TZ
          value: Asia/Shanghai
        - name: TOOLBOX_ROOT
          value: /usr/local/services/cubetoolbox
        - name: IMAGE_ROOT
          value: /opt/cube-image
        - name: CUBE_PID_DIR
          value: /run/cube-node
        - name: STATE_DIR
          value: /var/lib/cube-recovery-bootstrap
        - name: CUBE_MASTER_ENDPOINT
          value: cube-recovery-master.cube-trial.svc.cluster.local:8089
        - name: CUBE_SANDBOX_NODE_ID
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: CUBE_SANDBOX_ENDPOINT_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: CUBE_PVM_ENABLE
          value: '0'
        - name: CUBE_SANDBOX_AUTO_DETECT_ETH
          value: 'true'
        - name: CUBE_SANDBOX_ETH_NAME
          value: ''
        - name: CUBE_SANDBOX_DNS_SERVERS
          value: ''
        - name: CUBE_SANDBOX_DNS_FOLLOW_NODE
          value: 'true'
        - name: CUBE_COMPONENT
          value: cubelet
        - name: CUBE_ROLE
          value: run
        - name: CUBE_SANDBOX_NETWORK_CIDR
          value: ''
        - name: CUBE_SANDBOX_CUBE_ROUTER_ENABLE
          value: '1'
        image: cube-sandbox-int.tencentcloudcr.com/cube-sandbox/cubelet:v0.6.0@sha256:2554c459908bbf945599c065abac65bccab5eecaa4b144e8aeb1d6c7636ae35b
        imagePullPolicy: IfNotPresent
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/bash
              - -ec
              - "# Kill only this container's pidfile. Never pkill -f \u2014\n# must\
                \ not match containerd-shim-cube-rs / cube-runtime / VMM.\npidfile=/run/cube-node/cubelet.pid\n\
                if [[ -f \"${pidfile}\" ]]; then\n  kill -TERM \"$(cat \"${pidfile}\"\
                )\" 2>/dev/null || true\nfi\n"
        livenessProbe:
          failureThreshold: 6
          initialDelaySeconds: 60
          periodSeconds: 20
          tcpSocket:
            port: 9999
        name: cubelet
        ports:
        - containerPort: 9999
          hostPort: 9999
          name: cubelet-grpc
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - /bin/bash
            - -ec
            - 'ss -lntp 2>/dev/null | grep -q '':9999'' || exit 1

              curl -fsS http://127.0.0.1:19090/readyz >/dev/null

              test -S /data/cubelet/cubelet.sock

              test -S /tmp/cube/network-agent-grpc.sock

              '
          failureThreshold: 6
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: '4'
            memory: 8Gi
          requests:
            cpu: 250m
            memory: 512Mi
        securityContext:
          capabilities:
            add:
            - SYS_ADMIN
            - NET_ADMIN
            - SYS_MODULE
            - SYS_RESOURCE
            - IPC_LOCK
            - SYS_PTRACE
          privileged: true
        startupProbe:
          failureThreshold: 30
          periodSeconds: 10
          tcpSocket:
            port: 9999
        volumeMounts:
        - mountPath: /usr/local/services/cubetoolbox
          name: toolbox
        - mountPath: /data/cubelet
          mountPropagation: Bidirectional
          name: data-cubelet
        - mountPath: /data/log
          name: data-log
        - mountPath: /data/cube-shim
          mountPropagation: Bidirectional
          name: data-cube-shim
        - mountPath: /data/snapshot_pack
          name: data-snapshot-pack
        - mountPath: /data/cube-shared
          mountPropagation: Bidirectional
          name: data-cube-shared
        - mountPath: /data/shared
          mountPropagation: Bidirectional
          name: data-shared
        - mountPath: /tmp/cube
          mountPropagation: Bidirectional
          name: tmp-cube
        - mountPath: /run/containerd
          name: run-containerd
        - mountPath: /run/vc
          name: run-vc
        - mountPath: /run/cube-node
          name: cube-pid
        - mountPath: /var/lib/cube-recovery-bootstrap
          name: bootstrap-state
        - mountPath: /dev
          name: dev
        - mountPath: /sys
          name: sys
        - mountPath: /lib/modules
          name: lib-modules
          readOnly: true
      dnsPolicy: ClusterFirst
      hostPID: true
      initContainers:
      - env:
        - name: STATE_DIR
          value: /var/lib/cube-recovery-bootstrap
        image: cube-sandbox-int.tencentcloudcr.com/cube-sandbox/cube-wait-node-prep:v0.6.0@sha256:67584162d88af7cf34360741c4e6b85747dd3cbda4a91d3dcd3e1d0a14fd5fbe
        imagePullPolicy: IfNotPresent
        name: wait-node-prep
        resources:
          limits:
            memory: 64Mi
          requests:
            cpu: 20m
            memory: 32Mi
        volumeMounts:
        - mountPath: /var/lib/cube-recovery-bootstrap
          name: bootstrap-state
      nodeSelector:
        kubernetes.io/hostname: r640
      serviceAccountName: cube-recovery-node
      terminationGracePeriodSeconds: 30
      volumes:
      - hostPath:
          path: /
          type: Directory
        name: host-root
      - hostPath:
          path: /data/cube-recovery/toolbox
          type: DirectoryOrCreate
        name: toolbox
      - hostPath:
          path: /var/lib/cube-recovery-bootstrap
          type: DirectoryOrCreate
        name: bootstrap-state
      - emptyDir:
          medium: Memory
          sizeLimit: 8Mi
        name: cube-pid
      - hostPath:
          path: /dev
          type: Directory
        name: dev
      - hostPath:
          path: /sys
          type: Directory
        name: sys
      - hostPath:
          path: /lib/modules
          type: Directory
        name: lib-modules
      - hostPath:
          path: /data/cube-recovery/cubelet
          type: DirectoryOrCreate
        name: data-cubelet
      - hostPath:
          path: /data/cube-recovery/log
          type: DirectoryOrCreate
        name: data-log
      - hostPath:
          path: /data/cube-recovery/shim
          type: DirectoryOrCreate
        name: data-cube-shim
      - hostPath:
          path: /data/cube-recovery/snapshot_pack
          type: DirectoryOrCreate
        name: data-snapshot-pack
      - hostPath:
          path: /data/cube-recovery/shared
          type: DirectoryOrCreate
        name: data-cube-shared
      - hostPath:
          path: /data/cube-recovery/host-shared
          type: DirectoryOrCreate
        name: data-shared
      - hostPath:
          path: /tmp/cube-recovery
          type: DirectoryOrCreate
        name: tmp-cube
      - hostPath:
          path: /data/cube-recovery/cubelet/run/containerd
          type: DirectoryOrCreate
        name: run-containerd
      - hostPath:
          path: /data/cube-recovery/cubelet/run/vc
          type: DirectoryOrCreate
        name: run-vc
  updateStrategy:
    type: OnDelete
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app.kubernetes.io/component: cube-node-bootstrap
    app.kubernetes.io/instance: cube-recovery
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: cube
    app.kubernetes.io/version: 0.5.1
    helm.sh/chart: cube-0.5.1
  name: cube-recovery-node-bootstrap
  namespace: cube-trial
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: cube-node-bootstrap
      app.kubernetes.io/instance: cube-recovery
      app.kubernetes.io/name: cube
  template:
    metadata:
      annotations: null
      labels:
        app.kubernetes.io/component: cube-node-bootstrap
        app.kubernetes.io/instance: cube-recovery
        app.kubernetes.io/name: cube
    spec:
      automountServiceAccountToken: true
      containers:
      - command:
        - /usr/bin/tini
        - -s
        - --
        - /scripts/write-node-prep-ready.sh
        env:
        - name: TZ
          value: Asia/Shanghai
        - name: STATE_DIR
          value: /var/lib/cube-recovery-bootstrap
        - name: PREP_GENERATION
          value: '1'
        - name: PVM_ENABLED
          value: '0'
        - name: NODE_INIT_ENABLED
          value: '1'
        - name: DESIRED_KERNEL_PATTERN
          value: pvm.host
        - name: KERNEL_BOOT_ARGS
          value: nopti pti=off
        image: cube-sandbox-int.tencentcloudcr.com/cube-sandbox/cube-wait-node-prep:v0.6.0@sha256:67584162d88af7cf34360741c4e6b85747dd3cbda4a91d3dcd3e1d0a14fd5fbe
        imagePullPolicy: IfNotPresent
        name: write-node-prep-ready
        resources:
          limits:
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /var/lib/cube-recovery-bootstrap
          name: bootstrap-state
      dnsPolicy: ClusterFirst
      hostPID: true
      initContainers:
      - args:
        - ". /scripts/node-prep-lib.sh\nready=\"$(node_prep_ready_path)\"\n[ -f \"\
          $ready\" ] || exit 0\nold_generation=\"$(sed -n 's/^prep_generation=//p'\
          \ \"$ready\")\"\nold_node_init=\"$(sed -n 's/^node_init_enabled=//p' \"\
          $ready\")\"\nif [ \"$old_generation\" != \"$PREP_GENERATION\" ] || [ \"\
          $old_node_init\" != \"$NODE_INIT_ENABLED\" ]; then\n  invalidate_node_prep_ready\n\
          fi\n"
        command:
        - /bin/sh
        - -ec
        env:
        - name: STATE_DIR
          value: /var/lib/cube-recovery-bootstrap
        - name: PREP_GENERATION
          value: '1'
        - name: NODE_INIT_ENABLED
          value: '1'
        image: cube-sandbox-int.tencentcloudcr.com/cube-sandbox/cube-node-init:v0.6.0@sha256:3e8f2fbf24bbb3446d537c28aab5a31de925574981198b3667097aa5cad20c3b
        imagePullPolicy: IfNotPresent
        name: invalidate-stale-node-prep
        resources:
          limits:
            cpu: '2'
            memory: 2Gi
          requests:
            cpu: 50m
            memory: 64Mi
        volumeMounts:
        - mountPath: /var/lib/cube-recovery-bootstrap
          name: bootstrap-state
      - command:
        - /usr/bin/tini
        - -s
        - --
        - /scripts/wait-pvm-host.sh
        env:
        - name: TZ
          value: Asia/Shanghai
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: HOST_ROOT
          value: /host
        - name: STATE_DIR
          value: /var/lib/cube-recovery-bootstrap
        - name: PVM_FEATURE_ENABLED
          value: '0'
        - name: CUBE_PVM_ENABLE
          value: '0'
        - name: ALLOW_PVM_LABEL
          value: cube.tencent.com/allow-pvm-bootstrap
        - name: DESIRED_KERNEL_PATTERN
          value: pvm.host
        - name: KERNEL_BOOT_ARGS
          value: nopti pti=off
        - name: WAIT_TIMEOUT_SECONDS
          value: '900'
        image: cube-sandbox-int.tencentcloudcr.com/cube-sandbox/cube-node-init:v0.6.0@sha256:3e8f2fbf24bbb3446d537c28aab5a31de925574981198b3667097aa5cad20c3b
        imagePullPolicy: IfNotPresent
        name: wait-pvm-host
        resources:
          limits:
            cpu: '2'
            memory: 2Gi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          privileged: true
        volumeMounts:
        - mountPath: /host
          name: host-root
        - mountPath: /dev
          name: dev
        - mountPath: /sys
          name: sys
        - mountPath: /lib/modules
          name: lib-modules
          readOnly: true
        - mountPath: /var/lib/cube-recovery-bootstrap
          name: bootstrap-state
      - env:
        - name: TZ
          value: Asia/Shanghai
        - name: HOST_ROOT
          value: /host
        - name: STATE_DIR
          value: /var/lib/cube-recovery-bootstrap
        - name: NODE_INIT_ENABLED
          value: '1'
        - name: PVM_ENABLED
          value: '0'
        - name: SKIP_IF_NODE_PREP_READY
          value: 'true'
        - name: DATA_CUBELET
          value: /data/cube-recovery/cubelet
        - name: REQUIRE_KVM
          value: 'true'
        - name: REQUIRE_XFS
          value: 'true'
        - name: CHMOD_KVM
          value: 'false'
        - name: LOAD_KVM_MODULE
          value: 'false'
        - name: WRITE_UDEV_RULE
          value: 'false'
        - name: CREATE_HOST_DIRS
          value: 'false'
        - name: CHECK_MASTER_CONNECTIVITY
          value: 'true'
        - name: CUBE_MASTER_ENDPOINT
          value: cube-recovery-master.cube-trial.svc.cluster.local:8089
        - name: LOOPBACK_ENABLED
          value: 'true'
        - name: LOOPBACK_IMAGE_PATH
          value: /data/cube-recovery/cubelet-xfs.img
        - name: LOOPBACK_SIZE
          value: 25G
        - name: CHECK_MEMORY
          value: 'true'
        - name: MIN_MEMORY_KB
          value: '7500000'
        - name: CHECK_CGROUP_CPU
          value: 'true'
        - name: CHECK_GLIBC
          value: 'true'
        - name: CHECK_CIDR
          value: 'true'
        - name: CHECK_CUBECOW_DEPS
          value: 'true'
        - name: CUBE_PVM_ENABLE
          value: '0'
        - name: CUBE_SANDBOX_NETWORK_CIDR
          value: 172.16.0.0/18
        - name: CUBE_SANDBOX_NETWORK_CIDR_SKIP_CONFLICT_CHECK
          value: '0'
        - name: PREP_GENERATION
          value: '1'
        - name: DESIRED_KERNEL_PATTERN
          value: pvm.host
        - name: KERNEL_BOOT_ARGS
          value: nopti pti=off
        image: cube-sandbox-int.tencentcloudcr.com/cube-sandbox/cube-node-init:v0.6.0@sha256:3e8f2fbf24bbb3446d537c28aab5a31de925574981198b3667097aa5cad20c3b
        imagePullPolicy: IfNotPresent
        name: cube-node-init
        resources:
          limits:
            cpu: '2'
            memory: 2Gi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          privileged: true
        volumeMounts:
        - mountPath: /host
          name: host-root
        - mountPath: /dev
          name: dev
        - mountPath: /sys
          name: sys
        - mountPath: /lib/modules
          name: lib-modules
          readOnly: true
        - mountPath: /var/lib/cube-recovery-bootstrap
          name: bootstrap-state
        - mountPath: /data/cube-recovery/cubelet
          mountPropagation: Bidirectional
          name: data-cubelet
        - mountPath: /data/cube-recovery/log
          name: data-log
        - mountPath: /data/cube-recovery/shim
          mountPropagation: Bidirectional
          name: data-cube-shim
        - mountPath: /data/cube-recovery/snapshot_pack
          name: data-snapshot-pack
        - mountPath: /data/cube-recovery/shared
          mountPropagation: Bidirectional
          name: data-cube-shared
        - mountPath: /data/cube-recovery/host-shared
          mountPropagation: Bidirectional
          name: data-shared
        - mountPath: /tmp/cube-recovery
          mountPropagation: Bidirectional
          name: tmp-cube
      nodeSelector:
        kubernetes.io/hostname: r640
      serviceAccountName: cube-recovery-node
      terminationGracePeriodSeconds: 30
      volumes:
      - hostPath:
          path: /
        name: host-root
      - hostPath:
          path: /dev
        name: dev
      - hostPath:
          path: /sys
        name: sys
      - hostPath:
          path: /lib/modules
        name: lib-modules
      - hostPath:
          path: /var/lib/cube-recovery-bootstrap
          type: DirectoryOrCreate
        name: bootstrap-state
      - hostPath:
          path: /data/cube-recovery/cubelet
          type: DirectoryOrCreate
        name: data-cubelet
      - hostPath:
          path: /data/cube-recovery/log
          type: DirectoryOrCreate
        name: data-log
      - hostPath:
          path: /data/cube-recovery/shim
          type: DirectoryOrCreate
        name: data-cube-shim
      - hostPath:
          path: /data/cube-recovery/snapshot_pack
          type: DirectoryOrCreate
        name: data-snapshot-pack
      - hostPath:
          path: /data/cube-recovery/shared
          type: DirectoryOrCreate
        name: data-cube-shared
      - hostPath:
          path: /data/cube-recovery/host-shared
          type: DirectoryOrCreate
        name: data-shared
      - hostPath:
          path: /tmp/cube-recovery
          type: DirectoryOrCreate
        name: tmp-cube
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 1
    type: RollingUpdate
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app.kubernetes.io/component: cube-node-installer
    app.kubernetes.io/instance: cube-recovery
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: cube

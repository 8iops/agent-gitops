---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy-cube
  namespace: cube-trial
spec:
  ports:
  - name: http
    port: 4180
    targetPort: http
  selector:
    app.kubernetes.io/name: oauth2-proxy-cube
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    networking.re8ch.com/dns-authority: cube-trial/cube-dns-authority
  name: cube-public
  namespace: cube-trial
spec:
  hostnames:
  - cube.re8ch.com
  parentRefs:
  - name: re8ch-gateway-canary
    namespace: kube-system
    sectionName: cube-https
  rules:
  - backendRefs:
    - name: oauth2-proxy-cube
      port: 4180
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: 'false'
    external-dns.alpha.kubernetes.io/hostname: cube.re8ch.com
    external-dns.alpha.kubernetes.io/ttl: '60'
    networking.re8ch.com/provider: public-edge-manager
  labels:
    networking.re8ch.com/dns-authority: public-edge
  name: cube-dns-authority
  namespace: cube-trial
spec:
  ingressClassName: external-dns-only
  rules:
  - host: cube.re8ch.com
    http:
      paths:
      - backend:
          service:
            name: oauth2-proxy-cube
            port:
              number: 4180
        path: /
        pathType: Prefix

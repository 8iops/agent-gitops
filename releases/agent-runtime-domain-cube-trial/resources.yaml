      automountServiceAccountToken: false
      containers:
      - command:
        - nginx
        - -g
        - daemon off;
        image: nginx:stable-alpine@sha256:47928bf67eb62a1863cb08d9ecb52d3e704304ba614eaee17884204677702951
        name: router
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /router-health
            port: http
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 25m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /etc/nginx
          name: config
          readOnly: true
        - mountPath: /run/cube-access
          name: access
          readOnly: true
        - mountPath: /tmp
          name: tmp
      nodeSelector:
        kubernetes.io/hostname: r640
      securityContext:
        fsGroup: 101
        runAsGroup: 101
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - configMap:
          name: cube-compocv-router
        name: config
      - name: access
        secret:
          defaultMode: 288
          items:
          - key: proxy-traffic.conf
            path: proxy-traffic.conf
          secretName: compocv-cube-test-access
      - emptyDir:
          sizeLimit: 64Mi
        name: tmp

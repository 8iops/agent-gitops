apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: master
    app.kubernetes.io/instance: cube-recovery
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: cube
    app.kubernetes.io/version: 0.5.1
    helm.sh/chart: cube-0.5.1
  name: cube-recovery-master
  namespace: cube-trial
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: master
      app.kubernetes.io/instance: cube-recovery
      app.kubernetes.io/name: cube
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: master
        app.kubernetes.io/instance: cube-recovery
        app.kubernetes.io/name: cube
    spec:
      containers:
      - args:
        - "fifo=/tmp/cube-master.stdout\nrm -f \"$fifo\"\nmkfifo \"$fifo\"\nsed -u\
          \ '/^cfg:/d' <\"$fifo\" &\nfilter_pid=$!\n/usr/local/services/cubetoolbox/CubeMaster/bin/cubemaster\
          \ >\"$fifo\" 2>&1 &\nmaster_pid=$!\nterminate() {\n  kill -TERM \"$master_pid\"\
          \ 2>/dev/null || true\n  wait \"$master_pid\"\n}\ntrap terminate TERM INT\n\
          wait \"$master_pid\"\nstatus=$?\nwait \"$filter_pid\" || true\nexit \"$status\"\
          \n"
        command:
        - /bin/bash
        - -c
        env:
        - name: TZ
          value: Asia/Shanghai
        - name: CUBE_MASTER_CONFIG_PATH
          value: /usr/local/services/cubetoolbox/CubeMaster/conf.yaml
        - name: CUBEMASTER_ROOTFS_ARTIFACT_STORE_DIR
          value: /data/CubeMaster/storage
        - name: CUBE_NODE_IPS
          value: ''
        - name: GODEBUG
          value: http2client=0
        image: cube-sandbox-int.tencentcloudcr.com/cube-sandbox/cube-master:v0.6.0@sha256:0dbb8867b9e706afe26ef583c823d482bb4fecf33ea0b9a3df256a85ec582a93
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 6
          httpGet:
            path: /notify/health
            port: cubemaster
          initialDelaySeconds: 30
          periodSeconds: 20
        name: cube-master
        ports:
        - containerPort: 8089
          name: cubemaster
        readinessProbe:
          failureThreshold: 12
          httpGet:
            path: /notify/health
            port: cubemaster
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 2
            memory: 2Gi
          requests:
            cpu: 100m
            memory: 256Mi
        volumeMounts:
        - mountPath: /usr/local/services/cubetoolbox/CubeMaster/conf.yaml
          name: cube-master-config
          readOnly: true
          subPath: conf.yaml
        - mountPath: /data/log/CubeMaster
          name: cube-master-log
        - mountPath: /data/CubeMaster/storage
          name: cube-master-storage
      nodeSelector:
        kubernetes.io/hostname: r640
      volumes:
      - name: cube-master-config
        secret:
          secretName: cube-recovery-master-config
      - emptyDir: {}
        name: cube-master-log
      - name: cube-master-storage
        persistentVolumeClaim:
          claimName: cube-recovery-master-storage

apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tenants.tenancy.re8ch.com
spec:
  group: tenancy.re8ch.com
  scope: Cluster
  names:
    kind: Tenant
    plural: tenants
    singular: tenant
    shortNames:
    - rtenant
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    selectableFields:
    - jsonPath: .spec.lifecycle
    additionalPrinterColumns:
    - name: Lifecycle
      type: string
      jsonPath: .spec.lifecycle
    - name: Ready
      type: string
      jsonPath: .status.conditions[?(@.type=="Ready")].status
    schema:
      openAPIV3Schema:
        type: object
        required:
        - spec
        properties:
          spec:
            type: object
            required:
            - displayName
            - lifecycle
            - deletionPolicy
            - namespacePolicy
            properties:
              displayName:
                type: string
                minLength: 1
                maxLength: 128
              lifecycle:
                type: string
                enum:
                - Active
                - Suspended
                - Deleting
              deletionPolicy:
                type: string
                enum:
                - Retain
                - RevokeThenDelete
              runtimeNamespaceRef:
                description: Deprecated compatibility field. New writes use namespacePolicy.defaultNamespace.
                type: string
                pattern: ^[a-z0-9](?:[-a-z0-9]*[a-z0-9])?$
              namespacePolicy:
                type: object
                required: [defaultNamespace, allowedPrefixes, maxNamespaces, allowCreate, allowDelete]
                properties:
                  defaultNamespace:
                    type: string
                    pattern: ^[a-z0-9](?:[-a-z0-9]*[a-z0-9])?$
                  allowedPrefixes:
                    type: array
                    minItems: 1
                    maxItems: 4
                    items:
                      type: string
                      pattern: ^[a-z0-9](?:[-a-z0-9]*-)$
                  maxNamespaces:
                    type: integer
                    minimum: 1
                    maximum: 100
                  allowCreate: {type: boolean}
                  allowDelete: {type: boolean}
              imagePullSecretRef:
                type: string
                pattern: ^[a-z0-9](?:[-a-z0-9.]*[a-z0-9])?$
              harborProjectRef:
                type: string
                pattern: ^[a-z0-9](?:[._-]?[a-z0-9]+)*$
              visibility:
                type: string
                enum:
                - Private
                - Public
              hostingMode:
                type: string
                enum:
                - platform-managed
                - byoc
              byocAllowed:
                type: boolean
              grants:
                type: array
                maxItems: 100
                items:
                  type: object
                  required: [name, consumableRef, roleRef, lifecycle]
                  properties:
                    name:
                      type: string
                      pattern: ^[a-z0-9](?:[-a-z0-9]*[a-z0-9])?$
                    consumableRef:
                      type: string
                      pattern: ^[a-z0-9][a-z0-9.-]*[a-z0-9]$
                    roleRef:
                      type: string
                      enum: [viewer, operator, admin]
                    lifecycle:
                      type: string
                      enum: [Active, Suspended]
              businessNamespaces:
                description: Deprecated compatibility field. Namespace inventory is reported in status.managedNamespaces.
                type: array
                items:
                  type: string
                  pattern: ^[a-z0-9](?:[-a-z0-9]*[a-z0-9])?$
          status:
            type: object
            properties:
              observedGeneration:
                type: integer
                minimum: 0
              operationId:
                type: string
                pattern: ^op_[a-f0-9]+$
              managedNamespaces:
                type: array
                items:
                  type: string
                  pattern: ^[a-z0-9](?:[-a-z0-9]*[a-z0-9])?$
              conditions:
                type: array
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys:
                - type
                items:
                  type: object
                  required:
                  - type
                  - status
                  - reason
                  - lastTransitionTime
                  properties:
                    type:
                      type: string
                      enum:
                      - Ready
                      - Reconciling
                      - RevocationPending
                      - Degraded
                    status:
                      type: string
                      enum:
                      - 'True'
                      - 'False'
                      - Unknown
                    reason:
                      type: string
                      minLength: 1
                      maxLength: 128
                    message:
                      type: string
                      maxLength: 1024
                    lastTransitionTime:
                      type: string
                      format: date-time

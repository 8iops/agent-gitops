---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: tenant-runtime-image-cache
  namespace: tenant-infrastructure
spec:
  selector:
    matchLabels:
      app: tenant-runtime-image-cache
  template:
    metadata:
      labels:
        app: tenant-runtime-image-cache
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - r640
      automountServiceAccountToken: false
      containers:
      - image: registry.k8s.io/pause@sha256:278fb9dbcca9518083ad1e11276933a2e96f23de604a3a08cc3c80002767d24c
        name: hold
        resources:
          limits:
            cpu: 5m
            memory: 8Mi
          requests:
            cpu: 1m
            memory: 2Mi
      imagePullSecrets:
      - name: harbor-registry-pull
      initContainers:
      - command:
        - sh
        - -c
        - 'true'
        image: registry.re8ch.com/image/re8ch-ai-operations@sha256:f52a5c2b6a6a55baae8c7b67ed6de10d5d447fee1e90585f08cdf0d9c5847b28
        imagePullPolicy: IfNotPresent
        name: pull
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    ai.connectool.io/mcp-backend: 'true'
    re8ch.com/publication-stage: release-gated
  name: admin-api
  namespace: tenant-infrastructure
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-api
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        ai.connectool.io/mcp-backend: 'true'
        app: admin-api
        saas.re8ch.com/tenant: platform
        tenant-runtime: 'true'
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - r640
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: tenant-api
              topologyKey: kubernetes.io/hostname
            weight: 100
      automountServiceAccountToken: false
      containers:
      - env:
        - name: RE8CH_TOOL_PROFILE
          value: admin
        - name: RE8CH_TOOL_AUDIENCE
          value: re8ch-platform-admin
        - name: SERVICE_API_TOKEN
          valueFrom:
            secretKeyRef:
              key: token
              name: admin-vmcp-backend-auth
        - name: LISTEN_PORT
          value: '19449'
        - name: PUBLIC_MCP_URL
          value: https://admin.re8ch.com:8443/mcp
        - name: PUBLIC_RESOURCE_METADATA_URL
          value: https://admin.re8ch.com:8443/.well-known/oauth-protected-resource/mcp
        - name: TENANT_CONTROL_URL
          value: http://tenant-control-controller.tenant-infrastructure.svc
        - name: AUTH_DISCOVERY_URL
          value: http://re8ch-auth-gateway.auth.svc:8080/auth/.well-known/openid-configuration
        - name: DEX_USERINFO_URL
          value: https://api.re8ch.com/auth/userinfo
        - name: TENANT_SERVICE_DB
          value: /var/lib/tenant-platform/tenant-services.db
        - name: DEVICE_REGISTRY_PATH
          value: /var/lib/tenant-platform/admin-devices.db
        - name: DYNAMIC_SKILL_ADMIN_URL
          value: http://tenant-api.tenant-infrastructure.svc:19450/internal/dynamic-skills
        envFrom:
        - secretRef:
            name: tenant-claim-internal-auth
            optional: false
        image: registry.re8ch.com/image/re8ch-ai-operations@sha256:f52a5c2b6a6a55baae8c7b67ed6de10d5d447fee1e90585f08cdf0d9c5847b28
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /livez
            port: http
          periodSeconds: 15
          timeoutSeconds: 3
        name: runtime
        ports:
        - containerPort: 19449
          name: http
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 5
          timeoutSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 25m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /livez
            port: http
          periodSeconds: 2
          timeoutSeconds: 3
        volumeMounts:
        - mountPath: /var/lib/tenant-platform
          name: runtime-state
      dnsConfig:
        nameservers:
        - 10.43.0.53
        options:
        - name: ndots
          value: '5'
        searches:
        - observability-ai.svc.cluster.local
        - tenant-infrastructure.svc.cluster.local
        - svc.cluster.local
        - cluster.local
      dnsPolicy: None
      imagePullSecrets:
      - name: harbor-registry-pull
      securityContext:
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 101
        runAsNonRoot: true
        runAsUser: 100
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: admin-api
      tolerations:
      - operator: Exists
      volumes:
      - name: runtime-state
        persistentVolumeClaim:
          claimName: tenant-platform-state
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    ai.connectool.io/mcp-backend: 'true'
  name: postgresql-provider
  namespace: tenant-infrastructure
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgresql-provider
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        ai.connectool.io/mcp-backend: 'true'
        app: postgresql-provider
        saas.re8ch.com/tenant: platform
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - r640
      containers:
      - env:
        - name: LISTEN_PORT
          value: '8080'
        - name: PIGSTY_PRIMARY_HOST
          value: pg-re8ch-primary.pigsty-external.svc.cluster.local
        envFrom:
        - secretRef:
            name: tenant-claim-internal-auth
            optional: false
        image: registry.re8ch.com/image/re8ch-postgresql-provider@sha256:4ce638d6d96aa769d470f5fe997e0dfbee70594ef7b4b8a5f265548c1e7cd1c7
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /livez
            port: mcp
          periodSeconds: 15
          timeoutSeconds: 3
        name: provider
        ports:
        - containerPort: 8080
          name: mcp
        readinessProbe:
          httpGet:
            path: /readyz
            port: mcp
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 25m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      imagePullSecrets:
      - name: harbor-registry-pull
      securityContext:
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: postgresql-provider
      tolerations:
      - operator: Exists
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenant-provider-reconciler
  namespace: tenant-infrastructure
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tenant-provider-reconciler
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: tenant-provider-reconciler
        saas.re8ch.com/tenant: platform
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - r640
      containers:
      - command:
        - python
        - /app/tenant_provider_reconciler.py
        env:
        - name: STALWART_URL
          value: https://stalwart-admin.service.re8ch.com
        - name: IDENTITY_REST_URL
          value: http://supabase-identity-rest.supabase-identity.svc:3000
        - name: IDENTITY_SERVICE_KEY
          valueFrom:
            secretKeyRef:
              key: service-role-key
              name: tenant-provider-identity
        - name: GRAFANA_DATABASE_BINDINGS_JSON
          value: '[{"database":"anysite","namespace":"re8ch-anysite","secretName":"anysite-db-credentials","secretUID":"ecb4edf3-eb40-4b0e-ab28-7bf3dab490c4","tenantRef":"re8ch"},{"database":"secretary","namespace":"re8ch-secretary","secretName":"secretary-db-credentials","secretUID":"e31d554c-5cf8-4663-adcd-811849a31b3c","tenantRef":"re8ch"}]'
        image: registry.re8ch.com/image/re8ch-ai-operations@sha256:d59472f27c9333ad447fead5f540c720a62fee8994c3ed1a37936cfba284fad9
        name: reconciler
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 25m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /cli
          name: stalwart-cli
          readOnly: true
      dnsConfig:
        nameservers:
        - 10.43.0.53
        options:
        - name: ndots
          value: '5'
        searches:
        - observability-ai.svc.cluster.local
        - tenant-infrastructure.svc.cluster.local
        - svc.cluster.local
        - cluster.local
      dnsPolicy: None
      imagePullSecrets:
      - name: harbor-registry-pull
      serviceAccountName: tenant-provider-reconciler
      tolerations:
      - operator: Exists
      volumes:
      - image:
          pullPolicy: IfNotPresent
          reference: ghcr.io/stalwartlabs/cli@sha256:5b70732cb69cdab3ff0894c501544cf0bfa180fa75bcd0eeba4eebe04c1064e1
        name: stalwart-cli
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: postgresql-provider-egress
  namespace: tenant-infrastructure
spec:
  egress:
  - toEntities:
    - kube-apiserver
  - toPorts:
    - ports:
      - port: '5432'
        protocol: TCP
    toServices:
    - k8sService:
        namespace: pigsty-external
        serviceName: pg-re8ch-primary
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports:
      - port: '53'
        protocol: UDP
      - port: '53'
        protocol: TCP
  endpointSelector:
    matchLabels:
      app: postgresql-provider
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: tenant-api-gateway
  namespace: tenant-infrastructure
spec:
  endpointSelector:
    matchLabels:
      app: tenant-api
  ingress:
  - fromEntities:
    - ingress
    toPorts:
    - ports:
      - port: '19448'
        protocol: TCP
      - port: '19449'
        protocol: TCP

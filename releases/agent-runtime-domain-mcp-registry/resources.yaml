---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-registry
  namespace: mcp-registry
spec:
  progressDeadlineSeconds: 180
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-registry
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-registry
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: scheduling.re8ch.com/service-plane
                operator: In
                values:
                - core
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: mcp-registry
            topologyKey: kubernetes.io/hostname
      containers:
      - env:
        - name: MCP_REGISTRY_SERVER_ADDRESS
          value: :8080
        - name: MCP_REGISTRY_VERSION
          value: v1.8.0-re8ch
        - name: MCP_REGISTRY_ENVIRONMENT
          value: production
        - name: MCP_REGISTRY_DATABASE_URL
          valueFrom:
            secretKeyRef:
              key: DATABASE_URL
              name: mcp-registry-runtime
        - name: MCP_REGISTRY_JWT_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              key: JWT_PRIVATE_KEY
              name: mcp-registry-runtime
        - name: MCP_REGISTRY_ENABLE_ANONYMOUS_AUTH
          value: 'false'
        - name: MCP_REGISTRY_ENABLE_REGISTRY_VALIDATION
          value: 'true'
        image: ghcr.io/modelcontextprotocol/registry@sha256:1b416da8aeccf85f720d7787ef3119d0199773a81adea479d877810bde801dfc
        name: registry
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /v0/servers
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: '1'
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    storage.re8ch.com/replicated-approved: 'true'
  name: mcp-registry-postgresql-ab
  namespace: mcp-registry
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: cephfs-re8ch
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mcp-registry-postgresql-r640
  namespace: mcp-registry
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: manual-r640
  volumeName: mcp-registry-postgresql-r640
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-registry
  namespace: mcp-registry
spec:
  ports:
  - name: http
    port: 8080
    targetPort: http
  selector:
    app.kubernetes.io/name: mcp-registry
  trafficDistribution: PreferSameNode
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: mcp-registry
spec:
  ports:
  - name: postgresql
    port: 5432
    targetPort: postgresql
  selector:
    app.kubernetes.io/name: mcp-registry-postgresql
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgresql-ingress
  namespace: mcp-registry
spec:
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: mcp-registry
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: toolhive-system
    ports:
    - port: 5432
      protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mcp-registry-postgresql
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgresql-toolhive-registry-ingress
  namespace: mcp-registry
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: toolhive-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: toolhive-registry-server
    ports:
    - port: 5432
      protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mcp-registry-postgresql
  policyTypes:
  - Ingress
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mcp-registry
  namespace: mcp-registry
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-registry

# Source: toolhive-operator/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: toolhive-operator
  namespace: toolhive-system
  labels:
    helm.sh/chart: toolhive-operator-0.50.0
    app.kubernetes.io/name: toolhive-operator
    app.kubernetes.io/instance: toolhive-operator
    app.kubernetes.io/part-of: toolhive-operator
    app.kubernetes.io/version: "0.50.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: toolhive-operator
      app.kubernetes.io/instance: toolhive-operator
      app.kubernetes.io/part-of: toolhive-operator
  template:
    metadata:
      labels:
        helm.sh/chart: toolhive-operator-0.50.0
        app.kubernetes.io/name: toolhive-operator
        app.kubernetes.io/instance: toolhive-operator
        app.kubernetes.io/part-of: toolhive-operator
        app.kubernetes.io/version: "0.50.0"
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: toolhive-operator
      securityContext:
        runAsNonRoot: true
      terminationGracePeriodSeconds: 10
      containers:
        - name: manager
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          image: "ghcr.io/stacklok/toolhive/operator@sha256:7998095e6b998d2ae50f93393fa8c969d41a1422457d1775aef81c81dfa24b67"
          imagePullPolicy: IfNotPresent
          args:
          - --leader-elect
          ports:
            - containerPort: 8080
              name: metrics
              protocol: TCP
            - containerPort: 8081
              name: health
              protocol: TCP
          env:
          - name: KUBERNETES_SERVICE_HOST
            value: 10.250.0.128
          - name: KUBERNETES_SERVICE_PORT
            value: "6443"
          - name: TOOLHIVE_SKIP_UPDATE_CHECK
            value: "true"
          - name: GOMEMLIMIT
            value: "110MiB"
          - name: GOGC
            value: "75"
          # Always use structured JSON logs in Kubernetes (not configurable)
          - name: UNSTRUCTURED_LOGS
            value: "false"
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: TOOLHIVE_USE_CONFIGMAP
            value: "true"
          - name: ENABLE_EXPERIMENTAL_FEATURES
            value: "false"
          - name: TOOLHIVE_ENABLE_STORAGE_VERSION_MIGRATOR
            value: "false"
          - name: WATCH_NAMESPACE
            value: "toolhive-system"
          - name: TOOLHIVE_RUNNER_IMAGE
            value: "ghcr.io/stacklok/toolhive/proxyrunner@sha256:1ee5a4d66763180fdfdb95c4da9afb7112946e90531516fb9a1fd279f2c9cd29"
          - name: VMCP_IMAGE
            value: "ghcr.io/stacklok/toolhive/vmcp@sha256:22b6bb5c642c45e913afef0ea0ca696b1f12cd7dd26d74a8e8cb0b794cd2774c"
          - name: TOOLHIVE_PROXY_HOST
            value: "0.0.0.0"
          - name: TOOLHIVE_REGISTRY_API_IMAGE
            value: "ghcr.io/stacklok/thv-registry-api:v1.5.2"
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
      nodeSelector:
        kubernetes.io/hostname: r640
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: scheduling.re8ch.com/service-plane
                operator: In
                values:
                - core
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: toolhive-operator
            topologyKey: kubernetes.io/hostname

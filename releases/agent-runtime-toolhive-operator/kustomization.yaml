apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [resources.yaml]
patches:
- target:
    version: v1
    kind: Deployment
    name: toolhive-operator
  patch: |-
    - op: add
      path: /spec/strategy
      value:
        type: RollingUpdate
        rollingUpdate: {maxUnavailable: 1, maxSurge: 0}

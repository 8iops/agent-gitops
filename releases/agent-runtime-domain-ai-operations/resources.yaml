---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: stagehand-service
    app.kubernetes.io/part-of: agent-workspace
  name: stagehand-service
  namespace: ai-operations
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stagehand-service
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stagehand-service
        app.kubernetes.io/part-of: agent-workspace
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: PORT
          value: '8080'
        - name: STAGEHAND_MODEL
          value: openai/kimi-k2-5
        - name: LITELLM_BASE_URL
          value: http://litellm.llm-gateway.svc.cluster.local:4000/v1
        - name: STEEL_URL
          value: http://steel-browser.ai-operations.svc.cluster.local:3000
        - name: STEEL_INTERNAL_HOST
          value: steel-browser.ai-operations.svc.cluster.local:3000
        - name: LITELLM_API_KEY
          valueFrom:
            secretKeyRef:
              key: LITELLM_API_TOKEN
              name: cluster-infra-litellm
        - name: STAGEHAND_API_TOKEN
          valueFrom:
            secretKeyRef:
              key: LITELLM_API_TOKEN
              name: cluster-infra-litellm
        image: ghcr.io/re8ch/stagehand-service@sha256:3e7a39dc30d4286e6c9795a04f76bc2c793bd4117b9cf96f83dc8f9a0c6765bb
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 4
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 20
          periodSeconds: 15
          timeoutSeconds: 5
        name: stagehand-service
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 12
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          limits:
            cpu: '2'
            memory: 2Gi
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /tmp
          name: tmp
      enableServiceLinks: false
      imagePullSecrets:
      - name: ghcr-re8ch
      nodeSelector:
        kubernetes.io/hostname: r640
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
      volumes:
      - emptyDir:
          sizeLimit: 256Mi
        name: tmp
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: workspace-mirror-sync
  namespace: ai-operations
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: workspace-mirror-sync
            policy.re8ch.com/privileged-approved: 'true'
        spec:
          containers:
          - args:
            - --lock
            - /config/workspace.lock.yaml
            - --mirrors
            - /var/lib/re8ch/workspace-mirrors
            - --worktrees
            - /var/lib/re8ch/agent-workspaces
            - --memory-root
            - /srv/service-backend/catalogs
            - sync
            env:
            - name: GIT_SSH_COMMAND
              value: ssh -F /credentials/ssh-config -o BatchMode=yes
            image: registry.re8ch.com/functions-shared/re8ch-workspace-controller@sha256:a2e4088bc1d313e5f2680f75499d1337252bb8a13bf9827446a077870c2682d9
            name: mirror
            resources:
              limits:
                cpu: 500m
                memory: 512Mi
              requests:
                cpu: 50m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              runAsNonRoot: true
            volumeMounts:
            - mountPath: /var/lib/re8ch/workspace-mirrors
              name: mirrors
            - mountPath: /var/lib/re8ch/agent-workspaces
              name: worktrees
            - mountPath: /credentials
              name: credentials
              readOnly: true
            - mountPath: /srv/re8ch/agent-artifacts
              name: artifacts
          initContainers:
          - command:
            - sh
            - -c
            - chown 65532:65532 /var/lib/re8ch/workspace-mirrors /var/lib/re8ch/agent-workspaces
            image: registry.re8ch.com/functions-shared/re8ch-workspace-controller@sha256:a2e4088bc1d313e5f2680f75499d1337252bb8a13bf9827446a077870c2682d9
            name: prepare-directories
            resources:
              limits:
                cpu: 100m
                memory: 128Mi
              requests:
                cpu: 10m
                memory: 32Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                add:
                - CHOWN
                drop:
                - ALL
              runAsUser: 0
            volumeMounts:
            - mountPath: /var/lib/re8ch/workspace-mirrors
              name: mirrors
            - mountPath: /var/lib/re8ch/agent-workspaces
              name: worktrees
          nodeSelector:
            kubernetes.io/hostname: r640
          restartPolicy: Never
          securityContext:
            fsGroup: 65532
            fsGroupChangePolicy: OnRootMismatch
          serviceAccountName: workspace-controller
          volumes:
          - hostPath:
              path: /var/lib/re8ch/workspace-mirrors
              type: DirectoryOrCreate
            name: mirrors
          - hostPath:
              path: /var/lib/re8ch/agent-workspaces
              type: DirectoryOrCreate
            name: worktrees
          - name: credentials
            secret:
              defaultMode: 256
              secretName: workspace-git-credentials
          - name: artifacts
            persistentVolumeClaim:
              claimName: workspace-agent-artifacts
      ttlSecondsAfterFinished: 3600
  schedule: 17 */2 * * *
  successfulJobsHistoryLimit: 2
  suspend: true
---

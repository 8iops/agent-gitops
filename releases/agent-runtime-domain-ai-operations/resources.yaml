apiVersion: v1
data:
  runner.py: "#!/usr/bin/env python3\n\"\"\"Dissosy in-cluster persona runner (stdlib\
    \ only).\n\nOne run = one persona. Reads the persona playbooks from the private\
    \ state repo,\ndrives a tool-use loop against the in-cluster LiteLLM Model Gateway,\
    \ and always\nappends a heartbeat itself so a stopped or confused model is still\
    \ visible.\n\nCredentials come only from the pod environment: a per-persona LiteLLM\
    \ virtual\nkey and a GitHub token scoped to the state repo. No vendor keys live\
    \ here.\n\"\"\"\nimport base64\nimport json\nimport os\nimport sys\nimport time\n\
    import urllib.error\nimport urllib.parse\nimport urllib.request\n\nPERSONA = os.environ.get('DISSOSY_PERSONA',\
    \ 'ops-analyst')\nSTATE_REPO = os.environ.get('DISSOSY_STATE_REPO', 'pillars-infra/product-prd')\n\
    PLAYBOOK_REFS = os.environ.get('DISSOSY_PLAYBOOK_REFS', 'main,claude/project-thread-76qte8').split(',')\n\
    LLM_BASE = os.environ.get('LITELLM_BASE_URL', 'http://litellm.llm-gateway.svc.cluster.local:4000/v1').rstrip('/')\n\
    LLM_MODEL = os.environ.get('LITELLM_MODEL', 'deepseek-v4-flash')\nMAX_STEPS =\
    \ int(os.environ.get('DISSOSY_MAX_STEPS', '30'))\nDRY_RUN = os.environ.get('DISSOSY_DRY_RUN',\
    \ '') == '1'\n\n# Hosts a persona may read. Writes go only through the GitHub\
    \ tool below.\nREAD_HOSTS = {\n    're8ch.com', 'www.re8ch.com', 'api.github.com',\
    \ 'hn.algolia.com',\n    'www.v2ex.com', 'qiita.com', 'zenn.dev',\n}\n# GitHub\
    \ write scope: issues (and their comments/labels) in the state repo only.\nWRITE_PREFIXES\
    \ = (f'/repos/{STATE_REPO}/issues', f'/repos/{STATE_REPO}/labels')\nREAD_PREFIXES\
    \ = ('/repos/', '/search/')\nMAX_BODY = 20000\n\n\nclass ToolError(Exception):\n\
    \    pass\n\n\ndef check_read_url(url):\n    parts = urllib.parse.urlsplit(url)\n\
    \    if parts.scheme != 'https' or parts.hostname not in READ_HOSTS:\n       \
    \ raise ToolError(f'host not allowed: {parts.hostname} (allowed: {sorted(READ_HOSTS)})')\n\
    \    return url\n\n\ndef check_github(method, path):\n    method = method.upper()\n\
    \    if not path.startswith('/') or '..' in path:\n        raise ToolError('path\
    \ must be an absolute GitHub API path')\n    if method == 'GET':\n        if not\
    \ path.startswith(READ_PREFIXES):\n            raise ToolError('GET allowed only\
    \ under /repos/ and /search/')\n        return method, path\n    if method in\
    \ ('POST', 'PATCH') and path.startswith(WRITE_PREFIXES):\n        if '/merge'\
    \ in path or '/lock' in path:\n            raise ToolError('merge/lock not allowed')\n\
    \        return method, path\n    raise ToolError(f'{method} {path} not allowed;\
    \ writes only to issues in {STATE_REPO}')\n\n\ndef _request(url, method='GET',\
    \ headers=None, body=None, timeout=60):\n    data = json.dumps(body).encode()\
    \ if body is not None else None\n    req = urllib.request.Request(url, data=data,\
    \ method=method, headers=headers or {})\n    if data is not None:\n        req.add_header('Content-Type',\
    \ 'application/json')\n    started = time.monotonic()\n    try:\n        with\
    \ urllib.request.urlopen(req, timeout=timeout) as resp:\n            raw = resp.read()\n\
    \            return resp.status, raw, int((time.monotonic() - started) * 1000),\
    \ dict(resp.headers)\n    except urllib.error.HTTPError as err:\n        return\
    \ err.code, err.read(), int((time.monotonic() - started) * 1000), dict(err.headers\
    \ or {})\n\n\ndef gh(method, path, body=None):\n    headers = {\n        'Authorization':\
    \ f\"Bearer {os.environ['GITHUB_TOKEN']}\",\n        'Accept': 'application/vnd.github+json',\n\
    \        'User-Agent': f'dissosy-{PERSONA}',\n    }\n    status, raw, _, _ = _request('https://api.github.com'\
    \ + path, method, headers, body)\n    text = raw.decode('utf-8', 'replace')\n\
    \    return status, text\n\n\ndef tool_http_get(args):\n    url = check_read_url(args['url'])\n\
    \    status, raw, ms, headers = _request(url, headers={'User-Agent': f'dissosy-{PERSONA}'},\
    \ timeout=30)\n    keep = {k: v for k, v in headers.items() if k.lower() in ('cache-control',\
    \ 'server', 'content-type', 'location', 'eo-cache-status')}\n    return json.dumps({'status':\
    \ status, 'elapsed_ms': ms, 'headers': keep, 'body': raw.decode('utf-8', 'replace')[:MAX_BODY]})\n\
    \n\ndef tool_github(args):\n    method, path = check_github(args.get('method',\
    \ 'GET'), args['path'])\n    if DRY_RUN and method != 'GET':\n        return json.dumps({'dry_run':\
    \ True, 'method': method, 'path': path})\n    status, text = gh(method, path,\
    \ args.get('body'))\n    return json.dumps({'status': status, 'body': text[:MAX_BODY]})\n\
    \n\nTOOLS = {\n    'http_get': (tool_http_get, 'GET a public https URL on an allowlisted\
    \ host. Returns status, elapsed_ms, a few headers, and the body (truncated).',\n\
    \                 {'type': 'object', 'properties': {'url': {'type': 'string'}},\
    \ 'required': ['url']}),\n    'github': (tool_github, f'Call the GitHub REST API.\
    \ GET under /repos/ or /search/; POST/PATCH only on issues and labels of {STATE_REPO}.',\n\
    \               {'type': 'object', 'properties': {'method': {'type': 'string',\
    \ 'enum': ['GET', 'POST', 'PATCH']},\n                                       \
    \          'path': {'type': 'string'}, 'body': {'type': 'object'}},\n        \
    \        'required': ['method', 'path']}),\n}\n\n\ndef read_playbook(name):\n\
    \    for ref in PLAYBOOK_REFS:\n        q = urllib.parse.quote(ref, safe='')\n\
    \        status, text = gh('GET', f'/repos/{STATE_REPO}/contents/dissosy/{name}?ref={q}')\n\
    \        if status == 200:\n            return base64.b64decode(json.loads(text)['content']).decode()\n\
    \    raise RuntimeError(f'playbook dissosy/{name} not found on {PLAYBOOK_REFS}')\n\
    \n\ndef system_prompt():\n    files = ['RUNBOOK.md', 'charter.md', 'policy.md',\
    \ f'agents/{PERSONA}.md']\n    docs = '\\n\\n'.join(f'===== dissosy/{f} =====\\\
    n{read_playbook(f)}' for f in files)\n    return (\n        f'You are Dissosy,\
    \ the self-running operations mind of Reachieve LLC (re8ch), acting as the {PERSONA}\
    \ persona. '\n        'You run inside the re8ch cluster as a CronJob. Your only\
    \ tools are http_get and github. '\n        'Stripe, PayPal, Mercury and Gmail\
    \ are NOT available in this runtime: skip those steps and write \"covered by the\
    \ cloud run\". '\n        'There is no shell and no git: read files through the\
    \ GitHub contents API. '\n        'Do not write the heartbeat yourself; the runner\
    \ appends it after you finish. '\n        'Follow the documents below exactly\
    \ and stay inside policy.md. End with a 3-6 line summary.\\n\\n' + docs\n    )\n\
    \n\ndef chat(messages):\n    body = {'model': LLM_MODEL, 'messages': messages,\
    \ 'temperature': 0.2,\n            'tools': [{'type': 'function', 'function':\
    \ {'name': n, 'description': d, 'parameters': p}} for n, (_, d, p) in TOOLS.items()]}\n\
    \    headers = {'Authorization': f\"Bearer {os.environ['LITELLM_API_KEY']}\"}\n\
    \    status, raw, _, _ = _request(LLM_BASE + '/chat/completions', 'POST', headers,\
    \ body, timeout=180)\n    if status != 200:\n        raise RuntimeError(f'LiteLLM\
    \ returned {status}: {raw[:500]!r}')\n    return json.loads(raw)['choices'][0]['message']\n\
    \n\ndef run_loop():\n    messages = [{'role': 'system', 'content': system_prompt()},\n\
    \                {'role': 'user', 'content': f'Run the {PERSONA} persona now.\
    \ Current UTC time: {time.strftime(\"%Y-%m-%dT%H:%MZ\", time.gmtime())}.'}]\n\
    \    for _ in range(MAX_STEPS):\n        msg = chat(messages)\n        messages.append(msg)\n\
    \        calls = msg.get('tool_calls') or []\n        if not calls:\n        \
    \    return 'ok', (msg.get('content') or '').strip()\n        for call in calls:\n\
    \            name = call['function']['name']\n            try:\n             \
    \   args = json.loads(call['function'].get('arguments') or '{}')\n           \
    \     result = TOOLS[name][0](args) if name in TOOLS else json.dumps({'error':\
    \ f'unknown tool {name}'})\n            except (ToolError, KeyError, ValueError)\
    \ as err:\n                result = json.dumps({'error': str(err)})\n        \
    \    messages.append({'role': 'tool', 'tool_call_id': call['id'], 'content': result})\n\
    \    return 'partial', f'stopped after {MAX_STEPS} steps'\n\n\ndef heartbeat(status,\
    \ summary):\n    line = f\"{time.strftime('%Y-%m-%dT%H:%MZ', time.gmtime())} \xB7\
    \ {PERSONA}@cluster \xB7 {status} \xB7 {summary.splitlines()[0][:300] if summary\
    \ else '-'}\"\n    print(line)\n    if DRY_RUN:\n        return\n    code, text\
    \ = gh('GET', f'/repos/{STATE_REPO}/issues?labels=dsy/heartbeat&state=open&per_page=1')\n\
    \    issues = json.loads(text) if code == 200 else []\n    if issues:\n      \
    \  gh('POST', f\"/repos/{STATE_REPO}/issues/{issues[0]['number']}/comments\",\
    \ {'body': line})\n\n\ndef main():\n    try:\n        status, summary = run_loop()\n\
    \    except Exception as err:  # the heartbeat must still be written\n       \
    \ status, summary = 'failed', f'{type(err).__name__}: {err}'\n    print(summary)\n\
    \    try:\n        heartbeat(status, summary)\n    except Exception as err:\n\
    \        print(f'heartbeat failed: {err}', file=sys.stderr)\n        return 1\n\
    \    return 0 if status != 'failed' else 1\n\n\nif __name__ == '__main__':\n \
    \   sys.exit(main())\n"

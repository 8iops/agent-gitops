apiVersion: v1
kind: ConfigMap
metadata:
  name: pg-re8ch-mcp-modules
  namespace: tenant-infrastructure
data:
  modules.json: |
    {
      "version": 1,
      "backends": {
        "pg_re8ch": {
          "url": "https://supabase.service.re8ch.com/api/mcp",
          "authMode": "basic",
          "namespace": "supabase-pg-re8ch",
          "secret": "supabase-pg-re8ch-secrets",
          "usernameSecretKey": "DASHBOARD_USERNAME",
          "passwordSecretKey": "DASHBOARD_PASSWORD"
        }
      }
    }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pg-re8ch-mcp
  namespace: tenant-infrastructure
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pg-re8ch-mcp
  namespace: tenant-infrastructure
  labels:
    app.kubernetes.io/name: pg-re8ch-mcp
    app.kubernetes.io/component: public-mcp-facade
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pg-re8ch-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pg-re8ch-mcp
        app.kubernetes.io/component: public-mcp-facade
    spec:
      automountServiceAccountToken: true
      serviceAccountName: pg-re8ch-mcp
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: pg-re8ch-mcp
              topologyKey: kubernetes.io/hostname
      containers:
      - name: facade
        image: ghcr.io/re8ch/service-backend-tenant-mcp@sha256:f6344bf787b425586b23f371c4128b4eb4f3655a6ce10402fe866d6871c50974
        imagePullPolicy: IfNotPresent
        env:
        - name: LISTEN_PORT
          value: "19448"
        - name: ADMIN_LISTEN_PORT
          value: "19450"
        - name: RE8CH_TOOL_PROFILE
          value: tenant
        - name: RE8CH_TOOL_AUDIENCE
          value: re8ch-admin
        - name: PUBLIC_ORIGIN
          value: https://pg-re8ch-mcp.service.re8ch.com
        - name: PUBLIC_MCP_URL
          value: https://pg-re8ch-mcp.service.re8ch.com/mcp
        - name: PUBLIC_RESOURCE_METADATA_URL
          value: https://pg-re8ch-mcp.service.re8ch.com/.well-known/oauth-protected-resource/mcp
        - name: PG_RE8CH_PUBLIC_MCP_URL
          value: https://pg-re8ch-mcp.service.re8ch.com/mcp
        - name: PG_RE8CH_RESOURCE_METADATA_URL
          value: https://pg-re8ch-mcp.service.re8ch.com/.well-known/oauth-protected-resource/mcp
        - name: PLATFORM_MODULE_REGISTRY
          value: /etc/re8ch/modules/modules.json
        - name: AUTH_DISCOVERY_URL
          value: http://supabase-identity-auth.supabase-identity.svc:9999/.well-known/oauth-authorization-server
        - name: SUPABASE_USER_URL
          value: http://supabase-identity-auth.supabase-identity.svc:9999/user
        - name: PLATFORM_MEMBERSHIP_URL
          value: http://supabase-identity-rest-ro.supabase-identity.svc:3000/rpc/my_tenant_runtime_memberships
        - name: TENANT_CONTROL_URL
          value: http://tenant-control-controller.tenant-infrastructure.svc
        - name: MCP_CATALOG_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: mcp-catalog-database
              key: MCP_CATALOG_DATABASE_URL
              optional: false
        - name: TENANT_CLAIM_SERVICE_TOKEN
          valueFrom:
            secretKeyRef:
              name: tenant-claim-internal-auth
              key: TENANT_CLAIM_SERVICE_TOKEN
              optional: false
        ports:
        - name: http
          containerPort: 19448
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /livez
            port: http
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: "1"
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        volumeMounts:
        - name: modules
          mountPath: /etc/re8ch/modules
          readOnly: true
      volumes:
      - name: modules
        configMap:
          name: pg-re8ch-mcp-modules
---
apiVersion: v1
kind: Service
metadata:
  name: pg-re8ch-mcp
  namespace: tenant-infrastructure
spec:
  selector:
    app.kubernetes.io/name: pg-re8ch-mcp
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pg-re8ch-mcp
  namespace: tenant-infrastructure
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pg-re8ch-mcp
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pg-re8ch-mcp
  namespace: tenant-infrastructure
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pg-re8ch-mcp
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - port: 19448
      protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: pg-re8ch-mcp-egress
  namespace: tenant-infrastructure
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: pg-re8ch-mcp
  egress:
  - toEntities:
    - kube-apiserver
  - toEndpoints:
    - matchLabels:
        k8s:app.kubernetes.io/name: advanced-fabric-doh
        k8s:io.kubernetes.pod.namespace: kube-system
    toPorts:
    - ports:
      - {port: "53", protocol: UDP}
      - {port: "53", protocol: TCP}
      rules:
        dns:
        - matchPattern: "*"
  - toFQDNs:
    - matchName: supabase.service.re8ch.com
    toPorts:
    - ports:
      - {port: "443", protocol: TCP}
  - toServices:
    - k8sService:
        serviceName: supabase-identity-auth
        namespace: supabase-identity
    toPorts:
    - ports:
      - {port: "9999", protocol: TCP}
  - toServices:
    - k8sService:
        serviceName: supabase-identity-rest-ro
        namespace: supabase-identity
    toPorts:
    - ports:
      - {port: "3000", protocol: TCP}
  - toServices:
    - k8sService:
        serviceName: tenant-control-controller
        namespace: tenant-infrastructure
    toPorts:
    - ports:
      - {port: "19447", protocol: TCP}
  - toServices:
    - k8sService:
        serviceName: mcp-registry-postgresql
        namespace: mcp-registry
    toPorts:
    - ports:
      - {port: "5432", protocol: TCP}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pg-re8ch-mcp-https
  namespace: tenant-infrastructure
  annotations:
    governance.re8ch.com/exposure: pg-identity-admin-only
    networking.re8ch.com/dns-authority: tenant-infrastructure/pg-re8ch-mcp-dns-authority
spec:
  hostnames: [pg-re8ch-mcp.service.re8ch.com]
  parentRefs:
  - name: re8ch-gateway-canary
    namespace: kube-system
    sectionName: service-wildcard-https
  rules:
  - matches:
    - path: {type: Exact, value: /mcp}
    filters:
    - type: URLRewrite
      urlRewrite:
        path: {type: ReplaceFullPath, replaceFullPath: /pg-re8ch/mcp}
    backendRefs:
    - {name: pg-re8ch-mcp, port: 80}
  - matches:
    - path: {type: Exact, value: /.well-known/oauth-protected-resource/mcp}
    filters:
    - type: URLRewrite
      urlRewrite:
        path: {type: ReplaceFullPath, replaceFullPath: /.well-known/oauth-protected-resource/pg-re8ch/mcp}
    backendRefs:
    - {name: pg-re8ch-mcp, port: 80}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pg-re8ch-mcp-http
  namespace: tenant-infrastructure
spec:
  hostnames: [pg-re8ch-mcp.service.re8ch.com]
  parentRefs:
  - name: re8ch-gateway-canary
    namespace: kube-system
    sectionName: http
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 308
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pg-re8ch-mcp-dns-authority
  namespace: tenant-infrastructure
  labels:
    networking.re8ch.com/dns-authority: public-edge
  annotations:
    external-dns.alpha.kubernetes.io/hostname: pg-re8ch-mcp.service.re8ch.com
    external-dns.alpha.kubernetes.io/target: tools.service.re8ch.com
    external-dns.alpha.kubernetes.io/ttl: "60"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
    networking.re8ch.com/provider: public-edge-manager
spec:
  ingressClassName: external-dns-only
  rules:
  - host: pg-re8ch-mcp.service.re8ch.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: pg-re8ch-mcp
            port:
              number: 80

  duration: 2160h
  issuerRef:
    kind: ClusterIssuer
    name: re8ch-cloudflare-dns01
  privateKey:
    algorithm: RSA
    rotationPolicy: Always
    size: 2048
  renewBefore: 360h
  secretName: stalwart-mail-re8ch-tls
---
apiVersion: v1
data:
  plan.ndjson: '{"@type":"upsert","object":"Domain","matchOn":["name"],"value":{"phonaid-domain":{"name":"phonaid.com","isEnabled":true,"aliases":{},"certificateManagement":{"@type":"Manual"},"dkimManagement":{"@type":"Automatic"},"dnsManagement":{"@type":"Manual"},"subAddressing":{"@type":"Enabled"}},"re8ch-domain":{"name":"re8ch.com","isEnabled":true,"aliases":{},"certificateManagement":{"@type":"Manual"},"dkimManagement":{"@type":"Automatic"},"dnsManagement":{"@type":"Manual"},"subAddressing":{"@type":"Enabled"}}}}

    {"@type":"upsert","object":"Certificate","matchOn":["certificate"],"value":{"mail-re8ch-com":{"certificate":{"@type":"File","filePath":"/var/run/stalwart-tls/tls.crt"},"privateKey":{"@type":"File","filePath":"/var/run/stalwart-tls/tls.key"}}}}

    {"@type":"update","object":"SystemSettings","value":{"defaultHostname":"mail.re8ch.com","defaultCertificateId":"#mail-re8ch-com","mailExchangers":{"0":{"hostname":"mail.re8ch.com","priority":10}},"services":{"caldav":{"hostname":"mail.re8ch.com","cleartext":false},"carddav":{"hostname":"mail.re8ch.com","cleartext":false},"imap":{"hostname":"mail.re8ch.com","cleartext":false},"jmap":{"hostname":"mail.re8ch.com","cleartext":false},"managesieve":{"hostname":"mail.re8ch.com","cleartext":false},"pop3":{"hostname":"mail.re8ch.com","cleartext":false},"smtp":{"hostname":"mail.re8ch.com","cleartext":false},"webdav":{"hostname":"mail.re8ch.com","cleartext":false}}}}

    {"@type":"upsert","object":"NetworkListener","matchOn":["name"],"value":{"submission":{"name":"submission","protocol":"smtp","bind":{"[::]:587":true},"tlsImplicit":false},"imap":{"name":"imap","protocol":"imap","bind":{"[::]:143":true},"tlsImplicit":false}}}

    {"@type":"update","object":"Sharing","value":{"allowDirectoryQueries":false,"maxShares":25}}

    '
kind: ConfigMap
metadata:
  name: stalwart-bootstrap-plan
  namespace: mail-system
---
apiVersion: v1
data:
  accountContract: Resolve the account and shared collections from the authenticated
    provider session; use the full percent-encoded email address or server-returned
    account ID, never an inferred email local part.
  baseUrl: https://id.re8ch.com
  caldav: https://id.re8ch.com/.well-known/caldav
  carddav: https://id.re8ch.com/.well-known/carddav
  credentialContract: Kubernetes Secret reference only; never inject a primary password
    into an image or Git workspace.
  discoveryContract: Resolve relative hrefs against the configured provider origin;
    reject cross-origin URLs, embedded credentials, path traversal and redirects that
    would forward credentials to another origin.
  jmapSession: https://id.re8ch.com/.well-known/jmap
  managementContract: stalwart-cli remains cluster-internal and authenticates through
    mail-system/stalwart-recovery-admin.
  sandboxContract: Mount one revocable Stalwart application-password Secret per bot
    and expose only the protocol endpoints listed here.
  webdav: https://id.re8ch.com/dav/file/{account}
kind: ConfigMap
metadata:
  labels:
    governance.re8ch.com/evidence-plane: planning
  name: stalwart-bot-access-contract
  namespace: mail-system
---
apiVersion: v1
data:
  sync.py: "import json, os, ssl, urllib.error, urllib.request\n\nroot = \"/var/run/secrets/kubernetes.io/serviceaccount\"\
    \nbearer = open(root + \"/token\", encoding=\"utf-8\").read().strip()\napi = \"\
    https://%s:%s\" % (os.environ[\"KUBERNETES_SERVICE_HOST\"], os.environ[\"KUBERNETES_SERVICE_PORT_HTTPS\"\
    ])\ncontext = ssl.create_default_context(cafile=root + \"/ca.crt\")\nheaders =\
    \ {\"Authorization\": \"Bearer \" + bearer, \"Content-Type\": \"application/json\"\
    }\n\ndef request(method, path, body=None):\n    payload = None if body is None\
    \ else json.dumps(body, separators=(\",\", \":\")).encode()\n    req = urllib.request.Request(api\
    \ + path, data=payload, headers=headers, method=method)\n    try:\n        with\
    \ urllib.request.urlopen(req, context=context, timeout=15) as response:\n    \
    \        return json.load(response) if response.length else {}\n    except urllib.error.HTTPError\
    \ as error:\n        if error.code == 404:\n            return None\n        raise\n\
    \nsource = request(\"GET\", \"/api/v1/namespaces/qianwen-ops/secrets/cloudflare-pg-dns-controller-secret\"\
    )\nencoded = (source.get(\"data\") or {}).get(\"CF_API_TOKEN\") if source else\
    \ None\nif not encoded:\n    raise RuntimeError(\"Cloudflare credential source\
    \ is unavailable\")\n\ntarget_path = \"/api/v1/namespaces/mail-system/secrets/stalwart-cloudflare-dns-token\"\
    \ncurrent = request(\"GET\", target_path)\nbody = {\n    \"apiVersion\": \"v1\"\
    , \"kind\": \"Secret\",\n    \"metadata\": {\n        \"name\": \"stalwart-cloudflare-dns-token\"\
    , \"namespace\": \"mail-system\",\n        \"labels\": {\"app.kubernetes.io/managed-by\"\
    : \"stalwart-cloudflare-token-sync\"},\n    },\n    \"type\": \"Opaque\", \"data\"\
    : {\"CF_API_TOKEN\": encoded},\n}\nif current:\n    body[\"metadata\"][\"resourceVersion\"\
    ] = current[\"metadata\"][\"resourceVersion\"]\n    request(\"PUT\", target_path,\
    \ body)\nelse:\n    request(\"POST\", \"/api/v1/namespaces/mail-system/secrets\"\
    , body)\nprint(json.dumps({\"synced\": True, \"target\": \"mail-system/stalwart-cloudflare-dns-token\"\
    }))\n"

  namespace: mail-system
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          containers:
          - command:
            - python3
            - /app/sync.py
            image: docker.1ms.run/library/python@sha256:d09d15e60962ca365d1cd544a48773bac9d33f2fb1b00f2aa0deec78ade7dc31
            name: sync
            resources:
              limits:
                cpu: 100m
                memory: 64Mi
              requests:
                cpu: 10m
                memory: 32Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
            volumeMounts:
            - mountPath: /app
              name: app
              readOnly: true
          nodeSelector:
            kubernetes.io/hostname: overseas-flk
          restartPolicy: OnFailure
          securityContext:
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          serviceAccountName: stalwart-cloudflare-token-sync
          tolerations:
          - effect: NoSchedule
            key: dedicated
            operator: Equal
            value: overseas-edge
          - effect: NoSchedule
            key: scheduling.re8ch.com/capacity-window
            operator: Equal
            value: closed
          volumes:
          - configMap:
              name: stalwart-cloudflare-token-sync
            name: app
      ttlSecondsAfterFinished: 604800
  schedule: 7 * * * *
  successfulJobsHistoryLimit: 2

apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: api-conformance-controller
  namespace: api-conformance-system
spec:
  egress:
  - toEntities:
    - kube-apiserver
  - toEndpoints:
    - matchLabels:
        k8s:app.kubernetes.io/name: advanced-fabric-doh
        k8s:io.kubernetes.pod.namespace: kube-system
    toPorts:
    - ports:
      - port: '53'
        protocol: UDP
      - port: '53'
        protocol: TCP
      rules:
        dns:
        - matchPattern: '*'
  - toFQDNs:
    - matchName: api.github.com
    toPorts:
    - ports:
      - port: '443'
        protocol: TCP
  - toEntities:
    - host
    toPorts:
    - ports:
      - port: '17893'
        protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: api-conformance-controller

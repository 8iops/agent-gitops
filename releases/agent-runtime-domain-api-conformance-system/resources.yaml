  request_budget.py: "\"\"\"Cross-process attempt budget. State contains counters\
    \ only, never HTTP data.\"\"\"\nimport fcntl\nimport json\nimport time\nfrom pathlib\
    \ import Path\n\n\nclass BudgetExceeded(RuntimeError):\n    pass\n\n\ndef initialize(path,\
    \ maximum, reserved=0, rate=1):\n    if not 1 <= maximum <= 2000 or not 0 <= reserved\
    \ < maximum or not 1 <= rate <= 5:\n        raise ValueError(\"invalid request\
    \ budget\")\n    with Path(path).open(\"x\") as handle:\n        json.dump({\"\
    maximum\": maximum, \"reserved\": reserved, \"rate\": rate, \"used\": 0, \"next\"\
    : 0}, handle)\n\n\ndef take(path, *, compensation=False):\n    # Hold the lock\
    \ through pacing so concurrent processes cannot burst.\n    with Path(path).open(\"\
    r+\") as handle:\n        fcntl.flock(handle, fcntl.LOCK_EX)\n        state =\
    \ json.load(handle)\n        limit = state[\"maximum\"] if compensation else state[\"\
    maximum\"] - state[\"reserved\"]\n        if state[\"used\"] >= limit:\n     \
    \       raise BudgetExceeded(\"request budget exhausted\")\n        wait = state[\"\
    next\"] - time.monotonic()\n        if wait > 0:\n            time.sleep(wait)\n\
    \        state[\"used\"] += 1  # Consume before sending, including lost responses.\n\
    \        state[\"next\"] = time.monotonic() + 1 / state[\"rate\"]\n        handle.seek(0)\n\
    \        json.dump(state, handle)\n        handle.truncate()\n        handle.flush()\n\
    \        return state[\"used\"]\n"

apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-conformance-controller
  namespace: api-conformance-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-conformance-controller
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-conformance-controller
    spec:
      containers:
      - command:
        - python
        - /app/controller.py
        env:
        - name: CODE_CONFIG_MAP
          value: api-conformance-code-b85hdm9t6c
        - name: GITHUB_REPOSITORY_INSTALLATIONS
          value: '{"re8ch/cloud-functions":"171153917"}'
        - name: DISCOVERY_ENABLED
          value: 'false'
        - name: RUNNER_PULL_SECRET
          value: harbor-functions-shared-pull
        - name: RUNNER_NAMESPACE
          value: api-conformance-runners
        - name: RUNNER_IMAGE
          value: registry.re8ch.com/functions-shared/api-conformance-runner@sha256:f91f4d46e1eff19bcd68917e683fb8a43565c4aa403af0309453ec8ca7a9c418
        - name: HOST_IDENTITY_EGRESS_IPS
          value: '["223.159.210.222"]'
        - name: RESULT_DELIVERY_MODE
          value: oidc
        - name: HTTPS_PROXY
          value: http://10.43.179.196:17893
        - name: NO_PROXY
          value: localhost,127.0.0.1,::1,.svc,.cluster.local,10.0.0.0/8,100.64.0.0/10
        - name: RESULT_REPOSITORY_BINDINGS
          value: '{"re8ch/cloud-functions":{"repositoryId":"1248776882","ownerId":"283958313"}}'
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: GITHUB_APP_ID
          valueFrom:
            secretKeyRef:
              key: app-id
              name: api-conformance-github-app
              optional: true
        image: python:3.13-alpine@sha256:540c7d91f98ff6880174c40e99067bf5941eb54d818a7a5e094d188b196a934d
        name: controller
        resources:
          limits:
            cpu: 300m
            memory: 192Mi
          requests:
            cpu: 25m
            memory: 48Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /app
          name: code
          readOnly: true
        - mountPath: /github-app
          name: github-app
          readOnly: true
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: api-conformance-controller
      volumes:
      - configMap:
          name: api-conformance-code-b85hdm9t6c
        name: code
      - name: github-app
        secret:
          items:
          - key: private-key.pem
            path: private-key.pem
          optional: true
          secretName: api-conformance-github-app

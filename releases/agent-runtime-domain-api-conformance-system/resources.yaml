apiVersion: v1
data:
  budget_hooks.py: "\"\"\"Schemathesis 4.29.1 transport guard, loaded before any remote\
    \ request.\"\"\"\nimport os\n\nfrom request_budget import take\n\n\ndef install():\n\
    \    import requests.adapters\n    import schemathesis.transport.requests as transport\n\
    \n    path = os.environ[\"RE8CH_REQUEST_BUDGET\"]\n    original = requests.adapters.HTTPAdapter.send\n\
    \n    def bounded_send(self, request, **kwargs):\n        take(path)\n       \
    \ return original(self, request, **kwargs)\n\n    requests.adapters.HTTPAdapter.send\
    \ = bounded_send\n    # 4.29.1 retries dropped connections once even with --request-retries=0.\n\
    \    # An unknown write outcome must not silently be replayed.\n    transport._request_resending_on_dropped_connection\
    \ = lambda session, data: session.request(**data)\n\n\ninstall()\n"
  contract.py: "#!/usr/bin/env python3\n\"\"\"Pure validation and redaction helpers\
    \ for API conformance runs.\"\"\"\n\nfrom __future__ import annotations\n\nimport\
    \ hashlib\nimport ipaddress\nimport json\nimport re\nfrom urllib.parse import\
    \ urlparse\n\nSAFE_METHODS = frozenset({\"get\", \"head\", \"options\"})\nMUTATION_METHODS\
    \ = frozenset({\"post\", \"put\", \"patch\", \"delete\"})\nSECRET_KEYS = (\"authorization\"\
    , \"cookie\", \"token\", \"secret\", \"password\", \"private\", \"credential\"\
    )\nMAX_REPORT_BYTES = 60 * 1024\n\n\nclass ContractError(ValueError):\n    pass\n\
    \n\ndef _require(value: bool, message: str) -> None:\n    if not value:\n    \
    \    raise ContractError(message)\n\n\ndef validate_target(spec: dict) -> dict:\n\
    \    \"\"\"Validate a target without resolving credentials or making requests.\"\
    \"\"\n    repository = spec.get(\"repository\", \"\")\n    _require(bool(re.fullmatch(r\"\
    [A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+\", repository)), \"invalid repository\")\n   \
    \ base = urlparse(spec.get(\"baseUrl\", \"\"))\n    schema = urlparse(spec.get(\"\
    schema\", {}).get(\"url\", \"\"))\n    _require(base.scheme == \"https\" and bool(base.hostname),\
    \ \"baseUrl must be HTTPS\")\n    _require(schema.scheme == \"https\" and bool(schema.hostname),\
    \ \"schema URL must be HTTPS\")\n    allowed = set(spec.get(\"network\", {}).get(\"\
    allowedHosts\", []))\n    _require(bool(allowed) and base.hostname in allowed\
    \ and schema.hostname in allowed, \"host is not allowlisted\")\n    for host,\
    \ address in spec.get(\"network\", {}).get(\"pinnedEgressIPs\", {}).items():\n\
    \        _require(host in allowed, \"pinned egress host is not allowlisted\")\n\
    \        try:\n            ip = ipaddress.ip_address(address)\n        except\
    \ ValueError as exc:\n            raise ContractError(\"invalid pinned egress\
    \ IP\") from exc\n        _require(ip.version == 4 and ip.is_global, \"pinned\
    \ egress IP must be public IPv4\")\n    entity = spec.get(\"network\", {}).get(\"\
    pinnedEgressEntity\")\n    _require(entity in (None, \"host\"), \"invalid pinned\
    \ egress entity\")\n    if entity == \"host\":\n        _require(set(spec[\"network\"\
    ].get(\"pinnedEgressIPs\", {})) == allowed,\n                 \"host identity\
    \ egress requires every allowed host to be pinned\")\n    digest = spec.get(\"\
    schema\", {}).get(\"sha256\", \"\")\n    _require(bool(re.fullmatch(r\"[a-f0-9]{64}\"\
    , digest)), \"schema digest must be sha256\")\n    limits = spec.get(\"limits\"\
    , {})\n    _require(1 <= int(limits.get(\"maxExamples\", 25)) <= 100, \"maxExamples\
    \ out of range\")\n    _require(1 <= int(limits.get(\"maxRequests\", 500)) <=\
    \ 2000, \"maxRequests out of range\")\n    _require(1 <= int(limits.get(\"ratePerSecond\"\
    , 1)) <= 5, \"ratePerSecond out of range\")\n    _require(60 <= int(limits.get(\"\
    timeoutSeconds\", 600)) <= 900, \"timeoutSeconds out of range\")\n    checks =\
    \ spec.get(\"checks\", {})\n    excluded = checks.get(\"exclude\", [])\n    _require(isinstance(excluded,\
    \ list) and excluded in ([], [\"unsupported_method\"]),\n             \"only the\
    \ reviewed unsupported_method exception is allowed\")\n    if excluded:\n    \
    \    _require(isinstance(checks.get(\"rationale\"), str) and len(checks[\"rationale\"\
    ].strip()) >= 40,\n                 \"excluded check requires a documented rationale\"\
    )\n    mutations = spec.get(\"operations\", {}).get(\"mutationOperationIds\",\
    \ [])\n    if mutations:\n        _require(spec.get(\"canary\", {}).get(\"tenantRef\"\
    , \"\").startswith(\"schemathesis-canary\"),\n                 \"mutations require\
    \ a dedicated canary tenant\")\n        _require(bool(spec.get(\"lifecycle\",\
    \ {}).get(\"cleanup\")), \"mutations require cleanup steps\")\n        _require(bool(spec.get(\"\
    operations\", {}).get(\"allowGeneratedMutations\") is True),\n               \
    \  \"generated mutations require an explicit opt-in\")\n    return spec\n\n\n\
    def validate_document(document: dict, target: dict) -> dict[str, tuple[str, str]]:\n\
    \    \"\"\"Reject remote references and return operationId -> (method, path).\"\
    \"\"\n    _require(isinstance(document, dict) and isinstance(document.get(\"paths\"\
    ), dict), \"invalid OpenAPI document\")\n    encoded = json.dumps(document, separators=(\"\
    ,\", \":\"), sort_keys=True)\n    for match in re.finditer(r'\"\\$ref\":\"([^\"\
    ]+)\"', encoded):\n        _require(match.group(1).startswith(\"#/\"), \"only\
    \ document-local OpenAPI references are allowed\")\n    operations: dict[str,\
    \ tuple[str, str]] = {}\n    for path, item in document[\"paths\"].items():\n\
    \        if not isinstance(item, dict):\n            continue\n        for method,\
    \ operation in item.items():\n            if method.lower() not in SAFE_METHODS\
    \ | MUTATION_METHODS or not isinstance(operation, dict):\n                continue\n\
    \            operation_id = operation.get(\"operationId\")\n            _require(isinstance(operation_id,\
    \ str) and operation_id, f\"missing operationId: {method} {path}\")\n        \
    \    _require(operation_id not in operations, f\"duplicate operationId: {operation_id}\"\
    )\n            operations[operation_id] = (method.lower(), path)\n    configured\
    \ = target.get(\"operations\", {})\n    for operation_id in configured.get(\"\
    readOperationIds\", []) + configured.get(\"mutationOperationIds\", []):\n    \
    \    _require(operation_id in operations, f\"unknown operationId: {operation_id}\"\
    )\n    for operation_id in configured.get(\"readOperationIds\", []):\n       \
    \ _require(operations[operation_id][0] in SAFE_METHODS, f\"read operation is mutating:\
    \ {operation_id}\")\n    for operation_id in configured.get(\"mutationOperationIds\"\
    , []):\n        _require(operations[operation_id][0] in MUTATION_METHODS, f\"\
    mutation operation is not mutating: {operation_id}\")\n    for steps in target.get(\"\
    lifecycle\", {}).values():\n        for step in steps:\n            operation_id\
    \ = step.get(\"operationId\")\n            _require(operation_id in operations,\
    \ \"lifecycle requires a schema operationId\")\n            method, path = operations[operation_id]\n\
    \            allowlist = configured.get(\"readOperationIds\", []) if method in\
    \ SAFE_METHODS else configured.get(\"mutationOperationIds\", [])\n           \
    \ _require(operation_id in allowlist, \"lifecycle operation is not allowlisted\"\
    )\n            _require(step.get(\"method\", \"\").lower() == method, \"lifecycle\
    \ method differs from schema\")\n            pattern = re.escape(path)\n     \
    \       pattern = re.sub(r\"\\\\\\{[^{}]+\\\\\\}\", r\"[^/]+\", pattern)\n   \
    \         _require(re.fullmatch(pattern, step.get(\"path\", \"\").split(\"?\"\
    , 1)[0]) is not None,\n                     \"lifecycle path differs from schema\"\
    )\n    return operations\n\n\ndef schema_digest(raw: bytes) -> str:\n    return\
    \ hashlib.sha256(raw).hexdigest()\n\n\ndef failure_fingerprint(value: object)\
    \ -> str:\n    raw = json.dumps(value, sort_keys=True, separators=(\",\", \":\"\
    ), default=str).encode()\n    return hashlib.sha256(raw).hexdigest()[:20]\n\n\n\
    def sanitized_summary(*, target: str, run_id: str, mode: str, seed: int, schema_sha256:\
    \ str,\n                      exit_code: int, report: dict | None, lifecycle:\
    \ dict, audit_refs: list[str]) -> dict:\n    \"\"\"Project a potentially sensitive\
    \ Schemathesis report into a bounded result.\"\"\"\n    report = report if isinstance(report,\
    \ dict) else {}\n    cases = report.get(\"test_cases\", {}) if isinstance(report.get(\"\
    test_cases\"), dict) else {}\n    operations = report.get(\"operations\", {})\
    \ if isinstance(report.get(\"operations\"), dict) else {}\n    failures = report.get(\"\
    failures\", []) if isinstance(report.get(\"failures\"), list) else []\n    errors\
    \ = report.get(\"errors\", []) if isinstance(report.get(\"errors\"), list) else\
    \ []\n    # These are the actual 4.29.1 JSON report fields, not the legacy statistics\n\
    \    # structure. A successful process alone cannot prove that tests ran.\n  \
    \  counts = {\n        \"generated\": int(cases.get(\"generated\", 0) or 0),\n\
    \        \"withFailures\": int(cases.get(\"with_failures\", 0) or 0),\n      \
    \  \"withoutChecks\": int(cases.get(\"without_checks\", 0) or 0),\n        \"\
    uniqueFailures\": int(cases.get(\"unique_failures\", 0) or 0),\n        **{\"\
    operations\" + key.title(): int(operations.get(key, 0) or 0)\n           for key\
    \ in (\"total\", \"selected\", \"tested\", \"errored\", \"skipped\")},\n    }\n\
    \    _require(all(0 <= value <= 1000000 for value in counts.values()), \"invalid\
    \ report counts\")\n    passed = (exit_code == 0 and report.get(\"exit_code\"\
    ) == 0\n              and report.get(\"complete\") is True and report.get(\"stop_reason\"\
    ) == \"completed\"\n              and report.get(\"schemathesis_version\") ==\
    \ \"4.29.1\"\n              and counts[\"generated\"] > counts[\"withoutChecks\"\
    ]\n              and counts[\"operationsTested\"] == counts[\"operationsSelected\"\
    ] > 0\n              and counts[\"operationsSkipped\"] == 0 and counts[\"withFailures\"\
    ] == 0\n              and counts[\"operationsErrored\"] == 0 and not failures\
    \ and not errors\n              and lifecycle.get(\"cleanup\") != \"failed\" and\
    \ lifecycle.get(\"reversal\") != \"failed\")\n    # Counts, titles, bodies, random\
    \ examples and exception text are not stable\n    # regression identities. Hash\
    \ only the check type and operation templates.\n    fingerprints = {failure_fingerprint({\"\
    type\": item.get(\"type\"), \"operations\": item.get(\"operations\", [])})\n \
    \                   for item in failures if isinstance(item, dict)}\n    result\
    \ = {\n        \"version\": 1,\n        \"target\": target,\n        \"runId\"\
    : run_id,\n        \"mode\": mode,\n        \"engine\": \"schemathesis\",\n  \

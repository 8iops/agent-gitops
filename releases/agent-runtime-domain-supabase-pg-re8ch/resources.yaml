---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ops-admin-postgres-credential
  namespace: supabase-pg-re8ch
rules:
- apiGroups:
  - ''
  resourceNames:
  - supabase-pg-re8ch-secrets
  resources:
  - secrets
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: re8ch:toolhive-platform-restart
  namespace: supabase-pg-re8ch
rules:
- apiGroups:
  - apps
  resourceNames:
  - supabase-studio
  resources:
  - deployments
  verbs:
  - get
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ops-admin-postgres-credential
  namespace: supabase-pg-re8ch
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ops-admin-postgres-credential
subjects:
- kind: ServiceAccount
  name: ops-mcp-admin
  namespace: toolhive-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: re8ch:toolhive-platform-restart
  namespace: supabase-pg-re8ch
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: re8ch:toolhive-platform-restart
subjects:
- kind: ServiceAccount
  name: ops-mcp-operate
  namespace: toolhive-system

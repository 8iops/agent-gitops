apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenant-provider-reconciler
  namespace: tenant-infrastructure
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tenant-provider-reconciler
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: tenant-provider-reconciler
        saas.re8ch.com/tenant: platform
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - r640
      containers:
      - command:
        - python
        - /app/tenant_provider_reconciler.py
        env:
        - name: STALWART_URL
          value: https://stalwart-admin.service.re8ch.com
        - name: IDENTITY_REST_URL
          value: http://supabase-identity-rest.supabase-identity.svc:3000
        - name: IDENTITY_SERVICE_KEY
          valueFrom:
            secretKeyRef:
              key: service-role-key
              name: tenant-provider-identity
        - name: GRAFANA_DATABASE_BINDINGS_JSON
          value: '[{"database":"anysite","namespace":"re8ch-anysite","secretName":"anysite-db-credentials","secretUID":"ecb4edf3-eb40-4b0e-ab28-7bf3dab490c4","tenantRef":"re8ch"},{"database":"secretary","namespace":"re8ch-secretary","secretName":"secretary-db-credentials","secretUID":"e31d554c-5cf8-4663-adcd-811849a31b3c","tenantRef":"re8ch"}]'
        image: registry.re8ch.com/image/re8ch-ai-operations@sha256:07515ac19cebfbeedeb1dbc42cac237eea98952f8b47293120e19cd7fd30cd52
        name: reconciler
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 25m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /cli
          name: stalwart-cli
          readOnly: true
      dnsConfig:
        nameservers:
        - 10.43.0.53
        options:
        - name: ndots
          value: '5'
        searches:
        - observability-ai.svc.cluster.local
        - tenant-infrastructure.svc.cluster.local
        - svc.cluster.local
        - cluster.local
      dnsPolicy: None
      imagePullSecrets: []
      serviceAccountName: tenant-provider-reconciler
      tolerations:
      - operator: Exists
      volumes:
      - image:
          pullPolicy: IfNotPresent
          reference: ghcr.io/stalwartlabs/cli@sha256:5b70732cb69cdab3ff0894c501544cf0bfa180fa75bcd0eeba4eebe04c1064e1
        name: stalwart-cli

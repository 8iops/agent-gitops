---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kyverno-toolhive-pull-secret-source
  namespace: anycam
rules:
- apiGroups:
  - ''
  resourceNames:
  - harbor-functions-shared-pull
  resources:
  - secrets
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: credential-broker-secret-injector
  namespace: anycam
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: credential-broker-secret-injector
subjects:
- kind: ServiceAccount
  name: credential-broker
  namespace: credential-broker
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kyverno-toolhive-pull-secret-source
  namespace: anycam
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kyverno-toolhive-pull-secret-source
subjects:
- kind: ServiceAccount
  name: kyverno-admission-controller
  namespace: kyverno
- kind: ServiceAccount
  name: kyverno-background-controller
  namespace: kyverno

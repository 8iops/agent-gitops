---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: re8ch:toolhive-platform-restart
  namespace: observability-system
rules:
- apiGroups:
  - apps
  resourceNames:
  - re8ch-grafana
  resources:
  - deployments
  verbs:
  - get
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: re8ch:toolhive-platform-restart
  namespace: observability-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: re8ch:toolhive-platform-restart
subjects:
- kind: ServiceAccount
  name: ops-mcp-operate
  namespace: toolhive-system

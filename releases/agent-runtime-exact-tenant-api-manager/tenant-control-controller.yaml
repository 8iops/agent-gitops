apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenant-control-controller
  namespace: tenant-infrastructure
spec:
  replicas: 1
  progressDeadlineSeconds: 180
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app: tenant-control-controller
  template:
    metadata:
      labels:
        app: tenant-control-controller
        saas.re8ch.com/tenant: platform
    spec:
      serviceAccountName: tenant-control-controller
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - 10.43.0.53
        searches:
        - observability-ai.svc.cluster.local
        - tenant-infrastructure.svc.cluster.local
        - svc.cluster.local
        - cluster.local
        options:
        - name: ndots
          value: '5'
      tolerations:
      - operator: Exists
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - r640
      imagePullSecrets:
      - name: harbor-registry-pull
      containers:
      - name: controller
        image: registry.re8ch.com/image/re8ch-ai-operations@sha256:186ef837e5b6b0db84d75efab1f7c6e203b5e0055df6cbfaa68c546875109a45
        command:
        - python
        - /app/tenant_control_controller.py
        envFrom:
        - secretRef:
            name: tenant-registry-supply-chain
            optional: true
        - secretRef:
            name: tenant-claim-internal-auth
            optional: true
        env:
        - name: SENTRY_DSN
          value: https://2b6b17d602c68bbb6789de55c05afa1a@o4509349085577216.ingest.us.sentry.io/4509349088985088
        - name: SENTRY_ENVIRONMENT
          value: production
        - name: SENTRY_RELEASE
          value: tenant-control@f0ccebc180b3ed99ad59b26ed949e8d830502cdd
        - name: LISTEN_PORT
          value: '19447'
        - name: IMAGE_POLICY_URL
          value: http://harbor-supply-chain.tenant-infrastructure.svc
        - name: IDENTITY_REST_URL
          value: http://supabase-identity-rest.supabase-identity.svc:3000
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        ports:
        - name: http
          containerPort: 19447
        startupProbe:
          httpGet:
            path: /livez
            port: http
          failureThreshold: 30
          periodSeconds: 2
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          failureThreshold: 3
          periodSeconds: 5
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /livez
            port: http
          failureThreshold: 3
          periodSeconds: 15
          timeoutSeconds: 3
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL

apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    ai.connectool.io/mcp-backend: 'true'
    re8ch.com/publication-stage: release-gated
  name: tenant-api
  namespace: tenant-infrastructure
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tenant-api
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        ai.connectool.io/mcp-backend: 'true'
        app: tenant-api
        saas.re8ch.com/tenant: platform
        tenant-runtime: 'true'
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - r640
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: admin-api
            topologyKey: kubernetes.io/hostname
      automountServiceAccountToken: true
      containers:
      - env:
        - name: SENTRY_DSN
          value: https://2b6b17d602c68bbb6789de55c05afa1a@o4509349085577216.ingest.us.sentry.io/4509349088985088
        - name: SENTRY_ENVIRONMENT
          value: production
        - name: SENTRY_RELEASE
          value: tenant-mcp@1797f498fca5030e516978db94bc7f5e59496f1a
        - name: RE8CH_TOOL_PROFILE
          value: tenant
        - name: RE8CH_TOOL_AUDIENCE
          value: re8ch-tenant
        - name: INVOCATION_TOKEN_ISSUER_URL
          value: http://tenant-control-controller.tenant-infrastructure.svc/v1/invocation-tokens
        - name: INVOCATION_TOKEN_JWKS_URL
          value: http://tenant-control-controller.tenant-infrastructure.svc/.well-known/invocation-jwks.json
        - name: INVOCATION_TOKEN_ISSUER
          value: https://tools.service.re8ch.com/invocation
        - name: TENANT_CLAIM_SERVICE_TOKEN
          valueFrom:
            secretKeyRef:
              name: tenant-claim-internal-auth
              key: TENANT_CLAIM_SERVICE_TOKEN
              optional: false
        - name: MCP_CATALOG_INTERNAL_TOKEN
          valueFrom:
            secretKeyRef:
              key: TENANT_CLAIM_SERVICE_TOKEN
              name: tenant-claim-internal-auth
        - name: SERVICE_API_TOKEN
          valueFrom:
            secretKeyRef:
              key: token
              name: admin-vmcp-backend-auth
        - name: ALLOW_AUTHENTICATED_DEX
          value: 'true'
        - name: LISTEN_PORT
          value: '19448'
        - name: PUBLIC_MCP_URL
          value: https://tools.service.re8ch.com/tenant-plugin/mcp
        - name: OPENAI_APPS_CHALLENGE_TOKEN
          value: 6n3O48vy3O89euYVrri4aHJMeUJ_vkofxLpzxv-6TTE
        - name: PUBLIC_ORIGIN
          value: https://tools.service.re8ch.com
        - name: PUBLIC_RESOURCE_METADATA_URL
          value: https://tools.service.re8ch.com/.well-known/oauth-protected-resource/tenant-plugin/mcp
        - name: TENANT_CONTROL_URL
          value: http://tenant-control-controller.tenant-infrastructure.svc
        - name: AUTH_DISCOVERY_URL
          value: http://supabase-identity-auth.supabase-identity.svc:9999/.well-known/oauth-authorization-server
        - name: DEX_USERINFO_URL
          value: https://api.re8ch.com/auth/userinfo
        - name: SUPABASE_USER_URL
          value: http://supabase-identity-auth.supabase-identity.svc:9999/user
        - name: HARBOR_SUPPLY_CHAIN_URL
          value: http://harbor-supply-chain.tenant-infrastructure.svc
        - name: HARBOR_SUPPLY_CHAIN_REQUIRED
          value: 'false'
        - name: TENANT_SERVICE_DB
          value: /var/lib/tenant-platform/tenant-services.db
        - name: TENANT_USAGE_CLIENT
          value: system:serviceaccount:observability-ai:birfucate-metering
        - name: DEVICE_REGISTRY_PATH
          value: /var/lib/tenant-platform/tenant-devices.db
        - name: GITHUB_GOVERNANCE_APP_ID
          valueFrom:
            secretKeyRef: {name: github-enterprise-governance-app, key: app-id}
        - name: GITHUB_GOVERNANCE_PRIVATE_KEY
          valueFrom:
            secretKeyRef: {name: github-enterprise-governance-app, key: private-key}
        - name: GITHUB_DELIVERY_APP_ID
          valueFrom:
            secretKeyRef: {name: github-enterprise-delivery-app, key: app-id, optional: true}
        - name: GITHUB_DELIVERY_PRIVATE_KEY
          valueFrom:
            secretKeyRef: {name: github-enterprise-delivery-app, key: private-key, optional: true}
        - name: GITHUB_SECURITY_APP_ID
          valueFrom:
            secretKeyRef: {name: github-enterprise-security-app, key: app-id, optional: true}
        - name: GITHUB_SECURITY_PRIVATE_KEY
          valueFrom:
            secretKeyRef: {name: github-enterprise-security-app, key: private-key, optional: true}
        - name: GITHUB_COLLABORATION_APP_ID
          valueFrom:
            secretKeyRef: {name: github-enterprise-collaboration-app, key: app-id, optional: true}
        - name: GITHUB_COLLABORATION_PRIVATE_KEY
          valueFrom:
            secretKeyRef: {name: github-enterprise-collaboration-app, key: private-key, optional: true}
        - name: GITHUB_DEVELOPER_AI_APP_ID
          valueFrom:
            secretKeyRef: {name: github-enterprise-developer-ai-app, key: app-id, optional: true}
        - name: GITHUB_DEVELOPER_AI_PRIVATE_KEY
          valueFrom:
            secretKeyRef: {name: github-enterprise-developer-ai-app, key: private-key, optional: true}
        - name: GITHUB_IDENTITY_APP_ID
          valueFrom:
            secretKeyRef: {name: github-enterprise-identity-app, key: app-id, optional: true}
        - name: GITHUB_IDENTITY_PRIVATE_KEY
          valueFrom:
            secretKeyRef: {name: github-enterprise-identity-app, key: private-key, optional: true}
        - name: GITHUB_BILLING_APP_ID
          valueFrom:
            secretKeyRef: {name: github-enterprise-billing-app, key: app-id, optional: true}
        - name: GITHUB_BILLING_PRIVATE_KEY
          valueFrom:
            secretKeyRef: {name: github-enterprise-billing-app, key: private-key, optional: true}
        - name: PLATFORM_USERS_URL
          value: https://api.re8ch.com/auth/v2/users
        - name: PLATFORM_ORGANIZATIONS_URL
          value: https://api.re8ch.com/auth/v2/organizations
        - name: COLLABORATION_ENABLED
          value: 'true'
        - name: COLLABORATION_CREDENTIAL_NAMESPACE
          value: stalwart-credentials
        - name: STALWART_URL
          value: https://id.re8ch.com
        - name: STALWART_CONNECT_URL
          value: http://stalwart.mail-system.svc.cluster.local:8080
        - name: STALWART_CLIENT_ID
          value: stalwart-webui
        - name: COLLABORATION_AUTH_MODE
          value: auth-hub-pkce
        - name: STALWART_AUTHORIZATION_URL
          value: https://auth.re8ch.com/authorize
        - name: STALWART_TOKEN_URL
          value: https://auth.re8ch.com/token
        - name: STALWART_REDIRECT_URI
          value: https://tools.service.re8ch.com/collaboration/oauth/callback
        - name: PLATFORM_MODULE_REGISTRY
          value: /etc/re8ch/modules/modules.json
        - name: DYNAMIC_SKILL_DB
          value: /var/lib/tenant-platform/dynamic-skills.db
        - name: DYNAMIC_SKILL_ADMIN_TOKEN
          valueFrom:
            secretKeyRef:
              key: token
              name: admin-vmcp-backend-auth
        - name: ADMIN_LISTEN_PORT
          value: '19450'
        envFrom:
        - secretRef:
            name: tenant-claim-internal-auth
            optional: false
        - secretRef:
            name: tenant-registry-supply-chain
            optional: true
        - secretRef:
            name: tenant-grafana-credentials
            optional: true
        image: registry.re8ch.com/image/re8ch-tenant-mcp@sha256:46b2d66130695d3cbedf1065ba0c4b41a27165d7d26b553e44b45644985f2f22
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /livez
            port: http
          periodSeconds: 15
          timeoutSeconds: 3
        name: runtime
        ports:
        - containerPort: 19448
          name: http
        - containerPort: 19450
          name: skill-admin
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 5
          timeoutSeconds: 10
        resources:
          limits:
            cpu: '4'
            memory: 4Gi
          requests:
            cpu: 500m
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /livez
            port: http
          periodSeconds: 2
          timeoutSeconds: 3
        volumeMounts:
        - mountPath: /var/lib/tenant-platform
          name: runtime-state
        - mountPath: /etc/re8ch/modules
          name: platform-modules
          readOnly: true
      - env:
        - name: SENTRY_DSN
          value: https://2b6b17d602c68bbb6789de55c05afa1a@o4509349085577216.ingest.us.sentry.io/4509349088985088
        - name: SENTRY_ENVIRONMENT
          value: production
        - name: SENTRY_RELEASE
          value: connectool-catalog-gateway@b807d673d7387b67494fb1888047f220522ad7f1
        - name: TENANT_CORE_URL
          value: http://127.0.0.1:19448
        - name: LISTEN_ADDR
          value: :19449
        image: ghcr.io/among-clusters/connectool-catalog-gateway@sha256:c444a5de464580bd2146132b1be4f23ed40295693153da10144208178392a0e7
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /livez
            port: catalog-mcp
          periodSeconds: 15
          timeoutSeconds: 3
        name: catalog-gateway
        ports:
        - containerPort: 19449
          name: catalog-mcp
        readinessProbe:
          httpGet:
            path: /livez
            port: catalog-mcp
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          limits:
            cpu: '2'
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      dnsConfig:
        nameservers:
        - 10.43.0.53
        options:
        - name: ndots
          value: '5'
        searches:
        - observability-ai.svc.cluster.local
        - tenant-infrastructure.svc.cluster.local
        - svc.cluster.local
        - cluster.local
      dnsPolicy: None
      imagePullSecrets:
      - name: harbor-registry-pull
      securityContext:
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 101
        runAsNonRoot: true
        runAsUser: 100
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: tenant-api
      terminationGracePeriodSeconds: 75
      tolerations:
      - operator: Exists
      volumes:
      - name: runtime-state
        persistentVolumeClaim:
          claimName: tenant-platform-state
      - configMap:
          name: tenant-platform-modules
        name: platform-modules

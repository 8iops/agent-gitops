apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    ai.connectool.io/mcp-backend: 'true'
    re8ch.com/publication-stage: release-gated
  name: tenant-api
  namespace: tenant-infrastructure
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tenant-api
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        ai.connectool.io/mcp-backend: 'true'
        app: tenant-api
        saas.re8ch.com/tenant: platform
        tenant-runtime: 'true'
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - r640
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: admin-api
            topologyKey: kubernetes.io/hostname
      automountServiceAccountToken: true
      containers:
      - env:
        - name: RE8CH_TOOL_PROFILE
          value: tenant
        - name: RE8CH_TOOL_AUDIENCE
          value: re8ch-tenant
        - name: MCP_CATALOG_INTERNAL_TOKEN
          valueFrom:
            secretKeyRef:
              key: TENANT_CLAIM_SERVICE_TOKEN
              name: tenant-claim-internal-auth
        - name: SERVICE_API_TOKEN
          valueFrom:
            secretKeyRef:
              key: token
              name: admin-vmcp-backend-auth
        - name: ALLOW_AUTHENTICATED_DEX
          value: 'true'
        - name: LISTEN_PORT
          value: '19448'
        - name: PUBLIC_MCP_URL
          value: https://tools.service.re8ch.com/tenant-native/mcp
        - name: OPENAI_APPS_CHALLENGE_TOKEN
          value: 6n3O48vy3O89euYVrri4aHJMeUJ_vkofxLpzxv-6TTE
        - name: PUBLIC_ORIGIN
          value: https://tools.service.re8ch.com
        - name: PUBLIC_RESOURCE_METADATA_URL
          value: https://tools.service.re8ch.com/.well-known/oauth-protected-resource/tenant-native/mcp
        - name: TENANT_CONTROL_URL
          value: http://tenant-control-controller.tenant-infrastructure.svc
        - name: AUTH_DISCOVERY_URL
          value: http://supabase-identity-auth.supabase-identity.svc:9999/.well-known/oauth-authorization-server
        - name: DEX_USERINFO_URL
          value: https://api.re8ch.com/auth/userinfo
        - name: SUPABASE_USER_URL
          value: http://supabase-identity-auth.supabase-identity.svc:9999/user
        - name: HARBOR_SUPPLY_CHAIN_URL
          value: http://harbor-supply-chain.tenant-infrastructure.svc
        - name: HARBOR_SUPPLY_CHAIN_REQUIRED
          value: 'false'
        - name: TENANT_SERVICE_DB
          value: /var/lib/tenant-platform/tenant-services.db
        - name: TENANT_USAGE_CLIENT
          value: system:serviceaccount:observability-ai:birfucate-metering
        - name: DEVICE_REGISTRY_PATH
          value: /var/lib/tenant-platform/tenant-devices.db
        - name: PLATFORM_USERS_URL
          value: https://api.re8ch.com/auth/v2/users
        - name: PLATFORM_ORGANIZATIONS_URL
          value: https://api.re8ch.com/auth/v2/organizations
        - name: COLLABORATION_ENABLED
          value: 'true'
        - name: COLLABORATION_CREDENTIAL_NAMESPACE
          value: stalwart-credentials
        - name: STALWART_URL
          value: https://id.re8ch.com
        - name: STALWART_CONNECT_URL
          value: http://stalwart.mail-system.svc.cluster.local:8080
        - name: STALWART_CLIENT_ID
          value: stalwart-webui
        - name: COLLABORATION_AUTH_MODE
          value: auth-hub-pkce
        - name: STALWART_AUTHORIZATION_URL
          value: https://auth.re8ch.com/authorize
        - name: STALWART_TOKEN_URL
          value: https://auth.re8ch.com/token
        - name: STALWART_REDIRECT_URI
          value: https://tools.service.re8ch.com/collaboration/oauth/callback
        - name: PLATFORM_MODULE_REGISTRY
          value: /etc/re8ch/modules/modules.json
        - name: DYNAMIC_SKILL_DB
          value: /var/lib/tenant-platform/dynamic-skills.db
        - name: DYNAMIC_SKILL_ADMIN_TOKEN
          valueFrom:
            secretKeyRef:
              key: token
              name: admin-vmcp-backend-auth
        - name: ADMIN_LISTEN_PORT
          value: '19450'
        envFrom:
        - secretRef:
            name: tenant-claim-internal-auth
            optional: false
        - secretRef:
            name: tenant-registry-supply-chain
            optional: true
        - secretRef:
            name: tenant-grafana-credentials
            optional: true
        image: ghcr.io/re8ch/service-backend-tenant-mcp@sha256:021142eb93122c0b1210a76406ee8daedd479ecc16cfb8100ff317e0e530e854
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /livez
            port: http
          periodSeconds: 15
          timeoutSeconds: 3
        name: runtime
        ports:
        - containerPort: 19448
          name: http
        - containerPort: 19450
          name: skill-admin
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 5
          timeoutSeconds: 10
        resources:
          limits:
            cpu: '1'
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /livez
            port: http
          periodSeconds: 2
          timeoutSeconds: 3
        volumeMounts:
        - mountPath: /var/lib/tenant-platform
          name: runtime-state
        - mountPath: /etc/re8ch/modules
          name: platform-modules
          readOnly: true
      - env:
        - name: TENANT_CORE_URL
          value: http://127.0.0.1:19448
        - name: LISTEN_ADDR
          value: :19449
        image: ghcr.io/among-clusters/connectool-catalog-gateway@sha256:c433add3e20b71d9e328bd7dc6b25dda491e1f7b25c551799ae1dfaf8057093f
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /livez
            port: catalog-mcp
          periodSeconds: 15
          timeoutSeconds: 3
        name: catalog-gateway
        ports:
        - containerPort: 19449
          name: catalog-mcp
        readinessProbe:
          httpGet:
            path: /livez
            port: catalog-mcp
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 250m
            memory: 128Mi
          requests:
            cpu: 25m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      dnsConfig:
        nameservers:
        - 10.43.0.53
        options:
        - name: ndots
          value: '5'
        searches:
        - observability-ai.svc.cluster.local
        - tenant-infrastructure.svc.cluster.local
        - svc.cluster.local
        - cluster.local
      dnsPolicy: None
      imagePullSecrets:
      - name: harbor-registry-pull
      securityContext:
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 101
        runAsNonRoot: true
        runAsUser: 100
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: tenant-api
      terminationGracePeriodSeconds: 75
      tolerations:
      - operator: Exists
      volumes:
      - name: runtime-state
        persistentVolumeClaim:
          claimName: tenant-platform-state
      - configMap:
          name: tenant-platform-modules
        name: platform-modules

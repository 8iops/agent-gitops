apiVersion: v1
kind: ConfigMap
metadata:
  name: stalwart-userhub-oauth-plan-v1
  namespace: mail-system
data:
  plan.ndjson: |
    {"@type":"upsert","object":"Directory","matchOn":["description"],"value":{"re8ch-enterprise-sso":{"@type":"Oidc","description":"RE8CH Enterprise SSO broker","issuerUrl":"https://auth.re8ch.com","acceptedAudiences":{"stalwart-webui":true},"claimUsername":"email","claimName":"name","claimGroups":"groups"}}}
    {"@type":"update","object":"Authentication","value":{"directoryId":"#re8ch-enterprise-sso"}}

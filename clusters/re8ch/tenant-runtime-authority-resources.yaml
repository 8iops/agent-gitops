apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tenant-billing-auth-center
  namespace: tenant-infrastructure
spec:
  parentRefs:
  - name: re8ch-gateway-canary
    namespace: kube-system
    sectionName: api-https
  - name: re8ch-region-loudi
    namespace: kube-system
    sectionName: api-https
  - name: re8ch-region-guangzhou
    namespace: kube-system
    sectionName: api-https
  - name: re8ch-region-shanghai
    namespace: kube-system
    sectionName: api-https
  - name: re8ch-region-hangzhou-nuclio
    namespace: kube-system
    sectionName: api-https
  - name: re8ch-region-shanghai-nuclio
    namespace: kube-system
    sectionName: api-https
  hostnames:
  - api.re8ch.com
  rules:
  - matches:
    - path:
        type: Exact
        value: /tenant-native/billing/usage
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplaceFullPath
          replaceFullPath: /billing/usage
    backendRefs:
    - name: tenant-api
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tenant-billing-read
  namespace: tenant-infrastructure
spec:
  parentRefs:
  - name: re8ch-gateway-canary
    namespace: kube-system
    sectionName: service-wildcard-https
  hostnames:
  - tools.service.re8ch.com
  rules:
  - matches:
    - path:
        type: Exact
        value: /tenant-native/billing/usage
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplaceFullPath
          replaceFullPath: /billing/usage
    backendRefs:
    - name: tenant-api
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tenant-credential-redemption
  namespace: tenant-infrastructure
spec:
  parentRefs:
  - name: re8ch-gateway-canary
    namespace: kube-system
    sectionName: service-wildcard-https
  hostnames:
  - tools.service.re8ch.com
  rules:
  - matches:
    - path:
        type: Exact
        value: /credentials/redeem
    backendRefs:
    - name: tenant-api
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tenant-native-mcp
  namespace: tenant-infrastructure
spec:
  parentRefs:
  - name: re8ch-gateway-canary
    namespace: kube-system
    sectionName: service-wildcard-https
  hostnames:
  - tools.service.re8ch.com
  rules:
  - matches:
    - path:
        type: Exact
        value: /.well-known/openai-apps-challenge
    backendRefs:
    - name: tenant-api
      port: 80
  - matches:
    - path:
        type: Exact
        value: /tenant-native/mcp
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplaceFullPath
          replaceFullPath: /mcp
    backendRefs:
    - name: tenant-api
      port: 19449
  - matches:
    - path:
        type: Exact
        value: /tenant-self-service/mcp
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplaceFullPath
          replaceFullPath: /self-service/mcp
    backendRefs:
    - name: tenant-api
      port: 80
  - matches:
    - path:
        type: Exact
        value: /collaboration/oauth/callback
    backendRefs:
    - name: tenant-api
      port: 80
  - matches:
    - path:
        type: Exact
        value: /.well-known/oauth-protected-resource/tenant-native/mcp
    backendRefs:
    - name: tenant-api
      port: 80
  - matches:
    - path:
        type: Exact
        value: /.well-known/oauth-protected-resource/tenant-self-service/mcp
    backendRefs:
    - name: tenant-api
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1

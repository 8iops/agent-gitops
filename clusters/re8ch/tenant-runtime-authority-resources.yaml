apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: admin-api
  namespace: tenant-infrastructure
spec:
  podSelector:
    matchLabels:
      app: admin-api
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: toolhive-system
      podSelector:
        matchLabels:
          app: virtualmcpserver
          toolhive-name: re8ch-admin-vmcp
    - podSelector:
        matchLabels:
          app: tenant-api
    ports:
    - protocol: TCP
      port: 19449

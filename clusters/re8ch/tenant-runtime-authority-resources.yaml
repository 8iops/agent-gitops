---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: tenant-runtime-image-cache
  namespace: tenant-infrastructure
spec:
  selector:
    matchLabels:
      app: tenant-runtime-image-cache
  template:
    metadata:
      labels:
        app: tenant-runtime-image-cache
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - r640
      imagePullSecrets:
      - name: harbor-registry-pull
      automountServiceAccountToken: false
      initContainers:
      - name: pull
        image: registry.re8ch.com/image/re8ch-ai-operations@sha256:f751479965f23bbb102e6637cfefd2791004c962c15acb928dcd6d42949967d8
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - 'true'
      containers:
      - name: hold
        image: registry.k8s.io/pause@sha256:278fb9dbcca9518083ad1e11276933a2e96f23de604a3a08cc3c80002767d24c
        resources:
          requests:
            cpu: 1m
            memory: 2Mi
          limits:
            cpu: 5m
            memory: 8Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-api
  namespace: tenant-infrastructure
  labels:
    re8ch.com/publication-stage: release-gated
    ai.connectool.io/mcp-backend: 'true'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: admin-api
  template:
    metadata:
      labels:
        app: admin-api
        tenant-runtime: 'true'
        saas.re8ch.com/tenant: platform
        ai.connectool.io/mcp-backend: 'true'
    spec:
      serviceAccountName: admin-api
      automountServiceAccountToken: false
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - 10.43.0.53
        searches:
        - observability-ai.svc.cluster.local
        - tenant-infrastructure.svc.cluster.local
        - svc.cluster.local
        - cluster.local
        options:
        - name: ndots
          value: '5'
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - r640
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: tenant-api
              topologyKey: kubernetes.io/hostname
      tolerations:
      - operator: Exists
      imagePullSecrets:
      - name: harbor-registry-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: runtime
        image: registry.re8ch.com/image/re8ch-ai-operations@sha256:f751479965f23bbb102e6637cfefd2791004c962c15acb928dcd6d42949967d8
        imagePullPolicy: IfNotPresent
        env:
        - name: RE8CH_TOOL_PROFILE
          value: admin
        - name: RE8CH_TOOL_AUDIENCE
          value: re8ch-platform-admin
        - name: SERVICE_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: admin-vmcp-backend-auth
              key: token
        - name: LISTEN_PORT
          value: '19449'
        - name: PUBLIC_MCP_URL
          value: https://admin.re8ch.com:8443/mcp
        - name: PUBLIC_RESOURCE_METADATA_URL
          value: https://admin.re8ch.com:8443/.well-known/oauth-protected-resource/mcp
        - name: TENANT_CONTROL_URL
          value: http://tenant-control-controller.tenant-infrastructure.svc
        - name: AUTH_DISCOVERY_URL
          value: http://re8ch-auth-gateway.auth.svc:8080/auth/.well-known/openid-configuration
        - name: DEX_USERINFO_URL
          value: https://api.re8ch.com/auth/userinfo
        - name: TENANT_SERVICE_DB
          value: /var/lib/tenant-platform/tenant-services.db
        - name: DEVICE_REGISTRY_PATH
          value: /var/lib/tenant-platform/admin-devices.db
        - name: DYNAMIC_SKILL_ADMIN_URL
          value: http://tenant-api.tenant-infrastructure.svc:19450/internal/dynamic-skills
        envFrom:
        - secretRef:
            name: tenant-claim-internal-auth
            optional: false
        ports:
        - name: http
          containerPort: 19449
        startupProbe:
          httpGet:
            path: /livez
            port: http
          failureThreshold: 30
          periodSeconds: 2
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          failureThreshold: 3
          periodSeconds: 5
          timeoutSeconds: 10
        livenessProbe:
          httpGet:
            path: /livez
            port: http
          failureThreshold: 3
          periodSeconds: 15
          timeoutSeconds: 3
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: runtime-state
          mountPath: /var/lib/tenant-platform
      volumes:
      - name: runtime-state
        persistentVolumeClaim:
          claimName: tenant-platform-state
---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tenant-platform-state
  namespace: tenant-infrastructure
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: rbd-r640
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: admin-api
  namespace: tenant-infrastructure
spec:
  selector:
    app: admin-api
  ports:
  - name: http
    port: 80
    targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: tenant-api
  namespace: tenant-infrastructure
  labels:
    re8ch.com/metrics-surface: tenant-mcp
spec:
  selector:
    app: tenant-api
  ports:
  - name: http
    port: 80
    targetPort: http
  - name: skill-admin
    port: 19450
    targetPort: skill-admin
  - name: catalog-mcp
    port: 19449
    targetPort: catalog-mcp
---
apiVersion: v1
kind: Service
metadata:
  name: tenant-control-controller
  namespace: tenant-infrastructure
spec:
  trafficDistribution: PreferSameNode
  selector:
    app: tenant-control-controller
  ports:
  - name: http
    port: 80
    targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: tenant-infrastructure
  namespace: tenant-infrastructure
spec:
  selector:
    app: tenant-api
  ports:
  - name: http
    port: 80
    targetPort: http
---
apiVersion: v1

apiVersion: batch/v1
kind: CronJob
metadata:
  name: stalwart-mailbox-provisioner
  namespace: mail-system
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: provision
            command:
            - /bin/sh
            - -ceu
            args:
            - |
              recovery="${STALWART_RECOVERY_ADMIN}"
              export STALWART_USER="${recovery%%:*}"
              export STALWART_PASSWORD="${recovery#*:}"
              /cli/usr/local/bin/stalwart-cli apply --stdin --json < /plans/plan.ndjson
              unset STALWART_USER STALWART_PASSWORD recovery
              exec python3 /app/provision.py
            volumeMounts:
            - mountPath: /plans
              name: oidc-plan
              readOnly: true
          volumes:
          - configMap:
              name: stalwart-userhub-oauth-plan-v1
            name: oidc-plan

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- resources.yaml
- mail-authority-resources.yaml
- litellm-authority-resources.yaml
- cube-recovery-resources.yaml
- compocv-cube-test.yaml
patches:
- path: webmail-session-patch.yaml
- path: stalwart-client-discovery-patch.yaml
- path: stalwart-v01627-production-patch.yaml
- path: stalwart-v1-config-patch.yaml
- path: stalwart-unified-identity-trust-patch.yaml
- path: stalwart-userhub-trust-patch.yaml
- target:
    group: gateway.networking.k8s.io
    version: v1
    kind: HTTPRoute
    name: stalwart-idp-public
    namespace: mail-system
  path: stalwart-device-route-patch.yaml

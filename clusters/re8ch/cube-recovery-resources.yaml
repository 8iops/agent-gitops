            command:
            - /bin/sh
            - -ec
            - 'printf ''header = "X-Cube-Admin-Token: %s"\n'' "${CUBE_PROXY_ADMIN_TOKEN}"
              | curl -fsS --config - http://127.0.0.1:8082/admin/healthz >/dev/null'
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 6
        volumeMounts:
        - name: proxy-certs
          mountPath: /usr/local/openresty/nginx/certs
          readOnly: true
        - name: proxy-logs
          mountPath: /data/log/cube-proxy
        - name: entrypoint
          mountPath: /etc/cube-proxy
          readOnly: true
        resources:
          limits:
            cpu: 1
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 64Mi
      volumes:
      - name: proxy-certs
        secret:
          secretName: cube-recovery-proxy-certs
          items:
          - key: tls.crt
            path: cube.app+3.pem
          - key: tls.key
            path: cube.app+3-key.pem
      - name: proxy-logs
        hostPath:
          path: /data/log/cube-proxy
          type: DirectoryOrCreate
      - name: entrypoint

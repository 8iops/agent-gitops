apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cube-recovery-node-bootstrap
  labels:
    helm.sh/chart: cube-0.5.1
    app.kubernetes.io/name: cube
    app.kubernetes.io/instance: cube-recovery
    app.kubernetes.io/version: 0.5.1
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: cube-node-bootstrap
  namespace: cube-trial
spec:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cube
      app.kubernetes.io/instance: cube-recovery
      app.kubernetes.io/component: cube-node-bootstrap
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cube
        app.kubernetes.io/instance: cube-recovery
        app.kubernetes.io/component: cube-node-bootstrap
      annotations: null
    spec:
      serviceAccountName: cube-recovery-node
      automountServiceAccountToken: true
      hostPID: true
      dnsPolicy: ClusterFirst
      terminationGracePeriodSeconds: 30
      nodeSelector:
        kubernetes.io/hostname: r640
      initContainers:
      - name: invalidate-stale-node-prep
        image: cube-sandbox-int.tencentcloudcr.com/cube-sandbox/cube-node-init:v0.6.0@sha256:3e8f2fbf24bbb3446d537c28aab5a31de925574981198b3667097aa5cad20c3b
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -ec
        args:
        - ". /scripts/node-prep-lib.sh\nready=\"$(node_prep_ready_path)\"\n[ -f \"\
          $ready\" ] || exit 0\nold_generation=\"$(sed -n 's/^prep_generation=//p'\
          \ \"$ready\")\"\nold_node_init=\"$(sed -n 's/^node_init_enabled=//p' \"\
          $ready\")\"\nif [ \"$old_generation\" != \"$PREP_GENERATION\" ] || [ \"\
          $old_node_init\" != \"$NODE_INIT_ENABLED\" ]; then\n  invalidate_node_prep_ready\n\
          fi\n"
        env:
        - name: STATE_DIR
          value: /var/lib/cube-recovery-bootstrap
        - name: PREP_GENERATION
          value: '1'
        - name: NODE_INIT_ENABLED
          value: '1'
        volumeMounts:
        - name: bootstrap-state
          mountPath: /var/lib/cube-recovery-bootstrap
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: '2'
            memory: 2Gi
      - name: wait-pvm-host
        image: cube-sandbox-int.tencentcloudcr.com/cube-sandbox/cube-node-init:v0.6.0@sha256:3e8f2fbf24bbb3446d537c28aab5a31de925574981198b3667097aa5cad20c3b
        imagePullPolicy: IfNotPresent
        command:
        - /usr/bin/tini
        - -s
        - --
        - /scripts/wait-pvm-host.sh
        securityContext:
          privileged: true
        env:
        - name: TZ
          value: Asia/Shanghai
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: HOST_ROOT
          value: /host
        - name: STATE_DIR
          value: /var/lib/cube-recovery-bootstrap
        - name: PVM_FEATURE_ENABLED
          value: '0'
        - name: CUBE_PVM_ENABLE
          value: '0'
        - name: ALLOW_PVM_LABEL
          value: cube.tencent.com/allow-pvm-bootstrap
        - name: DESIRED_KERNEL_PATTERN
          value: pvm.host
        - name: KERNEL_BOOT_ARGS
          value: nopti pti=off
        - name: WAIT_TIMEOUT_SECONDS
          value: '900'
        volumeMounts:
        - name: host-root
          mountPath: /host
        - name: dev
          mountPath: /dev
        - name: sys
          mountPath: /sys
        - name: lib-modules
          mountPath: /lib/modules
          readOnly: true
        - name: bootstrap-state
          mountPath: /var/lib/cube-recovery-bootstrap
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: '2'
            memory: 2Gi
      - name: cube-node-init
        image: cube-sandbox-int.tencentcloudcr.com/cube-sandbox/cube-node-init:v0.6.0@sha256:3e8f2fbf24bbb3446d537c28aab5a31de925574981198b3667097aa5cad20c3b
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
        env:
        - name: TZ
          value: Asia/Shanghai
        - name: HOST_ROOT
          value: /host
        - name: STATE_DIR
          value: /var/lib/cube-recovery-bootstrap
        - name: NODE_INIT_ENABLED
          value: '1'
        - name: PVM_ENABLED
          value: '0'
        - name: SKIP_IF_NODE_PREP_READY
          value: 'true'
        - name: DATA_CUBELET
          value: /data/cube-recovery/cubelet
        - name: REQUIRE_KVM
          value: 'true'
        - name: REQUIRE_XFS
          value: 'true'
        - name: CHMOD_KVM
          value: 'false'
        - name: LOAD_KVM_MODULE
          value: 'false'
        - name: WRITE_UDEV_RULE
          value: 'false'
        - name: CREATE_HOST_DIRS
          value: 'false'
        - name: CHECK_MASTER_CONNECTIVITY
          value: 'true'
        - name: CUBE_MASTER_ENDPOINT
          value: cube-recovery-master.cube-trial.svc.cluster.local:8089
        - name: LOOPBACK_ENABLED

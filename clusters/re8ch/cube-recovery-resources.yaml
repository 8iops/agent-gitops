apiVersion: v1
kind: ConfigMap
metadata:
  name: cube-recovery-cubevs-cidr-preflight
  labels:
    helm.sh/chart: cube-0.5.1
    app.kubernetes.io/name: cube
    app.kubernetes.io/instance: cube-recovery
    app.kubernetes.io/version: 0.5.1
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: cubevs-cidr-preflight
  annotations: {}
  namespace: cube-trial
data:
  cubevs-cidr-preflight.sh: "#!/bin/bash\n# Helm pre-install/pre-upgrade: fail if\
    \ cubevs/sandbox CIDR overlaps cluster Service CIDR.\n# Overlap blackholes ClusterDNS\
    \ from cube-node (cube-dev route), so cubelet cannot\n# resolve cube-master and\
    \ node registration fails.\nif [[ \"${CUBEVS_CIDR_PREFLIGHT_SOURCE_ONLY:-0}\"\
    \ != \"1\" ]]; then\n  set -euo pipefail\nfi\n\n# alpine/k8s kubectl does not\
    \ auto-load in-cluster config.\nif [[ -f /var/run/secrets/kubernetes.io/serviceaccount/token\
    \ ]]; then\numask 077\ncat > /tmp/cube-preflight-kubeconfig <<EOF\napiVersion:\
    \ v1\nkind: Config\nclusters:\n- name: in-cluster\n  cluster:\n    server: https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}\n\
    \    certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt\n\
    users:\n- name: preflight\n  user:\n    tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token\n\
    contexts:\n- name: preflight\n  context: {cluster: in-cluster, user: preflight}\n\
    current-context: preflight\nEOF\n  kubectl() {\n    command kubectl \\\n     \
    \ --server=\"https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}\" \\\
    \n      --kubeconfig=/tmp/cube-preflight-kubeconfig \\\n      --certificate-authority=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt\
    \ \\\n      \"$@\"\n  }\nfi\n\nkubectl_opts=(--request-timeout=30s)\n\nlog() {\
    \ printf 'cubevs-cidr preflight: %s\\n' \"$*\"; }\nfail() {\n  printf 'cubevs-cidr\
    \ preflight: ERROR: %s\\n' \"$*\" >&2\n  exit 1\n}\n\nPACKAGED_CUBELET_CIDR=\"\
    ${PACKAGED_CUBELET_CIDR:-192.168.0.0/18}\"\nSKIP_CONFLICT_CHECK=\"${CUBE_SANDBOX_NETWORK_CIDR_SKIP_CONFLICT_CHECK:-0}\"\
    \n\nip_to_int() {\n  local ip=\"$1\"\n  local a b c d\n  IFS=. read -r a b c d\
    \ <<< \"${ip}\"\n  # Reject truncated/extra-field inputs (e.g. \"1.2.3\") that\
    \ would otherwise\n  # treat empty octets as 0 in arithmetic.\n  [ -n \"$a\" ]\
    \ && [ -n \"$b\" ] && [ -n \"$c\" ] && [ -n \"$d\" ] || return 1\n  case \"${a}${b}${c}${d}\"\
    \ in\n    ''|*[!0-9]*) return 1 ;;\n  esac\n  [ \"$a\" -le 255 ] && [ \"$b\" -le\
    \ 255 ] && [ \"$c\" -le 255 ] && [ \"$d\" -le 255 ] || return 1\n  echo $((a *\
    \ 16777216 + b * 65536 + c * 256 + d))\n}\n\nint_to_ip() {\n  local n=\"$1\"\n\
    \  echo \"$((n >> 24 & 255)).$((n >> 16 & 255)).$((n >> 8 & 255)).$((n & 255))\"\
    \n}\n\ncidr_range() {\n  local cidr=\"$1\"\n  local ip=\"${cidr%/*}\"\n  local\
    \ mask=\"${cidr#*/}\"\n  [ \"$ip\" != \"$cidr\" ] || return 1\n  case \"$mask\"\
    \ in\n    ''|*[!0-9]*) return 1 ;;\n  esac\n  [ \"$mask\" -ge 0 ] && [ \"$mask\"\
    \ -le 32 ] || return 1\n  local ip_int host_bits block_size start end\n  ip_int=\"\
    $(ip_to_int \"$ip\")\" || return 1\n  host_bits=$((32 - mask))\n  if [ \"$host_bits\"\
    \ -eq 32 ]; then\n    block_size=4294967296\n  else\n    block_size=$((1 << host_bits))\n\
    \  fi\n  start=$((ip_int / block_size * block_size))\n  end=$((start + block_size\
    \ - 1))\n  printf '%s %s\\n' \"$start\" \"$end\"\n}\n\ncidr_overlaps() {\n  local\
    \ a=\"$1\" b=\"$2\"\n  local a_range b_range a_start a_end b_start b_end\n  a_range=\"\
    $(cidr_range \"$a\")\" || return 1\n  b_range=\"$(cidr_range \"$b\")\" || return\
    \ 1\n  # shellcheck disable=SC2086\n  set -- $a_range $b_range\n  a_start=\"$1\"\
    \n  a_end=\"$2\"\n  b_start=\"$3\"\n  b_end=\"$4\"\n  [ \"$a_start\" -le \"$b_end\"\
    \ ] && [ \"$b_start\" -le \"$a_end\" ]\n}\n\nip_in_cidr() {\n  local ip=\"$1\"\
    \ cidr=\"$2\"\n  cidr_overlaps \"${ip}/32\" \"$cidr\"\n}\n\nvalidate_cidr() {\n\
    \  local cidr=\"$1\"\n  local ip=\"${cidr%/*}\"\n  local mask=\"${cidr#*/}\"\n\
    \  [ \"$ip\" != \"$cidr\" ] || fail \"cubeNode.network.cidr must be IPv4 CIDR,\
    \ got ${cidr}\"\n  case \"$mask\" in\n    ''|*[!0-9]*) fail \"invalid CIDR mask:\
    \ ${cidr}\" ;;\n  esac\n  [ \"$mask\" -ge 8 ] && [ \"$mask\" -le 30 ] || fail\
    \ \"CIDR mask must be between 8 and 30: ${cidr}\"\n  local ip_int host_bits block_size\
    \ aligned\n  ip_int=\"$(ip_to_int \"$ip\")\" || fail \"invalid CIDR IP: ${cidr}\"\
    \n  host_bits=$((32 - mask))\n  block_size=$((1 << host_bits))\n  aligned=$((ip_int\
    \ / block_size * block_size))\n  if [ \"$ip_int\" -ne \"$aligned\" ]; then\n \
    \   fail \"CIDR is not aligned to network address: ${cidr}; did you mean $(int_to_ip\
    \ \"$aligned\")/${mask}\"\n  fi\n}\n\neffective_sandbox_cidr() {\n  local cidr=\"\
    ${CUBE_SANDBOX_NETWORK_CIDR:-}\"\n  if [ -n \"$cidr\" ]; then\n    printf '%s\\\
    n' \"$cidr\"\n    return 0\n  fi\n  log \"cubeNode.network.cidr is empty; using\
    \ packaged Cubelet CIDR ${PACKAGED_CUBELET_CIDR}\"\n  printf '%s\\n' \"$PACKAGED_CUBELET_CIDR\"\
    \n}\n\n# Print discovered Service CIDR candidates (one per line). May be empty.\n\
    discover_service_cidrs() {\n  local found=\"\" subnet line cmd\n\n  # kubeadm\
    \ ClusterConfiguration\n  if subnet=\"$(kubectl \"${kubectl_opts[@]}\" -n kube-system\
    \ get configmap kubeadm-config \\\n    -o jsonpath='{.data.ClusterConfiguration}'\
    \ 2>/dev/null || true)\" \\\n    && [ -n \"$subnet\" ]; then\n    subnet=\"$(printf\
    \ '%s\\n' \"$subnet\" | awk '\n      $1 == \"serviceSubnet:\" { print $2; exit\
    \ }\n      $1 == \"serviceSubnet:\" || $1 ~ /^serviceSubnet:/ {\n        sub(/^serviceSubnet:[[:space:]]*/,\
    \ \"\", $0); print $0; exit\n      }\n    ')\"\n    if [ -n \"$subnet\" ]; then\n\
    \      printf '%s\\n' \"$subnet\"\n      found=1\n    fi\n  fi\n\n  # kube-apiserver\
    \ --service-cluster-ip-range (static pods / control-plane pods)\n  while IFS=\
    \ read -r line; do\n    [ -n \"$line\" ] || continue\n    case \"$line\" in\n\
    \      --service-cluster-ip-range=*)\n        subnet=\"${line#--service-cluster-ip-range=}\"\
    \n        # May be comma-separated dual-stack; keep IPv4-looking entries.\n  \
    \      IFS=',' read -r -a parts <<< \"$subnet\"\n        for subnet in \"${parts[@]}\"\
    ; do\n          case \"$subnet\" in\n            *:* ) continue ;;\n         \
    \   */*)\n              printf '%s\\n' \"$subnet\"\n              found=1\n  \
    \            ;;\n          esac\n        done\n        ;;\n    esac\n  done <\
    \ <(\n    kubectl \"${kubectl_opts[@]}\" -n kube-system get pods \\\n      -l\
    \ component=kube-apiserver \\\n      -o jsonpath='{range .items[*].spec.containers[*].command[*]}{.}{\"\
    \\n\"}{end}{range .items[*].spec.containers[*].args[*]}{.}{\"\\n\"}{end}' \\\n\
    \      2>/dev/null || true\n  )\n\n  # Some managed clusters expose the range\
    \ on kube-proxy ConfigMap as a comment\n  # or field; prefer explicit keys when\
    \ present.\n  if cmd=\"$(kubectl \"${kubectl_opts[@]}\" -n kube-system get configmap\
    \ kube-proxy \\\n    -o jsonpath='{.data.config\\.conf}' 2>/dev/null || true)\"\
    \ \\\n    && [ -n \"$cmd\" ]; then\n    subnet=\"$(printf '%s\\n' \"$cmd\" | awk\
    \ '\n      $1 == \"serviceClusterIPRange:\" || $1 ~ /^serviceClusterIPRange:/\
    \ {\n        sub(/^serviceClusterIPRange:[[:space:]]*/, \"\", $0); print $0; exit\n\
    \      }\n    ')\"\n    if [ -n \"$subnet\" ]; then\n      case \"$subnet\" in\n\
    \        *:* ) ;;\n        */*)\n          printf '%s\\n' \"$subnet\"\n      \
    \    found=1\n          ;;\n      esac\n    fi\n  fi\n\n  [ -n \"$found\" ] ||\
    \ true\n}\n\nlist_cluster_ips() {\n  kubectl \"${kubectl_opts[@]}\" get svc -A\
    \ \\\n    -o jsonpath='{range .items[?(@.spec.clusterIP!=\"None\")]}{.metadata.namespace}{\"\
    /\"}{.metadata.name}{\" \"}{.spec.clusterIP}{\"\\n\"}{end}' \\\n    2>/dev/null\
    \ || true\n}\n\nmain() {\n  if [ \"$SKIP_CONFLICT_CHECK\" = \"1\" ] || [ \"$SKIP_CONFLICT_CHECK\"\
    \ = \"true\" ]; then\n    log \"skipped (cubeNode.network.cidrSkipConflictCheck=true)\"\
    \n    exit 0\n  fi\n\n  local sandbox svc_cidr hit ns_name ip discovered=0\n \
    \ sandbox=\"$(effective_sandbox_cidr)\"\n  validate_cidr \"$sandbox\"\n  log \"\
    checking cubevs/sandbox CIDR ${sandbox} against cluster Service CIDR\"\n\n  while\
    \ IFS= read -r svc_cidr; do\n    [ -n \"$svc_cidr\" ] || continue\n    discovered=1\n\
    \    log \"discovered Service CIDR candidate: ${svc_cidr}\"\n    if cidr_overlaps\
    \ \"$sandbox\" \"$svc_cidr\"; then\n      fail \"cubevs/sandbox CIDR ${sandbox}\
    \ overlaps cluster Service CIDR ${svc_cidr}.\nThis routes ClusterDNS (and other\
    \ ClusterIPs) into cube-dev and blackholes in-cluster DNS,\nso cubelet cannot\
    \ resolve cube-master and node registration fails.\nSet cubeNode.network.cidr\
    \ to a non-overlapping private range (chart default: 172.16.0.0/18),\nor set cubeNode.network.cidrSkipConflictCheck=true\
    \ only if you accept the risk.\n\ncubevs/sandbox CIDR ${sandbox} \u4E0E\u96C6\u7FA4\
    \ Service CIDR ${svc_cidr} \u91CD\u53E0\u3002\n\u91CD\u53E0\u4F1A\u628A ClusterDNS\
    \ \u7B49 ClusterIP \u9ED1\u6D1E\u8FDB cube-dev\uFF0C\u5BFC\u81F4 cubelet \u65E0\
    \u6CD5\u89E3\u6790 cube-master\u3001\u8282\u70B9\u6CE8\u518C\u5931\u8D25\u3002\
    \n\u8BF7\u5C06 cubeNode.network.cidr \u6539\u4E3A\u4E0D\u51B2\u7A81\u7684\u79C1\
    \u7F51\u6BB5\uFF08Chart \u9ED8\u8BA4 172.16.0.0/18\uFF09\uFF1B\n\u4EC5\u5728\u660E\
    \u786E\u63A5\u53D7\u98CE\u9669\u65F6\u8BBE\u7F6E cubeNode.network.cidrSkipConflictCheck=true\u3002\
    \"\n    fi\n  done < <(discover_service_cidrs | awk 'NF && !seen[$0]++')\n\n \
    \ hit=\"\"\n  while IFS= read -r line; do\n    [ -n \"$line\" ] || continue\n\
    \    ns_name=\"${line%% *}\"\n    ip=\"${line##* }\"\n    case \"$ip\" in\n  \
    \    ''|None|null) continue ;;\n      *:* ) continue ;; # skip IPv6\n    esac\n\
    \    if ip_in_cidr \"$ip\" \"$sandbox\"; then\n      hit=\"${hit}\n- Service ${ns_name}\
    \ ClusterIP ${ip}\"\n    fi\n  done < <(list_cluster_ips)\n\n  if [ -n \"$hit\"\
    \ ]; then\n    fail \"cubevs/sandbox CIDR ${sandbox} contains existing Service\
    \ ClusterIP(s):${hit}\nThis usually means the sandbox CIDR overlaps the cluster\
    \ Service CIDR (often 192.168.0.0/16 on TKE/single-node).\nSet cubeNode.network.cidr\
    \ to a non-overlapping private range (chart default: 172.16.0.0/18).\n\ncubevs/sandbox\
    \ CIDR ${sandbox} \u8986\u76D6\u4E86\u5DF2\u6709 Service ClusterIP\uFF08\u89C1\
    \u4E0A\uFF09\u3002\n\u901A\u5E38\u8868\u793A\u6C99\u7BB1\u7F51\u6BB5\u4E0E\u96C6\
    \u7FA4 Service CIDR \u91CD\u53E0\uFF08\u5355\u8282\u70B9/TKE \u5E38\u89C1 192.168.0.0/16\uFF09\
    \u3002\n\u8BF7\u5C06 cubeNode.network.cidr \u6539\u4E3A\u4E0D\u51B2\u7A81\u7684\
    \u79C1\u7F51\u6BB5\uFF08Chart \u9ED8\u8BA4 172.16.0.0/18\uFF09\u3002\"\n  fi\n\
    \n  if [ \"$discovered\" -eq 0 ]; then\n    log \"could not read Service CIDR\
    \ from kubeadm/apiserver; ClusterIP sampling found no overlap with ${sandbox}\"\
    \n  else\n    log \"no Service CIDR overlap with ${sandbox}\"\n  fi\n  log \"\
    ok\"\n}\n\n# Allow sourcing for unit tests.\nif [[ \"${CUBEVS_CIDR_PREFLIGHT_SOURCE_ONLY:-0}\"\
    \ != \"1\" ]]; then\n  main \"$@\"\nfi\n"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cube-recovery-internal
  namespace: cube-trial
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: cube-recovery
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector: {}

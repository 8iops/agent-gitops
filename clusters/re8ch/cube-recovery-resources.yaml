apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cube-recovery-redis
  labels:
    helm.sh/chart: cube-0.5.1
    app.kubernetes.io/name: cube
    app.kubernetes.io/instance: cube-recovery
    app.kubernetes.io/version: 0.5.1
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: redis
  namespace: cube-trial
spec:
  serviceName: cube-recovery-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cube
      app.kubernetes.io/instance: cube-recovery
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cube
        app.kubernetes.io/instance: cube-recovery
        app.kubernetes.io/component: redis
    spec:
      nodeSelector:
        kubernetes.io/hostname: r640
      containers:
      - name: redis
        image: redis:7-alpine@sha256:6ba19c50b56777f5c11c58eff8ddb69d0d5f27ba131cffb63f180ccfd43c66af
        imagePullPolicy: IfNotPresent
        args:
        - /etc/redis/redis.conf
        env:
        - name: TZ
          value: Asia/Shanghai
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cube-recovery-secret
              key: redis-password
        ports:
        - name: redis
          containerPort: 6379
        startupProbe:
          exec:
            command:
            - /bin/sh
            - -ec
            - REDISCLI_AUTH="${REDIS_PASSWORD}" redis-cli ping | grep -x PONG
          initialDelaySeconds: 5
          periodSeconds: 3
          failureThreshold: 40
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -ec
            - REDISCLI_AUTH="${REDIS_PASSWORD}" redis-cli ping | grep -x PONG
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 6
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -ec
            - REDISCLI_AUTH="${REDIS_PASSWORD}" redis-cli ping | grep -x PONG
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 6
        volumeMounts:
        - name: redis-config
          mountPath: /etc/redis
          readOnly: true
        - name: redis-data
          mountPath: /data
        resources:
          limits:
            cpu: 1
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 64Mi
      volumes:
      - name: redis-config
        projected:
          sources:
          - configMap:
              name: cube-recovery-redis
          - secret:
              name: cube-recovery-secret
              items:
              - key: redis-auth.conf
                path: redis-auth.conf
  volumeClaimTemplates:
  - metadata:
      name: redis-data
      labels:
        helm.sh/chart: cube-0.5.1
        app.kubernetes.io/name: cube
        app.kubernetes.io/instance: cube-recovery
        app.kubernetes.io/version: 0.5.1
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/component: redis
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
      storageClassName: cephfs-r640

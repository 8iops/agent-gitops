  - metadata:
      name: mysql-data
      labels:
        app.kubernetes.io/name: cube
        app.kubernetes.io/instance: cube-recovery
        app.kubernetes.io/component: mysql
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 20Gi
      volumeMode: Filesystem
      storageClassName: cephfs-r640

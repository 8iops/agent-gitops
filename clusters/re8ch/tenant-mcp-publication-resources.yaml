---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tenant-mcp
  namespace: toolhive-system
spec:
  hostnames:
  - tools.re8ch.com
  parentRefs:
  - name: re8ch-gateway-canary
    namespace: kube-system
    sectionName: tools-https
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /tenant
    backendRefs:
    - name: vmcp-tenant-vmcp
      port: 4483
  - matches:
    - path:
        type: PathPrefix
        value: /.well-known/oauth-protected-resource/tenant
    backendRefs:
    - name: vmcp-tenant-vmcp
      port: 4483

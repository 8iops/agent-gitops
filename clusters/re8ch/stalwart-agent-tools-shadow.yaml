---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stalwart-agent-tools
  namespace: toolhive-system
  labels:
    app.kubernetes.io/name: stalwart-agent-tools
    app.kubernetes.io/part-of: re8ch-collaboration
automountServiceAccountToken: false
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPGroup
metadata:
  name: collaboration-user-shadow
  namespace: toolhive-system
  labels:
    re8ch.com/publication-stage: shadow
spec:
  description: Additive user-bound Stalwart parity surface; existing tenant-mcp collaboration tools remain active.
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: stalwart-agent-tools-shadow
  namespace: toolhive-system
  annotations:
    re8ch.com/source-revision: c1e86597abce52936ef0fa0b39623e6ce0cbb43d
    re8ch.com/provider-contract-sha256: 4cd7a2c024a268028acd38bee19e4e62a2d917239a5f50e5f666130a1fc27011
    re8ch.com/tool-catalog-sha256: 60920e5b8648b1d4f4ecc07dd85571fe5afc63c9a1cb5f663f2e73ac8ef2bbaf
    re8ch.com/rollback-mode: remove-shadow-preserve-tenant-mcp
  labels:
    app.kubernetes.io/name: stalwart-agent-tools
    app.kubernetes.io/part-of: re8ch-collaboration
    re8ch.com/publication-stage: shadow
    re8ch.com/risk: user-delegated-write
spec:
  audit:
    enabled: true
  backendReplicas: 1
  env:
  - name: LISTEN_ADDRESS
    value: :8088
  - name: BINDING_BROKER_URL
    value: http://tenant-service-api.tenant-infrastructure.svc.cluster.local/v1/collaboration/resolve
  - name: BINDING_BROKER_TOKEN_FILE
    value: /var/run/secrets/tokens/stalwart-binding-broker
  groupRef:
    name: collaboration-user-shadow
  image: ghcr.io/8iops/stalwart-agent-tools@sha256:1db35ce72d2569a63d6dea7d7778061795ce6a83c4ee29da6a0d0888c8e01f60
  mcpPort: 8088
  podTemplateSpec:
    metadata:
      labels:
        app.kubernetes.io/name: stalwart-agent-tools
        app.kubernetes.io/part-of: re8ch-collaboration
        re8ch.com/publication-stage: shadow
    spec:
      automountServiceAccountToken: false
      containers:
      - name: mcp
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8088
          failureThreshold: 3
          periodSeconds: 5
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8088
          failureThreshold: 3
          periodSeconds: 15
          timeoutSeconds: 3
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: broker-token
          mountPath: /var/run/secrets/tokens
          readOnly: true
      volumes:
      - name: broker-token
        projected:
          defaultMode: 420
          sources:
          - serviceAccountToken:
              audience: stalwart-binding-broker
              expirationSeconds: 600
              path: stalwart-binding-broker
  proxyPort: 8080
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  serviceAccount: stalwart-agent-tools
  sessionAffinity: ClientIP
  sessionStorage:
    provider: memory
  transport: streamable-http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: stalwart-agent-tools-shadow
  namespace: toolhive-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: stalwart-agent-tools
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: tenant-infrastructure
      podSelector:
        matchLabels:
          app: tenant-service-api
    ports:
    - protocol: TCP
      port: 8088
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: tenant-infrastructure
      podSelector:
        matchLabels:
          app: tenant-service-api
    ports:
    - protocol: TCP
      port: 19448
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - ports:
    - protocol: TCP
      port: 443

- apiGroups: [apps]
  resources: [deployments]
  verbs: [create]
- apiGroups: [cilium.io]
  resources: [ciliumnetworkpolicies]
  verbs: [create]
- apiGroups: [gateway.networking.k8s.io]
  resources: [httproutes]
  verbs: [create]
- apiGroups: [networking.k8s.io]
  resources: [ingresses, networkpolicies]
  verbs: [create]
- apiGroups: [policy]

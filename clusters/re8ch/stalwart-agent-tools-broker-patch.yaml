apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenant-service-api
  namespace: tenant-infrastructure
spec:
  template:
    spec:
      containers:
      - name: runtime
        env:
        - name: STALWART_TOOL_CLIENT
          value: system:serviceaccount:toolhive-system:stalwart-agent-tools
        - name: STALWART_TOOL_REF
          value: tool://8iops/stalwart-agent-tools
        - name: STALWART_TOOL_OWNER_ORG_REF
          value: publisher
        - name: STALWART_TOOL_AUDIENCE
          value: re8ch-tenant-tool

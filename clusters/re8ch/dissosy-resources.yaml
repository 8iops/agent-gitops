apiVersion: v1
kind: ConfigMap
metadata:
  name: dissosy-runner
  namespace: ai-operations
  labels:
    app.kubernetes.io/part-of: dissosy
data:
  runner.py: |
    #!/usr/bin/env python3
    """Dissosy in-cluster persona runner (stdlib only).

    One run = one persona. Reads the persona playbooks from the private state repo,
    drives a tool-use loop against the in-cluster LiteLLM Model Gateway, and always
    appends a heartbeat itself so a stopped or confused model is still visible.

    Credentials come only from the pod environment: a per-persona LiteLLM virtual
    key and a GitHub token scoped to the state repo. No vendor keys live here.
    """
    import base64
    import json
    import os
    import sys
    import time
    import urllib.error
    import urllib.parse
    import urllib.request

    PERSONA = os.environ.get('DISSOSY_PERSONA', 'ops-analyst')
    STATE_REPO = os.environ.get('DISSOSY_STATE_REPO', 'pillars-infra/product-prd')
    PLAYBOOK_REFS = os.environ.get('DISSOSY_PLAYBOOK_REFS', 'main,claude/project-thread-76qte8').split(',')
    LLM_BASE = os.environ.get('LITELLM_BASE_URL', 'http://litellm.llm-gateway.svc.cluster.local:4000/v1').rstrip('/')
    LLM_MODEL = os.environ.get('LITELLM_MODEL', 'deepseek-v4-flash')
    MAX_STEPS = int(os.environ.get('DISSOSY_MAX_STEPS', '30'))
    DRY_RUN = os.environ.get('DISSOSY_DRY_RUN', '') == '1'

    # Hosts a persona may read. Writes go only through the GitHub tool below.
    READ_HOSTS = {
        're8ch.com', 'www.re8ch.com', 'api.github.com', 'hn.algolia.com',
        'www.v2ex.com', 'qiita.com', 'zenn.dev',
    }
    # GitHub write scope: issues (and their comments/labels) in the state repo only.
    WRITE_PREFIXES = (f'/repos/{STATE_REPO}/issues', f'/repos/{STATE_REPO}/labels')
    READ_PREFIXES = ('/repos/', '/search/')
    MAX_BODY = 20000


    class ToolError(Exception):
        pass


    def check_read_url(url):
        parts = urllib.parse.urlsplit(url)
        if parts.scheme != 'https' or parts.hostname not in READ_HOSTS:
            raise ToolError(f'host not allowed: {parts.hostname} (allowed: {sorted(READ_HOSTS)})')
        return url


    def check_github(method, path):
        method = method.upper()
        if not path.startswith('/') or '..' in path:
            raise ToolError('path must be an absolute GitHub API path')
        if method == 'GET':
            if not path.startswith(READ_PREFIXES):
                raise ToolError('GET allowed only under /repos/ and /search/')
            return method, path
        if method in ('POST', 'PATCH') and path.startswith(WRITE_PREFIXES):
            if '/merge' in path or '/lock' in path:
                raise ToolError('merge/lock not allowed')
            return method, path
        raise ToolError(f'{method} {path} not allowed; writes only to issues in {STATE_REPO}')


    def _request(url, method='GET', headers=None, body=None, timeout=60):
        data = json.dumps(body).encode() if body is not None else None
        req = urllib.request.Request(url, data=data, method=method, headers=headers or {})
        if data is not None:
            req.add_header('Content-Type', 'application/json')
        started = time.monotonic()
        try:
            with urllib.request.urlopen(req, timeout=timeout) as resp:
                raw = resp.read()
                return resp.status, raw, int((time.monotonic() - started) * 1000), dict(resp.headers)
        except urllib.error.HTTPError as err:
            return err.code, err.read(), int((time.monotonic() - started) * 1000), dict(err.headers or {})


    def gh(method, path, body=None):
        headers = {
            'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
            'Accept': 'application/vnd.github+json',
            'User-Agent': f'dissosy-{PERSONA}',
        }
        status, raw, _, _ = _request('https://api.github.com' + path, method, headers, body)
        text = raw.decode('utf-8', 'replace')
        return status, text


    def tool_http_get(args):
        url = check_read_url(args['url'])
        status, raw, ms, headers = _request(url, headers={'User-Agent': f'dissosy-{PERSONA}'}, timeout=30)
        keep = {k: v for k, v in headers.items() if k.lower() in ('cache-control', 'server', 'content-type', 'location', 'eo-cache-status')}
        return json.dumps({'status': status, 'elapsed_ms': ms, 'headers': keep, 'body': raw.decode('utf-8', 'replace')[:MAX_BODY]})


    def tool_github(args):
        method, path = check_github(args.get('method', 'GET'), args['path'])
        if DRY_RUN and method != 'GET':
            return json.dumps({'dry_run': True, 'method': method, 'path': path})
        status, text = gh(method, path, args.get('body'))
        return json.dumps({'status': status, 'body': text[:MAX_BODY]})


    TOOLS = {
        'http_get': (tool_http_get, 'GET a public https URL on an allowlisted host. Returns status, elapsed_ms, a few headers, and the body (truncated).',
                     {'type': 'object', 'properties': {'url': {'type': 'string'}}, 'required': ['url']}),
        'github': (tool_github, f'Call the GitHub REST API. GET under /repos/ or /search/; POST/PATCH only on issues and labels of {STATE_REPO}.',
                   {'type': 'object', 'properties': {'method': {'type': 'string', 'enum': ['GET', 'POST', 'PATCH']},
                                                     'path': {'type': 'string'}, 'body': {'type': 'object'}},
                    'required': ['method', 'path']}),
    }


    def read_playbook(name):
        for ref in PLAYBOOK_REFS:
            q = urllib.parse.quote(ref, safe='')
            status, text = gh('GET', f'/repos/{STATE_REPO}/contents/dissosy/{name}?ref={q}')
            if status == 200:
                return base64.b64decode(json.loads(text)['content']).decode()
        raise RuntimeError(f'playbook dissosy/{name} not found on {PLAYBOOK_REFS}')


    def system_prompt():
        files = ['RUNBOOK.md', 'charter.md', 'policy.md', f'agents/{PERSONA}.md']
        docs = '\n\n'.join(f'===== dissosy/{f} =====\n{read_playbook(f)}' for f in files)
        return (
            f'You are Dissosy, the self-running operations mind of Reachieve LLC (re8ch), acting as the {PERSONA} persona. '
            'You run inside the re8ch cluster as a CronJob. Your only tools are http_get and github. '
            'Stripe, PayPal, Mercury and Gmail are NOT available in this runtime: skip those steps and write "covered by the cloud run". '
            'There is no shell and no git: read files through the GitHub contents API. '
            'Do not write the heartbeat yourself; the runner appends it after you finish. '
            'Follow the documents below exactly and stay inside policy.md. End with a 3-6 line summary.\n\n' + docs
        )


    def chat(messages):
        body = {'model': LLM_MODEL, 'messages': messages, 'temperature': 0.2,
                'tools': [{'type': 'function', 'function': {'name': n, 'description': d, 'parameters': p}} for n, (_, d, p) in TOOLS.items()]}
        headers = {'Authorization': f"Bearer {os.environ['LITELLM_API_KEY']}"}
        status, raw, _, _ = _request(LLM_BASE + '/chat/completions', 'POST', headers, body, timeout=180)
        if status != 200:
            raise RuntimeError(f'LiteLLM returned {status}: {raw[:500]!r}')
        return json.loads(raw)['choices'][0]['message']


    def run_loop():
        messages = [{'role': 'system', 'content': system_prompt()},
                    {'role': 'user', 'content': f'Run the {PERSONA} persona now. Current UTC time: {time.strftime("%Y-%m-%dT%H:%MZ", time.gmtime())}.'}]
        for _ in range(MAX_STEPS):
            msg = chat(messages)
            messages.append(msg)
            calls = msg.get('tool_calls') or []
            if not calls:
                return 'ok', (msg.get('content') or '').strip()
            for call in calls:
                name = call['function']['name']
                try:
                    args = json.loads(call['function'].get('arguments') or '{}')
                    result = TOOLS[name][0](args) if name in TOOLS else json.dumps({'error': f'unknown tool {name}'})
                except (ToolError, KeyError, ValueError) as err:
                    result = json.dumps({'error': str(err)})
                messages.append({'role': 'tool', 'tool_call_id': call['id'], 'content': result})
        return 'partial', f'stopped after {MAX_STEPS} steps'


    def heartbeat(status, summary):
        line = f"{time.strftime('%Y-%m-%dT%H:%MZ', time.gmtime())} · {PERSONA}@cluster · {status} · {summary.splitlines()[0][:300] if summary else '-'}"
        print(line)
        if DRY_RUN:
            return
        code, text = gh('GET', f'/repos/{STATE_REPO}/issues?labels=dsy/heartbeat&state=open&per_page=1')
        issues = json.loads(text) if code == 200 else []
        if issues:
            gh('POST', f"/repos/{STATE_REPO}/issues/{issues[0]['number']}/comments", {'body': line})


    def main():
        try:
            status, summary = run_loop()
        except Exception as err:  # the heartbeat must still be written
            status, summary = 'failed', f'{type(err).__name__}: {err}'
        print(summary)
        try:
            heartbeat(status, summary)
        except Exception as err:
            print(f'heartbeat failed: {err}', file=sys.stderr)
            return 1
        return 0 if status != 'failed' else 1


    if __name__ == '__main__':
        sys.exit(main())
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dissosy-ops-analyst
  namespace: ai-operations
  labels:
    app.kubernetes.io/name: dissosy-ops-analyst
    app.kubernetes.io/part-of: dissosy
spec:
  schedule: 22 7 * * 1-5
  timeZone: Africa/Maputo
  suspend: true
  startingDeadlineSeconds: 3600
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: dissosy-ops-analyst
            app.kubernetes.io/part-of: dissosy
        spec:
          serviceAccountName: dissosy
          automountServiceAccountToken: false
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/hostname: overseas-flk
          tolerations:
          - effect: NoSchedule
            key: dedicated
            operator: Equal
            value: overseas-edge
          - effect: NoSchedule
            key: scheduling.re8ch.com/capacity-window
            operator: Equal
            value: closed
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: persona
            image: docker.1ms.run/library/python@sha256:d09d15e60962ca365d1cd544a48773bac9d33f2fb1b00f2aa0deec78ade7dc31
            command:
            - python3
            - /app/runner.py
            env:
            - name: DISSOSY_PERSONA
              value: ops-analyst
            - name: LITELLM_BASE_URL
              value: http://litellm.llm-gateway.svc.cluster.local:4000/v1
            - name: LITELLM_MODEL
              value: deepseek-v4-flash
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: dissosy-ops-analyst-litellm
                  key: LITELLM_API_KEY
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dissosy-github
                  key: GITHUB_TOKEN
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 200m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
          volumes:
          - name: app
            configMap:
              name: dissosy-runner
